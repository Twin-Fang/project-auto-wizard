                    - listitem [ref=e2739]:
                      - paragraph [ref=e2740]:
                        - text: Claude Sonnet 4.6 was retired on September 1, 2026, but remains available to individual Copilot subscribers on annual Copilot Pro and Copilot Pro+ plans. It is not available to subscribers on monthly plans.
