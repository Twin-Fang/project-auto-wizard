                - heading [level=2] [ref=e698]:
                  - link "Models with extended capabilities" [ref=e699] [cursor=pointer]:
                    - /url: "#models-with-extended-capabilities"
                - paragraph [ref=e701]: The latest Copilot models support the following extended capabilities.
                - list [ref=e702]:
                  - listitem [ref=e703]:
                    - strong [ref=e704]: 1 million token context window
                    - text: ": Allows the model to process significantly more content in a single session. This is useful when working across large codebases, long documents, or complex multi-file projects. When you select a supported model, you can choose between the default context size or the extended (1 million token) context."
                  - listitem [ref=e705]:
                    - strong [ref=e706]: Configurable reasoning levels
                    - text: ": Controls the depth of the model's reasoning process before it generates a response. When you select a supported model, you can choose which reasoning level you want to use. Higher reasoning levels can improve the quality of responses to complex problems."
                - paragraph [ref=e707]: Choosing a larger context window or higher reasoning will impact AI credits consumption; more tokens will be consumed, so more credits will be used. For this reason, we recommend that you use the regular context window and regular reasoning by default, selecting the larger context window and higher reasoning for more complex tasks only.
                - generic [ref=e708]:
                  - paragraph [ref=e709]: Note
                  - paragraph
                  - list [ref=e712]:
                    - listitem [ref=e713]: The 1 million token context window is available in Visual Studio Code and Copilot CLI only.
                    - listitem [ref=e714]: Configurable reasoning levels are available in Visual Studio Code, Copilot CLI, and Copilot cloud agent.
                    - listitem [ref=e715]:
                      - text: Some models have extended capability pricing see
