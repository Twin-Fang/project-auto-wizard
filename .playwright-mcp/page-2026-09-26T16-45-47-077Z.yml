                      - paragraph [ref=e2720]:
                        - text: GPT-5.4 nano is currently only available in the Codex Visual Studio Code extension (Copilot Pro+ only) and is not available in Copilot Chat.
                        - link "Back to reference 1" [ref=e2721] [cursor=pointer]:
