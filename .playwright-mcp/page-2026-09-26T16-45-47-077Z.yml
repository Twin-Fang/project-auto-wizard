                    - listitem [ref=e2736]:
                      - paragraph [ref=e2737]:
                        - text: MAI models are continuously improving models. Performance and behavior may evolve over time as new checkpoints are released.
                        - link "Back to reference 3" [ref=e2738] [cursor=pointer]:
                          - /url: "#user-content-fnref-mai-models"
