                - generic [ref=e2474]:
                  - paragraph [ref=e2475]: Note
                  - paragraph
                  - list [ref=e2478]:
                    - listitem [ref=e2479]:
                      - text: If you're an organization or enterprise owner, you can enable or restrict access to specific models for your members. See
                      - link "Configuring access to AI models in GitHub Copilot" [ref=e2480] [cursor=pointer]:
                        - /url: /en/copilot/how-tos/copilot-on-github/set-up-copilot/configure-access-to-ai-models#setup-for-organization-and-enterprise-plans
                      - text: .
                - heading [level=2] [ref=e2481]:
                  - link "Fallback and long-term support (LTS) models" [ref=e2482] [cursor=pointer]:
                    - /url: "#fallback-and-long-term-support-lts-models"
                - paragraph [ref=e2484]:
                  - text: For more information about fallback and LTS models, see
                  - link "Base and long-term support (LTS) models" [ref=e2485] [cursor=pointer]:
                    - /url: /en/copilot/concepts/models/fallback-and-lts-models
                  - text: .
                - heading [level=2] [ref=e2486]:
                  - link "Evaluation models" [ref=e2487] [cursor=pointer]:
                    - /url: "#evaluation-models"
                - paragraph [ref=e2489]: GitHub Copilot offers access to evaluation models.
                - generic [ref=e2490]:
                  - paragraph [ref=e2491]: Important
                  - paragraph
                  - list [ref=e2494]:
                    - listitem [ref=e2495]: Testing revealed evaluation models may perform worse than other models on security-related, or other categories of prompts.
                    - listitem [ref=e2496]: Users should always carefully review and validate code, including code security, using a range of models and with a thorough human review before incorporating suggestions into production.
                - paragraph [ref=e2497]: "Evaluation models may appear in the product with codenames rather than official model or provider names. These models come from or are fine-tuned by one or more of the following providers: Microsoft, OpenAI, Anthropic, and Google. Data handling for each provider is limited to GitHub's existing agreement with that provider, and evaluation models undergo GitHub and Microsoft testing and verification before release."
                - paragraph [ref=e2498]: Evaluation models may be added, updated, or removed without notice. Availability and rate limits may differ from generally available models.
                - paragraph [ref=e2499]: "Access to evaluation models in auto model selection for users Copilot plans for individuals is governed by a policy. To disable evaluation models:"
                - list [ref=e2500]:
                  - listitem [ref=e2501]:
                    - text: In the upper-right corner of any page on GitHub, click your profile picture, then click
                    - strong [ref=e2502]:
                      - img "gear" [ref=e2503]
                      - text: Settings
                    - text: .
                  - listitem [ref=e2505]:
                    - text: At the top of the page, click
                    - strong [ref=e2506]:
                      - img "copilot" [ref=e2507]
                      - text: AI controls
                    - text: .
                  - listitem [ref=e2510]:
                    - text: For the
                    - strong [ref=e2511]: Evaluation models in Copilot auto model selection
                    - text: setting, select
                    - strong [ref=e2512]: Disabled
                    - text: from the dropdown.
                - heading [level=2] [ref=e2513]:
                  - link "Utility models" [ref=e2514] [cursor=pointer]:
                    - /url: "#utility-models"
                - paragraph [ref=e2516]:
                  - text: Utility models power background features across surfaces, and cannot be disabled or selected in the model picker. See
                  - link "Utility models" [ref=e2517] [cursor=pointer]:
                    - /url: /en/copilot/concepts/models/utility-models
                  - text: .
                - paragraph [ref=e2518]: "The following models are currently used as utility models:"
                - list [ref=e2519]:
                  - listitem [ref=e2520]: GPT-4o mini
                  - listitem [ref=e2521]: GPT-4o
                  - listitem [ref=e2522]: GPT-4.1
                  - listitem [ref=e2523]: GPT-5.4 nano
                - heading [level=2] [ref=e2524]:
                  - link "Models eligible for default enablement" [ref=e2525] [cursor=pointer]:
                    - /url: "#models-eligible-for-default-enablement"
                - paragraph [ref=e2527]:
                  - text: For enterprises on a Copilot Business or Copilot Enterprise plan, a policy controls whether unconfigured generally available (GA) models are enabled or disabled by default. See
                  - link "About default availability of Copilot features and models" [ref=e2528] [cursor=pointer]:
                    - /url: /en/copilot/concepts/enterprise/default-model-availability
                  - text: .
                - paragraph [ref=e2529]:
                  - text: The default policy applies to models that you have not explicitly configured. These models are indicated in your enterprise or organization's model settings with the
                  - strong [ref=e2530]: Delegate to Default Policy
                  - text: label. When a new model is released, it inherits the default until you explicitly configure it.
                - paragraph [ref=e2531]:
                  - text: The following models are
                  - strong [ref=e2532]: not
                  - text: in scope. They are disabled by default, regardless of your "Default availability" policy setting.
                - list [ref=e2533]:
                  - listitem [ref=e2534]: Pre-GA models
                  - listitem [ref=e2535]: Open weight models (DeepSeek, Kimi K2.7 Code, Kimi K3)
                  - listitem [ref=e2536]: Models that are not covered by GitHub's data retention agreement (Claude Fable 5, Claude Fable 5.1)
                  - listitem [ref=e2537]: For enterprises that have restricted models to data-resident or FedRAMP-compliant models, any models that do not respect these policies
                - heading [level=2] [ref=e2538]:
                  - link "Model support" [ref=e2539] [cursor=pointer]:
                    - /url: "#model-support"
                - paragraph [ref=e2541]:
                  - text: If a particular model seems unavailable, refer to the model vendor's support page for the latest information about its availability. If more than one model from different vendors is unavailable, contact
                  - link "GitHub Support" [ref=e2542] [cursor=pointer]:
                    - /url: https://support.github.com
                  - text: or refer to the
                  - link "GitHub status page" [ref=e2543] [cursor=pointer]:
                    - /url: https://www.githubstatus.com/
                  - text: for additional information.
                - heading [level=2] [ref=e2544]:
                  - link "Model retirement history" [ref=e2545] [cursor=pointer]:
                    - /url: "#model-retirement-history"
                - paragraph [ref=e2547]: The following table lists AI models that are retired or scheduled for retirement from Copilot, along with their retirement dates and suggested alternatives.
