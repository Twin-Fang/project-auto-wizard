# CI.yaml
# Test workflow (repo-only — not copied into payload)
#
# Behavior:
# - Runs npm test (Node + Python) on PRs and main pushes
# - Matrix of Node 20/22/24 x ubuntu/windows (6 combinations)
#
# Why Windows is included: there was a Windows CRLF regression and
# tests/node/line-endings.test.js guards against it. Running only on Linux
# would defeat the purpose of that test.
#
# Why Node 20 is the floor: engines (">=20.12") in package.json and the
# runtime gate in bin/project-auto-wizard.js require 20.12.
#
# There are zero dependencies and no package-lock.json, so there is no install step.
#
# The coverage job runs the same tests once more on one combination (ubuntu, Node 24) and
# writes the Node and Python coverage table to the job summary. coverage.py is installed only
# in that job; it is not a project dependency. There is no minimum threshold yet.

name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # Keep going when one combination fails, so we can tell "Windows only" from "Node 24 only".
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Set up Python (for test:py)
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Show versions
        run: |
          node --version
          npm --version
          python --version

      - name: Run tests
        run: npm test

  coverage:
    name: Coverage (Node 24 · ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # --test-coverage-include needs Node 22.5+, so coverage is not measured on Node 20.
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # Latest coverage.py: tests/py/.coveragerc uses the newer `patch = subprocess` setting.
      - name: Install coverage.py
        run: python -m pip install coverage

      - name: Measure coverage
        run: npm run test:coverage
