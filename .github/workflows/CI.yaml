# CI.yaml
# Test workflow (repo-only — not copied into payload)
#
# Behavior:
# - Runs npm test (Node + Python) on PRs and main pushes
# - Matrix of Node 20/22/24 x ubuntu/windows (6 combinations)
#
# Why Windows is included: there was a Windows CRLF regression and
# tests/node/line-endings.test.js guards against it. Running only on Linux
# would defeat the purpose of that test.
#
# Why Node 20 is the floor: engines (">=20.12") in package.json and the
# runtime gate in bin/project-auto-wizard.js require 20.12.
#
# There are zero dependencies and no package-lock.json, so there is no install step.

name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # Keep going when one combination fails, so we can tell "Windows only" from "Node 24 only".
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Set up Python (for test:py)
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Show versions
        run: |
          node --version
          npm --version
          python --version

      - name: Run tests
        run: npm test
