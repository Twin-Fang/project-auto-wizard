# DOCS-PAGES.yaml
# Docs site (website/) build and GitHub Pages deploy workflow (repo-only — not copied into payload)
#
# Behavior:
# - When website/ changes land on main, builds the Astro Starlight site and deploys it to Pages
# - Manual redeploy via workflow_dispatch
#
# Why it is separate from the release workflows:
#   A path filter makes it react only to website/ changes, so version bumps and
#   CHANGELOG commits do not trigger it. It also never shares a concurrency
#   group with the release flow.
#
# Prerequisite: set Settings -> Pages -> Build and deployment -> Source to "GitHub Actions".
#   The site URL is https://twin-fang.github.io/project-auto-wizard/ (base is in website/astro.config.mjs).

name: DOCS-PAGES

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/DOCS-PAGES.yaml"
  workflow_dispatch:

# Cancelling a run mid-deploy could leave Pages half-updated, so runs are queued instead of cancelled
concurrency:
  group: docs-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Astro requires Node 22.12 or newer (separate from the root CLI's Node 20 floor)
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # deploy-pages deploys to Pages with an OIDC token, so only this job gets write permissions
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
