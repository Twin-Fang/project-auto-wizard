# NPM-PUBLISH.yaml
# project-auto-wizard npm auto-publish workflow (repo-only)
#
# Behavior:
# - When a GitHub Release is published, checks out that tag and publishes to npm
# - Extracts the version from the tag and fails if it differs from version.yml
# - Runs the tests before publishing (only verified code ships)
# - Exits successfully if the version is already on the registry (idempotent),
#   including when npm answers E409 because another run just published it
# - The README version line is committed after the tag, so it is aligned to the
#   published version right before packaging
# - Attaches provenance so the build commit and workflow can be verified
#
# Trigger: GitHub Release published (+ workflow_dispatch for manual republish)
#
# Why a main push is not the trigger:
#   It started at the same time as the VERSION-CONTROL version bump and raced with
#   it; when it lost, [skip ci] prevented a retrigger and that version was never
#   published. 0.1.13, 0.1.15 and 0.1.19 were actually missed. A tag is an
#   immutable snapshot, so what gets published no longer depends on timing.
#
# Prerequisite: RELEASE-PUBLISH must publish the Release with WORKFLOW_PAT for this
#   workflow to start. Events created by GITHUB_TOKEN do not trigger other
#   workflows by GitHub policy.
#
# Required secret: NPM_TOKEN (npm Granular Access Token)
#   Note: registering a Trusted Publisher on npmjs.com lets you publish via OIDC without this secret.

name: NPM-PUBLISH

concurrency:
  group: npm-publish
  cancel-in-progress: false

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to republish (e.g. v0.1.20)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  # Keep __pycache__ (created when tests import payload/scripts) out of the package
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  publish-npm:
    name: Publish npm package
    runs-on: ubuntu-latest

    steps:
      - name: Resolve target tag
        id: target
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "Cannot determine the tag to publish"
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "Target: $TAG (version ${TAG#v})"

      - name: Checkout repository (at the release tag)
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Set up Python (for test:py)
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Verify tag matches version.yml
        run: |
          FILE_VERSION=$(python3 payload/scripts/version_manager.py get | tail -n 1)
          TAG_VERSION="${{ steps.target.outputs.version }}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag ($TAG_VERSION) differs from version.yml ($FILE_VERSION) - aborting publish"
            exit 1
          fi
          echo "Version match confirmed: $TAG_VERSION"

      - name: Run tests (publish gate)
        run: npm test

      - name: Inject package.json version
        run: npm pkg set version=${{ steps.target.outputs.version }}

      - name: Align README version line to the published version
        # The README version commit is created after the release tag, so the README in
        # the tag snapshot is always one version behind. The npm page shows this README,
        # so it is fixed right before packaging (not committed).
        run: |
          VERSION="${{ steps.target.outputs.version }}"
          RELEASE_DATE=$(git log -1 --format=%cs)
          sed -i -E "/AUTO-VERSION-SECTION/{n;s/^(##[^:]*:[[:space:]]*).*/\1v${VERSION} (${RELEASE_DATE})/;}" README.md
          if grep -qF "v${VERSION} (${RELEASE_DATE})" README.md; then
            echo "README version line: $(grep -A1 'AUTO-VERSION-SECTION' README.md | tail -n 1)"
          else
            echo "::warning::Could not find the AUTO-VERSION-SECTION version line in README.md, so it was not updated"
          fi

      - name: Check whether the version is already published (idempotent)
        id: check
        run: |
          PKG_NAME=$(npm pkg get name | tr -d '"')
          VERSION="${{ steps.target.outputs.version }}"
          if npm view "${PKG_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "${PKG_NAME}@${VERSION} is already published. Skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Preview publish contents
        if: steps.check.outputs.skip == 'false'
        run: npm publish --dry-run --access public

      - name: Publish to npm
        id: publish
        if: steps.check.outputs.skip == 'false'
        # A duplicate run (release + workflow_dispatch for the same tag) can pass the check above
        # before the registry reflects the first publish, and npm answers E409. That means the
        # version is already published, so it is treated as success; any other failure still fails.
        run: |
          if OUTPUT=$(npm publish --provenance --access public 2>&1); then
            STATUS=0
          else
            STATUS=$?
          fi
          echo "$OUTPUT"
          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi
          if echo "$OUTPUT" | grep -q "E409"; then
            echo "already_published=true" >> $GITHUB_OUTPUT
            echo "::notice::E409: this version is already published/staged by another run. Treating as success."
            exit 0
          fi
          exit "$STATUS"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish summary
        if: steps.check.outputs.skip == 'false' && steps.publish.outputs.already_published != 'true'
        run: echo "project-auto-wizard@${{ steps.target.outputs.version }} published to npm (provenance attached)"
