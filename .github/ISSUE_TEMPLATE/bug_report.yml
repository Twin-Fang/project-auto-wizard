name: 버그 리포트
description: 예상과 다르게 동작하는 부분을 신고합니다
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 무슨 일이 있었나요?
      description: 실제로 어떤 일이 발생했는지 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대했던 동작
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: 실행한 명령어
      placeholder: "npx project-auto-wizard --mode full --force --type node"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: project-auto-wizard 버전
      placeholder: "npx project-auto-wizard -v 출력값"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
