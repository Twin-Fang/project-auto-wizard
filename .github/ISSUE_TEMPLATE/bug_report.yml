name: Bug report
description: Report behavior that differs from what you expected
labels: ["type: bug", "status: needs triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what actually happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: "npx project-auto-wizard --mode full --force --type node"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: project-auto-wizard version
      placeholder: "Output of npx project-auto-wizard -v"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
