# @wizard ask 마커의 사용자 질문 문구.
# 형식 1 (구형, 지원 유지): KEY: "라벨"
# 형식 2 (신규 블록): KEY 아래 label/help/example 들여쓰기 2칸
# 형식 3 (타입 오버라이드): "{type}.KEY" 키로 타입별 문구 분리
# 조회 우선순위: {type}.KEY -> KEY -> 구형 -> 폴백(KEY명)
# 기본값/resolver는 여기 두지 않는다(@wizard 마커 소관).

PROJECT_NAME:
  label: "서비스 식별자 (영문 슬러그)"
  help: "Docker 컨테이너명·이미지명·배포 도메인 prefix에 그대로 사용됩니다. 소문자-하이픈 권장."
  example: "my-service"

flutter.APP_ARTIFACT_NAME:
  label: "앱 산출물 이름 (영문)"
  help: "빌드된 APK 파일명·아티팩트명·빌드 히스토리 파일명에 사용됩니다."
  example: "my-app"

SERVICE_DOMAIN:
  label: "서비스 도메인"
  help: "배포 후 외부에서 접속할 운영 도메인입니다. 실제 보유한 도메인으로 바꿔야 합니다."
  example: "api.example.com"

JAVA_VERSION:
  label: "빌드 JDK 버전"
  help: "GitHub Actions 빌드 러너의 JDK 버전입니다. Spring은 보통 21, Flutter Android는 17."
  example: "21"

DEPLOY_PORT:
  label: "외부 노출 포트"
  help: "호스트(서버)에서 컨테이너로 연결할 포트입니다. 다른 서비스와 겹치지 않게 정하세요."
  example: "8080"

ENABLE_VOLUME_MOUNT:
  label: "볼륨 마운트 사용"
  help: "켜면 아래 호스트/컨테이너 경로가 실제 배포에 반영되어 컨테이너에 볼륨이 마운트됩니다. 끄면(기본값) 경로를 입력해도 무시됩니다."
  example: "true"

VOLUME_HOST_PATH:
  label: "호스트(NAS) 볼륨 경로"
  help: "서버에 데이터를 영구 저장할 실제 디렉토리 경로입니다."
  example: "/volume1/projects/my-service"

VOLUME_CONTAINER_PATH:
  label: "컨테이너 내부 마운트 경로"
  help: "컨테이너 안에서 위 볼륨이 보일 위치입니다."
  example: "/mnt/my-service"

SSH_AUTH_METHOD:
  label: "SSH 인증 방식"
  help: "배포 서버 접속 방식입니다. 둘 중 하나를 그대로 입력하세요."
  example: "password 또는 key"

SSH_PORT:
  label: "SSH 포트"
  help: "배포 서버에서 SSH가 열려 있는 포트입니다 (일반 서버는 보통 22, NAS 등은 따로 정한 포트)."
  example: "22"

BLUE_PORT:
  label: "무중단 배포 Blue 포트"
  help: "Blue/Green으로 번갈아 뜨는 컨테이너 중 Blue 쪽 호스트 포트입니다. 다른 서비스·Green 포트와 겹치지 않게 정하세요."
  example: "8080"

GREEN_PORT:
  label: "무중단 배포 Green 포트"
  help: "Blue/Green으로 번갈아 뜨는 컨테이너 중 Green 쪽 호스트 포트입니다. Blue 포트와 달라야 합니다."
  example: "8081"

NGINX_RP_CONF:
  label: "Nginx 리버스 프록시 설정 파일 경로"
  help: "배포 때 proxy_pass 포트를 Blue/Green으로 바꿔 쓰는 서버의 Nginx 설정 파일입니다. 경로가 틀리면 무중단 전환이 동작하지 않습니다."
  example: "/etc/nginx/sites-enabled/my-service.conf"

NGINX_BACKUP_DIR:
  label: "Nginx 설정 백업 폴더"
  help: "설정 파일을 바꾸기 전에 백업을 남길 서버의 폴더입니다."
  example: "/volume1/projects/nginx/backups"

JAR_PATH:
  label: "빌드 산출물(JAR) 경로"
  help: "Gradle 빌드 후 PR 프리뷰 컨테이너에 넣을 JAR 파일 경로입니다 (프로젝트 루트 기준, 와일드카드 가능)."
  example: "build/libs/*.jar"

PREVIEW_DOMAIN_SUFFIX:
  label: "PR 프리뷰 도메인 접미사"
  help: "PR마다 뜨는 프리뷰 서버 주소의 뒷부분입니다. 이 도메인의 와일드카드 DNS가 서버(Traefik)를 가리켜야 합니다."
  example: "pr.example.com"

PROJECT_TARGET_DIR:
  label: "PR 프리뷰 호스트 볼륨 경로"
  help: "PR 프리뷰 컨테이너에 마운트할 서버의 데이터 디렉토리입니다. 비워 두면 마운트하지 않습니다."
  example: "/volume1/projects/my-service"

PROJECT_MNT_DIR:
  label: "PR 프리뷰 컨테이너 마운트 경로"
  help: "위 호스트 볼륨이 PR 프리뷰 컨테이너 안에서 보일 위치입니다."
  example: "/mnt/my-service"

ISSUE_HELPER_CREATE_BRANCH:
  label: "이슈 생성 시 브랜치 자동 생성"
  help: "이슈가 열리면 base 브랜치 기준으로 브랜치를 자동으로 만듭니다. 원치 않으면 기본값(아니오)을 그대로 두세요."
  example: "true"

# workflow filename (partial match) -> human readable short name
# wizard uses this to build "[usage]" in env questions.
_workflow_names:
  NONSTOP-NGINX: "무중단배포(Nginx)"
  NONSTOP-TRAEFIK: "무중단배포(Traefik)"
  PR-PREVIEW: "PR 프리뷰"
  SIMPLE-CICD: "단일 서버 배포"
  REACT-CICD: "프론트 배포"
  REACT-CI: "프론트 빌드"
  NEXT-CICD: "프론트 배포"
  NEXT-CI: "프론트 빌드"
  PYTHON-CI: "빌드 검증"
  FLUTTER-ANDROID-SELFHOSTED: "안드로이드 자체배포"
  FLUTTER-ANDROID-PLAYSTORE: "플레이스토어 배포"
  FLUTTER-ANDROID-FIREBASE: "Firebase 배포"
  ISSUE-HELPER: "이슈 헬퍼"
