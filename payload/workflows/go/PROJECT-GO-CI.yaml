# project-auto-wizard:managed-workflow
# Go 빌드 검증 워크플로우 (CI Only)
# - {{DEVELOP_BRANCH}} 브랜치에 push/PR 시 go build/vet/test/lint로 검증
# - Dockerfile이 필요 없어 CLI 도구·라이브러리 등 배포하지 않는 Go 프로젝트도 사용 가능
# - go.mod의 go 지시자 버전을 자동으로 사용 (버전 하드코딩 없음)

name: PROJECT-GO-CI

on:
  push:
    branches:
      - "{{DEVELOP_BRANCH}}"  # {{DEVELOP_BRANCH}} 브랜치 push 시 빌드 검증
  pull_request:
    branches:
      - "{{DEVELOP_BRANCH}}"  # {{DEVELOP_BRANCH}} 브랜치로의 PR 시 빌드 검증
  workflow_dispatch:  # 수동 실행 허용

env:
  # 프로젝트 고유 식별자
  PROJECT_NAME: "__PROJECT_NAME__"  # @wizard ask:@repo
  # 모노레포에서 이 프로젝트가 있는 하위 경로 ('.'이면 항상 검증)
  PROJECT_PATH: "."  # @wizard auto:project-path

jobs:
  # 변경 감지 (모노레포에서 이 프로젝트 경로가 바뀌었는지 판별)
  changes:
    name: 변경 감지
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      project: ${{ steps.filter.outputs.project }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: 프로젝트 경로 변경 여부 판별
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            project:
              - '${{ env.PROJECT_PATH == '.' && '**' || format('{0}/**', env.PROJECT_PATH) }}'

  # Job: 빌드 검증
  build-check:
    name: Go 빌드 검증
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.project == 'true' }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v7

      # go.mod의 go 지시자 버전 자동 사용
      - name: Go 설정
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go build 검증
        run: go build ./...

      - name: go vet 검증
        run: go vet ./...

      - name: go test 실행
        run: go test ./...

      # golangci-lint v8은 golangci-lint v2 계열을 요구 — .golangci.yml이 v1 형식이면
      # 프로젝트에서 별도 조정 필요. version: latest는 v2 최신 패치를 자동으로 받는다
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: 빌드 검증 완료
        run: |
          echo "✅ Go 빌드 검증이 성공적으로 완료되었습니다!"
          echo ""
          echo "📋 빌드 정보:"
          echo "  🎯 프로젝트: ${{ env.PROJECT_NAME }}"
          echo "  🌿 브랜치: ${{ github.ref_name }}"
          echo "  📝 커밋: ${{ github.sha }}"
          echo "  ⏰ 검증 시간: $(date '+%Y-%m-%d %H:%M:%S')"

  # Job: CI Gate (required check로 등록할 단일 job)
  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [changes, build-check]
    runs-on: ubuntu-latest
    steps:
      - name: 결과 집계
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "needs 결과: $RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "실패하거나 취소된 job이 있습니다."
            exit 1
          fi
