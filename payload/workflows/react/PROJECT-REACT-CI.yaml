# project-auto-wizard:managed-workflow
# React / Next.js CI (build verification)
# On push/PR to the {{DEVELOP_BRANCH}} branch, verifies with npm ci, npm test (when a test script exists) and npm run build. Caches node_modules and the build output.
#
# GitHub Secrets
#   ENV_FILE (optional): contents of the .env file. CI only verifies the build, so no deploy-related Secrets are needed
#
# Project settings (env section)
#   PROJECT_NAME : project name
#   NODE_VERSION : Node.js version (default: 20.15.0)
#   ENV_FILE     : environment file name (default: .env)

name: PROJECT-REACT-CI

on:
  push:
    branches: ["{{DEVELOP_BRANCH}}"]
  pull_request:
    branches: ["{{DEVELOP_BRANCH}}"]
  workflow_dispatch:

env:
  PROJECT_NAME: "__PROJECT_NAME__"  # @wizard ask:@repo
  NODE_VERSION: "20.15.0"
  ENV_FILE: ".env"
  # Subdirectory of this project in a monorepo ('.' means always verify)
  PROJECT_PATH: "."  # @wizard auto:project-path

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Job: change detection (in a monorepo, checks whether this project's path changed)
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      project: ${{ steps.filter.outputs.project }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check whether the project path changed
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          # A push only looks at this push's range (against the previous commit, 'before'). Left empty it would be the cumulative diff against the default branch.
          # The first push of a new branch (before is 0) and PRs get an empty value -> default behavior (against the default branch / PR base)
          base: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
          filters: |
            project:
              - '${{ env.PROJECT_PATH == '.' && '**' || format('{0}/**', env.PROJECT_PATH) }}'

  build:
    name: Build React/Next.js application
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.project == 'true' }}
    # In a monorepo (--paths), build inside that subfolder
    defaults:
      run:
        working-directory: ${{ env.PROJECT_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create environment file (${{ env.ENV_FILE }})
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          echo -e "${{ secrets.ENV_FILE || secrets.ENV }}" > ${{ env.ENV_FILE }}
          m cicd.env_file_created file="${{ env.ENV_FILE }}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ env.PROJECT_PATH }}/package-lock.json

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # Skip npm ci when package-lock.json has not changed
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      # Runs only on a cache miss (npm ci installs the exact versions from package-lock.json)
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          m cibuild.node_deps_installing
          npm ci
          m cibuild.node_deps_done

      # Cache the Next.js build (for Next.js projects)
      # Caches the .next/cache folder to speed up incremental builds
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: ${{ env.PROJECT_PATH }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      # Runs only when package.json has a test script (the npm init default "no test specified" counts as none)
      - name: Run tests
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          TEST_SCRIPT=$(node -p "(require('./package.json').scripts || {}).test || ''")
          if [ -z "$TEST_SCRIPT" ] || echo "$TEST_SCRIPT" | grep -q "no test specified"; then
            m cibuild.node_no_test_script
            exit 0
          fi
          m cibuild.node_test_run script="$TEST_SCRIPT"
          # CI=true: run watch-mode test runners (react-scripts, etc.) only once
          CI=true npm test

      # Even when the build fails, keep the workflow going to collect the error log
      - name: Build project
        id: build
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          m cibuild.node_build_start
          m cibuild.node_build_project project="${{ env.PROJECT_NAME }}"
          m cibuild.node_build_node node="${{ env.NODE_VERSION }}"
          echo ""
          
          # Run the build and save the log
          # On failure, exit 0 so the workflow continues (to collect the error log)
          npm run build > build_log.txt 2>&1 || {
            echo "build_failed=true" >> $GITHUB_OUTPUT
            echo "status=failed" >> $GITHUB_OUTPUT
            echo ""
            m cibuild.node_build_failed
            exit 0
          }
          
          echo "build_failed=false" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT
          m cibuild.node_build_ok

          # Only Next.js builds create .next; other React builds skip this block
          if [ -d ".next" ]; then
            echo ""
            m cibuild.node_build_output
            m cibuild.node_build_next_dir
            du -sh .next/ || true
          fi

      # Runs only when the build failed
      - name: Print build error log
        if: steps.build.outputs.build_failed == 'true'
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          m cibuild.node_errlog_title
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          # Print only the last 50 lines of the log (the full log is available in the artifact)
          if [ -f "build_log.txt" ]; then
            tail -n 50 build_log.txt
          else
            m cibuild.node_errlog_missing
          fi
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # End the workflow because the build failed
          exit 1

      # Save the log regardless of build success or failure (nothing to upload when the build step did not run, e.g. tests failed)
      - name: Upload build log
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: ${{ env.PROJECT_PATH }}/build_log.txt
          retention-days: 7  # keep for 7 days

      # Summarize the workflow result for readability
      - name: Build result summary
        if: always()
        # Values go through env (not inlined into the script). On a PR, github.head_ref is the PR branch (ref_name would be '<n>/merge')
        env:
          BUILD_STATUS: ${{ steps.build.outputs.status }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ "$BUILD_STATUS" = "success" ]; then
            m cibuild.node_result_ok
          else
            m cibuild.node_result_fail
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          m cibuild.node_result_title
          m cibuild.node_result_project project="${{ env.PROJECT_NAME }}"
          m cibuild.node_result_node node="${{ env.NODE_VERSION }}"
          # An empty status means the build step never ran (an earlier step such as the tests failed)
          if [ -z "$BUILD_STATUS" ]; then
            m cibuild.node_result_status_not_run
          else
            m cibuild.node_result_status status="$BUILD_STATUS"
          fi
          m cibuild.node_result_branch branch="$BRANCH_NAME"
          m cibuild.node_result_commit sha="$COMMIT_SHA"
          m cibuild.node_result_time time="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          if [ "$BUILD_STATUS" = "success" ]; then
            m cibuild.node_all_ok
          elif [ -z "$BUILD_STATUS" ]; then
            # The build log artifact does not exist in this case, so do not point to it
            m cibuild.node_build_not_run
            m cibuild.node_build_not_run_hint
          else
            m cibuild.node_error_occurred
            m cibuild.node_log_hint
          fi

  # Job: CI Gate (the single job to register as a required check)
  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
      # Only the message catalog is needed here, so check out just that
      - name: Checkout message catalog
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/messages.py
            version.yml
          sparse-checkout-cone-mode: false

      - name: Aggregate results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          m cibuild.gate_results results="$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            m cibuild.gate_failed
            exit 1
          fi
