# project-auto-wizard:managed-workflow
# Next.js CI (빌드 검증)
# {{DEVELOP_BRANCH}} 브랜치 push·PR 시 npm ci, npm test(test 스크립트가 있을 때), npm run build로 검증합니다. node_modules와 .next/cache를 캐싱합니다.
#
# GitHub Secrets
#   ENV_FILE (선택): .env 파일 내용. CI는 빌드 검증 목적이므로 배포 관련 Secrets는 불필요
#
# 프로젝트별 설정 (env 섹션)
#   PROJECT_NAME : 프로젝트 이름
#   NODE_VERSION : Node.js 버전 (기본: 20.15.0)
#   ENV_FILE     : 환경변수 파일명 (기본: .env)

name: PROJECT-NEXT-CI

on:
  push:
    branches: ["{{DEVELOP_BRANCH}}"]
  pull_request:
    branches: ["{{DEVELOP_BRANCH}}"]
  workflow_dispatch:

env:
  PROJECT_NAME: "__PROJECT_NAME__"  # @wizard ask:@repo
  NODE_VERSION: "20.15.0"
  ENV_FILE: ".env"
  # 모노레포에서 이 프로젝트가 있는 하위 경로 ('.'이면 항상 검증)
  PROJECT_PATH: "."  # @wizard auto:project-path

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Job: 변경 감지 (모노레포에서 이 프로젝트 경로가 바뀌었는지 판별)
  changes:
    name: 변경 감지
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      project: ${{ steps.filter.outputs.project }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: 프로젝트 경로 변경 여부 판별
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          # push는 이번 push 범위(직전 커밋 before 대비)만 본다. 비워 두면 기본 브랜치 대비 누적 diff가 된다.
          # 새 브랜치 첫 push(before가 0)와 PR은 빈 값 → 기본 동작(기본 브랜치·PR base 대비)
          base: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
          filters: |
            project:
              - '${{ env.PROJECT_PATH == '.' && '**' || format('{0}/**', env.PROJECT_PATH) }}'

  build:
    name: Next.js 애플리케이션 빌드
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.project == 'true' }}
    # 모노레포(--paths)면 그 하위 폴더에서 빌드한다
    defaults:
      run:
        working-directory: ${{ env.PROJECT_PATH }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v7

      - name: 환경변수 파일 생성 (${{ env.ENV_FILE }})
        run: |
          echo -e "${{ secrets.ENV_FILE || secrets.ENV }}" > ${{ env.ENV_FILE }}
          echo "✅ ${{ env.ENV_FILE }} 파일 생성 완료"

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ env.PROJECT_PATH }}/package-lock.json

      - name: npm 의존성 캐싱
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: node_modules 캐싱
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: 의존성 설치
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          echo "📦 의존성 설치 중..."
          npm ci
          echo "✅ 의존성 설치 완료"

      # Next.js 빌드 캐싱 (.next/cache)
      # 증분 빌드를 위해 .next/cache 폴더를 캐싱합니다
      - name: Next.js 빌드 캐싱
        uses: actions/cache@v6
        with:
          path: ${{ env.PROJECT_PATH }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      # package.json에 test 스크립트가 있을 때만 실행한다 (npm init 기본값 "no test specified"는 없는 것으로 본다)
      - name: 테스트 실행
        run: |
          TEST_SCRIPT=$(node -p "(require('./package.json').scripts || {}).test || ''")
          if [ -z "$TEST_SCRIPT" ] || echo "$TEST_SCRIPT" | grep -q "no test specified"; then
            echo "::notice::package.json에 test 스크립트가 없어 테스트를 건너뜁니다"
            exit 0
          fi
          echo "🧪 npm test 실행: $TEST_SCRIPT"
          # CI=true: watch 모드로 대기하는 테스트 러너(react-scripts 등)를 한 번만 실행
          CI=true npm test

      - name: 프로젝트 빌드
        id: build
        run: |
          echo "🔨 Next.js 빌드 시작..."
          echo "프로젝트: ${{ env.PROJECT_NAME }}"
          echo "Node.js: ${{ env.NODE_VERSION }}"
          echo ""

          # 빌드 실행 및 로그 저장
          npm run build > build_log.txt 2>&1 || {
            echo "build_failed=true" >> $GITHUB_OUTPUT
            echo "status=failed" >> $GITHUB_OUTPUT
            echo ""
            echo "❌ 빌드 실패"
            exit 0
          }

          echo "build_failed=false" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT
          echo "✅ 빌드 완료"

          # 빌드 결과 확인
          if [ -d ".next" ]; then
            echo ""
            echo "📁 빌드 결과물:"
            echo "  - .next/ 폴더 생성됨"
            du -sh .next/ || true
          fi

      - name: 빌드 에러 로그 출력
        if: steps.build.outputs.build_failed == 'true'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "❌ 빌드 실패 - 에러 로그"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          if [ -f "build_log.txt" ]; then
            tail -n 50 build_log.txt
          else
            echo "에러 로그 파일을 찾을 수 없습니다."
          fi

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          exit 1

      - name: 빌드 로그 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: ${{ env.PROJECT_PATH }}/build_log.txt
          retention-days: 7

      - name: 빌드 결과 요약
        if: always()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ "${{ steps.build.outputs.status }}" = "success" ]; then
            echo "🎉 Next.js 빌드 완료!"
          else
            echo "❌ Next.js 빌드 실패"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📊 빌드 결과:"
          echo "  📦 프로젝트: ${{ env.PROJECT_NAME }}"
          echo "  📌 Node.js 버전: ${{ env.NODE_VERSION }}"
          echo "  🆙 빌드 상태: ${{ steps.build.outputs.status }}"
          echo "  🌿 브랜치: ${{ github.ref_name }}"
          echo "  📝 커밋: ${{ github.sha }}"
          echo "  🕐 시간: $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # Job: CI Gate (required check로 등록할 단일 job)
  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
      - name: 결과 집계
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "needs 결과: $RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "실패하거나 취소된 job이 있습니다."
            exit 1
          fi
