# project-auto-wizard:managed-workflow
# Flutter Android test APK build workflow
#
# Run this workflow manually from a feature branch
# to build a test Android APK.
#
# Highlights:
# - Runs manually via workflow_dispatch or is triggered by repository_dispatch
# - The version is read dynamically from version.yml (same as production; builds are told apart by build number)
# - Extracts the issue number from the branch name automatically (YYYYMMDD_#issue-number_title format)
# - Fetches the issue through the GitHub API and includes it in the build info
# - Only produces the APK file (no Play Store deploy)
# - Uploaded as an artifact you can download (up to 500MB per artifact)
# - The artifact name includes the branch name so builds are easy to tell apart
# - Firebase App Distribution integration (when the FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 secret exists)
#
# Usage:
# 1. Check out a feature branch
# 2. Select this workflow in GitHub Actions
# 3. Click the "Run workflow" button
# 4. When the build finishes, download the APK from the artifacts
#
# GitHub Secrets (all optional — the test APK builds even with none of them)
#
# Release Keystore (same as the Play Store deploy; if missing, a warning is shown and the debug key is used):
# RELEASE_KEYSTORE_BASE64 (optional): release keystore file (base64)
# RELEASE_KEYSTORE_PASSWORD (optional): keystore password
# RELEASE_KEY_ALIAS (optional): key alias
# RELEASE_KEY_PASSWORD (optional): key password
#
# Environment settings (optional):
# ENV_FILE (optional): contents of the .env file
# GOOGLE_SERVICES_JSON (optional): contents of google-services.json (when using Firebase)
#
# Firebase App Distribution (optional):
# FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 (optional): Firebase service account JSON (base64)
#
# Note: register the Secrets above under the repository Settings → Secrets and variables → Actions.
#    To use the Firebase upload, also edit FIREBASE_APP_ID and FIREBASE_TESTER_GROUP in the env below.

name: PROJECT-Flutter-Android-Test-APK

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-android-app]

# Declare the needed permissions explicitly so progress comments work even when the repository default is read-only
permissions:
  contents: read
  issues: write
  pull-requests: write

# Project settings (edit the values below)
env:
  # Flutter SDK version — leave empty to use the latest stable channel (matches the SDK constraint of a fresh flutter create project).
  # To pin a version, write it like "3.38.9". It must satisfy environment.sdk in pubspec.yaml.
  FLUTTER_VERSION: ""
  JAVA_VERSION: "__JAVA_VERSION__"  # @wizard ask:17
  # Flutter root path (relative to the repo root). "." for a single repo, "app" etc. for a monorepo — set automatically at install
  FLUTTER_PROJECT_DIR: "."  # @wizard auto:flutter-root
  # How env vars are passed (dart-define | dotenv) — set automatically from the value chosen at install
  ENV_MODE: "dart-define"  # @wizard auto:flutter-env-mode
  # Where to create .env in dotenv mode (relative to the Flutter root)
  ENV_FILE_PATH: ".env"
  FIREBASE_APP_ID: "{FIREBASE_APP_ID}"
  FIREBASE_TESTER_GROUP: "{TESTER_GROUP}"

jobs:
  prepare-test-build:
    name: Prepare test build
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.build_info.outputs.version }}
      issue_url: ${{ steps.issue_info.outputs.issue_url }}
      issue_title: ${{ steps.issue_info.outputs.issue_title }}
      issue_number: ${{ steps.issue_info.outputs.issue_number }}
      branch_name: ${{ steps.issue_info.outputs.branch_name }}
      commit_hash: ${{ steps.build_info.outputs.commit_hash }}
      commit_sha: ${{ steps.build_info.outputs.commit_sha }}
      pr_number: ${{ steps.build_info.outputs.pr_number }}
      build_number: ${{ steps.build_info.outputs.build_number }}
      progress_comment_id: ${{ steps.progress_comment.outputs.comment_id }}
      progress_start_time: ${{ steps.progress_comment.outputs.start_time }}
      firebase_available: ${{ steps.firebase_check.outputs.available }}

    steps:
      # Fetch the message catalog from the triggering ref first — the feature branch being built may predate it
      - name: Checkout messages
        uses: actions/checkout@v7
        with:
          path: .paw-msg
          sparse-checkout: |
            .github/scripts/messages.py
            version.yml
          sparse-checkout-cone-mode: false

      - name: Load messages
        working-directory: ${{ github.workspace }}
        run: |
          [ -f .paw-msg/.github/scripts/messages.py ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          cp .paw-msg/.github/scripts/messages.py "$RUNNER_TEMP/paw_messages.py"
          LANG_CODE=$(cd .paw-msg && python3 "$RUNNER_TEMP/paw_messages.py" lang)
          rm -rf .paw-msg
          echo "PROJECT_AUTO_WIZARD_LANG=$LANG_CODE" >> "$GITHUB_ENV"
          echo "PAW_MESSAGES_PY=$RUNNER_TEMP/paw_messages.py" >> "$GITHUB_ENV"
          PROJECT_AUTO_WIZARD_LANG=$LANG_CODE python3 "$RUNNER_TEMP/paw_messages.py" dump apk_test. > "$RUNNER_TEMP/paw-msg.json"

      - name: Verify the branch exists up front
        id: verify_branch
        if: github.event_name == 'repository_dispatch'
        uses: actions/github-script@v9
        env:
          PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
          PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          PAW_IN_GITHUB_RUN_ID: ${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const M = JSON.parse(require('fs').readFileSync(`${process.env.RUNNER_TEMP}/paw-msg.json`, 'utf8'));
            const msg = (k, p = {}) => M[k].replace(/\{(\w+)\}/g, (s, n) => (n in p ? p[n] : s));
            const branchName = process.env.PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BRANCH_NAME;
            const prNumber = process.env.PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_PR_NUMBER;
            const runId = process.env.PAW_IN_GITHUB_RUN_ID;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            console.log(msg('apk_test.branch_check_log', { branch: branchName }));

            try {
              await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: branchName
              });
              console.log(msg('apk_test.branch_exists_log', { branch: branchName }));
            } catch (error) {
              if (error.status === 404) {
                console.log(msg('apk_test.branch_not_found_log', { branch: branchName }));

                // Post an error comment
                const body = [
                  msg('apk_test.branch_missing_title'),
                  '',
                  msg('apk_test.kv_head'),
                  '|------|-----|',
                  msg('apk_test.row_requested_branch', { branch: branchName }),
                  msg('apk_test.row_issue_pr', { number: prNumber }),
                  '',
                  msg('apk_test.hint_title'),
                  msg('apk_test.hint_pushed'),
                  msg('apk_test.hint_helper_branch'),
                  msg('apk_test.hint_typo'),
                  '',
                  msg('apk_test.workflow_log_link', { url: runUrl })
                ].join('\n');

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(prNumber),
                  body: body
                });

                core.setFailed(msg('apk_test.branch_not_found_fail', { branch: branchName }));
              } else {
                core.setFailed(msg('apk_test.branch_check_error_fail', { error: error.message }));
              }
            }

      - name: Check Firebase credentials
        id: firebase_check
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          if [ -n "$FIREBASE_SECRET" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
            m apk_test.firebase_detected
          else
            echo "available=false" >> $GITHUB_OUTPUT
            m apk_test.firebase_missing
          fi

      - name: Create the progress comment
        id: progress_comment
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number != ''
        uses: actions/github-script@v9
        env:
          PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          PAW_IN_GITHUB_RUN_ID: ${{ github.run_id }}
          PAW_IN_STEPS_FIREBASE_CHECK_OUTPUTS_AVAILABLE: ${{ steps.firebase_check.outputs.available }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const M = JSON.parse(require('fs').readFileSync(`${process.env.RUNNER_TEMP}/paw-msg.json`, 'utf8'));
            const msg = (k, p = {}) => M[k].replace(/\{(\w+)\}/g, (s, n) => (n in p ? p[n] : s));
            const row = (name, status, elapsed = '-') => `| ${msg('apk_test.step_' + name)} | ${msg('apk_test.st_' + status)} | ${elapsed} |`;
            const prNumber = parseInt(process.env.PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_PR_NUMBER);
            const runId = process.env.PAW_IN_GITHUB_RUN_ID;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            const startTime = Date.now();
            const firebaseAvailable = process.env.PAW_IN_STEPS_FIREBASE_CHECK_OUTPUTS_AVAILABLE === 'true';

            const rows = [
              row('prepare', 'running'),
              row('build', 'waiting'),
              row('upload', 'waiting'),
            ];
            if (firebaseAvailable) {
              rows.push(row('firebase', 'waiting'));
            }

            const body = [
              msg('apk_test.title_running'),
              '',
              msg('apk_test.table_header'),
              '|------|------|----------|',
              ...rows,
              '',
              msg('apk_test.live_log', { url: runUrl })
            ].join('\n');

            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });

            console.log(msg('apk_test.log_progress_created', { id: comment.id }));
            core.setOutput('comment_id', comment.id.toString());
            core.setOutput('start_time', startTime.toString());

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref }}

      - name: Pull latest changes
        env:
          PAW_BRANCH_NAME: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref_name }}
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          BRANCH_NAME="$PAW_BRANCH_NAME"
          m apk_test.pull_branch branch="$BRANCH_NAME"
          git pull origin "$BRANCH_NAME" || m apk_test.pull_failed

      - name: Extract issue info from the branch name
        id: issue_info
        env:
          PAW_BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
          PAW_ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
          PAW_REF_NAME: ${{ github.ref_name }}
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          # For repository_dispatch, take the branch name from client_payload
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            BRANCH_NAME="$PAW_BRANCH_NAME"
            ISSUE_NUMBER="$PAW_ISSUE_NUMBER"
          else
            BRANCH_NAME="$PAW_REF_NAME"
            # Extract the issue number from the branch name (`<date>_#<number>_...` format)
            ISSUE_NUMBER=$(echo "$BRANCH_NAME" | sed -n 's/.*#\([0-9]*\).*/\1/p')
          fi

          m apk_test.branch_name_log branch="$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          if [ -z "$ISSUE_NUMBER" ]; then
            m apk_test.issue_number_missing
            echo "issue_url=" >> $GITHUB_OUTPUT
            echo "issue_title=" >> $GITHUB_OUTPUT
            echo "issue_number=" >> $GITHUB_OUTPUT
          else
            m apk_test.issue_number_extracted number="$ISSUE_NUMBER"
            ISSUE_URL="https://github.com/${{ github.repository }}/issues/$ISSUE_NUMBER"
            echo "issue_url=$ISSUE_URL" >> $GITHUB_OUTPUT
            echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT

            # Fetch the issue info through the GitHub API
            m apk_test.issue_fetching
            ISSUE_RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER")

            NO_ISSUE_INFO="$(m apk_test.issue_title_default)"
            ISSUE_TITLE=$(echo "$ISSUE_RESPONSE" | jq -r --arg d "$NO_ISSUE_INFO" '.title // $d')
            ISSUE_STATE=$(echo "$ISSUE_RESPONSE" | jq -r '.state // "unknown"')

            if [ "$ISSUE_TITLE" = "null" ] || [ "$ISSUE_TITLE" = "$NO_ISSUE_INFO" ]; then
              m apk_test.issue_not_found number="$ISSUE_NUMBER"
              echo "issue_title=" >> $GITHUB_OUTPUT
            else
              m apk_test.issue_title_log title="$ISSUE_TITLE"
              m apk_test.issue_state_log state="$ISSUE_STATE"
              echo "issue_title=$ISSUE_TITLE" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Generate build info
        id: build_info
        env:
          PAW_BUILD_NUMBER: ${{ github.event.client_payload.build_number }}
          PAW_PR_NUMBER: ${{ github.event.client_payload.pr_number }}
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          # Get the version through version_manager.py (same approach as the production workflow)
          VERSION=$(python3 .github/scripts/version_manager.py get | tail -n 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # github.sha is the default-branch commit for repository_dispatch; report the commit actually checked out
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_SHORT=$(echo "$COMMIT_SHA" | cut -c1-7)
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          # For repository_dispatch events, use the PR number as the build number
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            BUILD_NUMBER="$PAW_BUILD_NUMBER"
            PR_NUMBER="$PAW_PR_NUMBER"
            m apk_test.event_dispatch
            m apk_test.event_pr_number pr="$PR_NUMBER"
            m apk_test.event_build_number_pr build="$BUILD_NUMBER"
          else
            BUILD_NUMBER="${{ github.run_number }}"
            PR_NUMBER=""
            m apk_test.event_workflow_dispatch
            m apk_test.event_build_number_default build="$BUILD_NUMBER"
          fi

          echo "commit_hash=$COMMIT_SHORT" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

          m apk_test.build_info_header
          m apk_test.build_info_build build="$BUILD_NUMBER"
          if [ -n "$PR_NUMBER" ]; then
            m apk_test.build_info_pr pr="$PR_NUMBER"
          fi
          m apk_test.build_info_commit commit="$COMMIT_SHORT"
          m apk_test.build_info_date date="$BUILD_DATE"

  build-android-test:
    name: Build Android test APK
    runs-on: ubuntu-latest
    needs: prepare-test-build
    defaults:
      run:
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}

    steps:
      # Fetch the message catalog from the triggering ref first — the feature branch being built may predate it
      - name: Checkout messages
        uses: actions/checkout@v7
        with:
          path: .paw-msg
          sparse-checkout: |
            .github/scripts/messages.py
            version.yml
          sparse-checkout-cone-mode: false

      - name: Load messages
        id: load_messages
        working-directory: ${{ github.workspace }}
        run: |
          [ -f .paw-msg/.github/scripts/messages.py ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          cp .paw-msg/.github/scripts/messages.py "$RUNNER_TEMP/paw_messages.py"
          LANG_CODE=$(cd .paw-msg && python3 "$RUNNER_TEMP/paw_messages.py" lang)
          rm -rf .paw-msg
          echo "PROJECT_AUTO_WIZARD_LANG=$LANG_CODE" >> "$GITHUB_ENV"
          echo "PAW_MESSAGES_PY=$RUNNER_TEMP/paw_messages.py" >> "$GITHUB_ENV"
          PROJECT_AUTO_WIZARD_LANG=$LANG_CODE python3 "$RUNNER_TEMP/paw_messages.py" dump apk_test. > "$RUNNER_TEMP/paw-msg.json"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref }}

      - name: Pull latest changes
        env:
          PAW_BRANCH_NAME: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref_name }}
        run: git pull origin "$PAW_BRANCH_NAME"

      # Prepare env vars — a .env file when ENV_MODE=dotenv, otherwise a temp file outside the project (--dart-define-from-file)
      - name: Prepare env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          if [ "$ENV_MODE" = "dotenv" ]; then
            printf '%s\n' "$ENV_CONTENT" > "$ENV_FILE_PATH"
            m wf_flutter.env_file_created file="$ENV_FILE_PATH"
          elif [ -n "$ENV_CONTENT" ]; then
            DART_DEFINE_FILE="$RUNNER_TEMP/dart-define.env"
            printf '%s\n' "$ENV_CONTENT" > "$DART_DEFINE_FILE"
            echo "DART_DEFINE_FILE=$DART_DEFINE_FILE" >> "$GITHUB_ENV"
            m wf_flutter.dart_define_prepared
          fi

      - name: Setup Release Keystore
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          # A test build must work without any setup — when a Secret is empty, keystore and key.properties are not created
          # and the build uses the project's default signing (flutter create defaults to the debug key even for release). The key in use is logged.
          MISSING=""
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            [ -n "${!name}" ] || MISSING="$MISSING $name"
          done
          if [ -n "$MISSING" ]; then
            echo "::warning::$(m apk_test.sign_debug_warning missing="$MISSING")"
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A broken keystore with a value present is not skipped silently — fail here
          mkdir -p android/keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/keystore/key.jks
          if [ ! -s android/keystore/key.jks ]; then
            echo "::error::$(m apk_test.sign_keystore_empty)"
            exit 1
          fi
          # Stop here if the password/alias does not match the keystore (instead of a long error in the gradle signing step)
          keytool -list -keystore android/keystore/key.jks -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" > /dev/null
          echo "mode=release" >> "$GITHUB_OUTPUT"
          m apk_test.sign_release_ok
          ls -la android/keystore/

      - name: Create key.properties
        if: steps.signing.outputs.mode == 'release'
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          cat > android/key.properties << EOF
          storeFile=keystore/key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          m apk_test.key_properties_ok

      # Create google-services.json (optional)
      - name: Create google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p android/app
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            m wf_flutter.google_services_created
          else
            m wf_flutter.google_services_skipped
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Verify Flutter version
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          m wf_flutter.flutter_setup_done_ok
          flutter --version

      - name: Cache Flutter dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles(format('{0}/**/pubspec.lock', env.FLUTTER_PROJECT_DIR)) }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles(format('{0}/android/**/build.gradle', env.FLUTTER_PROJECT_DIR), format('{0}/android/**/gradle-wrapper.properties', env.FLUTTER_PROJECT_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          flutter pub get
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi
          m wf_flutter.deps_installed_ok

      - name: Setup Gradle
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}/android
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          # The default flutter create .gitignore does not commit gradlew — flutter build creates it when missing
          if [ -f gradlew ]; then
            chmod +x gradlew
            m wf_flutter.gradle_perm_ok
          else
            m apk_test.gradlew_missing
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Verify Java version
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          m wf_flutter.java_setup_done_ok
          java -version

      - name: Progress - prepare done
        id: progress_step1
        if: github.event_name == 'repository_dispatch' && needs.prepare-test-build.outputs.progress_comment_id != ''
        uses: actions/github-script@v9
        env:
          PAW_IN_GITHUB_RUN_ID: ${{ github.run_id }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_FIREBASE_AVAILABLE: ${{ needs.prepare-test-build.outputs.firebase_available }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_PROGRESS_COMMENT_ID: ${{ needs.prepare-test-build.outputs.progress_comment_id }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_PROGRESS_START_TIME: ${{ needs.prepare-test-build.outputs.progress_start_time }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const M = JSON.parse(require('fs').readFileSync(`${process.env.RUNNER_TEMP}/paw-msg.json`, 'utf8'));
            const msg = (k, p = {}) => M[k].replace(/\{(\w+)\}/g, (s, n) => (n in p ? p[n] : s));
            const row = (name, status, elapsed = '-') => `| ${msg('apk_test.step_' + name)} | ${msg('apk_test.st_' + status)} | ${elapsed} |`;
            const commentId = parseInt(process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_PROGRESS_COMMENT_ID);
            const startTime = parseInt(process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_PROGRESS_START_TIME);
            const runId = process.env.PAW_IN_GITHUB_RUN_ID;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const now = Date.now();
            const elapsed = Math.round((now - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            const elapsedStr = minutes > 0 ? msg('apk_test.elapsed_min_sec', { m: minutes, s: seconds }) : msg('apk_test.elapsed_sec', { s: seconds });
            const firebaseAvailable = process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_FIREBASE_AVAILABLE === 'true';

            const rows = [
              row('prepare', 'done', elapsedStr),
              row('build', 'running'),
              row('upload', 'waiting'),
            ];
            if (firebaseAvailable) {
              rows.push(row('firebase', 'waiting'));
            }

            const body = [
              msg('apk_test.title_running'),
              '',
              msg('apk_test.table_header'),
              '|------|------|----------|',
              ...rows,
              '',
              msg('apk_test.live_log', { url: runUrl })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log(msg('apk_test.log_prepare_done', { elapsed: elapsedStr }));
            core.setOutput('elapsed', elapsedStr);
            core.setOutput('end_time', now.toString());

      - name: Generate APK filename
        id: apk_filename
        env:
          PAW_ISSUE_TITLE: ${{ needs.prepare-test-build.outputs.issue_title }}
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          REPO_NAME="${{ github.event.repository.name }}"
          COMMIT_SHORT="${{ needs.prepare-test-build.outputs.commit_hash }}"
          BUILD_NUMBER="${{ needs.prepare-test-build.outputs.build_number }}"
          ISSUE_NUMBER="${{ needs.prepare-test-build.outputs.issue_number }}"
          ISSUE_TITLE="$PAW_ISSUE_TITLE"

          # Clean up the issue title
          CLEAN_TITLE=""
          if [ -n "$ISSUE_TITLE" ]; then
            CLEAN_TITLE="$ISSUE_TITLE"
            # 1. Remove emoji (Unicode emoji ranges)
            CLEAN_TITLE=$(echo "$CLEAN_TITLE" | sed 's/[\xF0\x9F][\x80-\xBF][\x80-\xBF][\x80-\xBF]//g; s/[\xE2\x9C\xE2\x9A\xE2\xAD\xE2\x9D\xE2\x99\xE2\x98\xE2\x9E\xE2\xAC\xE2\xAB\xE2\xAC][\x80-\xBF][\x80-\xBF]//g; s/[\xE2\x80\x8D]//g; s/\xEF\xB8\x8F//g; s/\xE2\x83\xA3//g')
            # 2. Remove bracket tags [xxx]
            CLEAN_TITLE=$(echo "$CLEAN_TITLE" | sed 's/\[[^]]*\]//g')
            # 3. Trim leading/trailing whitespace
            CLEAN_TITLE=$(echo "$CLEAN_TITLE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            # 4. Whitespace -> _
            CLEAN_TITLE=$(echo "$CLEAN_TITLE" | sed 's/[[:space:]]/_/g')
            # 5. Remove characters that are invalid in file names
            CLEAN_TITLE=$(echo "$CLEAN_TITLE" | sed 's/[#\/\\:*?"<>|]//g')
            # 6. Collapse repeated underscores
            CLEAN_TITLE=$(echo "$CLEAN_TITLE" | sed 's/__*/_/g; s/^_//; s/_$//')
            # 7. Limit to 30 characters
            CLEAN_TITLE=$(echo "$CLEAN_TITLE" | cut -c1-30)
            # 8. Remove a trailing underscore
            CLEAN_TITLE=$(echo "$CLEAN_TITLE" | sed 's/_$//')
          fi

          # Assemble the file name
          if [ -n "$ISSUE_NUMBER" ] && [ -n "$CLEAN_TITLE" ]; then
            APK_NAME="${REPO_NAME}-${ISSUE_NUMBER}-${BUILD_NUMBER}-${CLEAN_TITLE}-${COMMIT_SHORT}.apk"
          elif [ -n "$ISSUE_NUMBER" ]; then
            APK_NAME="${REPO_NAME}-${ISSUE_NUMBER}-${BUILD_NUMBER}-${COMMIT_SHORT}.apk"
          else
            APK_NAME="${REPO_NAME}-${BUILD_NUMBER}-${COMMIT_SHORT}.apk"
          fi

          # Artifact name (without the extension)
          ARTIFACT_NAME="${APK_NAME%.apk}"
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          m apk_test.apk_filename_log name="$APK_NAME"

      - name: Set test build version
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          VERSION="${{ needs.prepare-test-build.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare-test-build.outputs.build_number }}"
          m apk_test.version_set_log version="${VERSION}+${BUILD_NUMBER}"
          sed -i "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/" pubspec.yaml
          m apk_test.pubspec_updated
          grep "^version:" pubspec.yaml

      # Build the APK (directly with flutter)
      - name: Build APK
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          m apk_test.flutter_build_log
          flutter build apk --release ${DART_DEFINE_FILE:+--dart-define-from-file="$DART_DEFINE_FILE"}
          ls -la ./build/app/outputs/flutter-apk/ || true
          m wf_flutter.apk_built_ok

      - name: Rename and Prepare APK
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          mkdir -p ./android/app/build/outputs/apk/release/
          APK_NAME="${{ steps.apk_filename.outputs.apk_name }}"
          mv ./build/app/outputs/flutter-apk/app-release.apk ./android/app/build/outputs/apk/release/${APK_NAME}
          m wf_flutter.apk_renamed_ok name="${APK_NAME}"
          ls -la ./android/app/build/outputs/apk/release/

          # Check the APK file size
          APK_SIZE=$(stat -c%s "./android/app/build/outputs/apk/release/${APK_NAME}" 2>/dev/null || stat -f%z "./android/app/build/outputs/apk/release/${APK_NAME}" 2>/dev/null || echo "0")
          APK_SIZE_MB=$(echo "scale=2; $APK_SIZE / 1024 / 1024" | bc)
          m apk_test.apk_size_log size="$APK_SIZE_MB"

          # Check the artifact size limit (500MB)
          if [ "$APK_SIZE" -gt 524288000 ]; then
            m apk_test.apk_size_over size="$APK_SIZE_MB"
          else
            m apk_test.apk_size_ok size="$APK_SIZE_MB"
          fi

      - name: Progress - APK build done
        id: progress_step2
        if: github.event_name == 'repository_dispatch' && needs.prepare-test-build.outputs.progress_comment_id != ''
        uses: actions/github-script@v9
        env:
          PAW_IN_GITHUB_RUN_ID: ${{ github.run_id }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_FIREBASE_AVAILABLE: ${{ needs.prepare-test-build.outputs.firebase_available }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_PROGRESS_COMMENT_ID: ${{ needs.prepare-test-build.outputs.progress_comment_id }}
          PAW_IN_STEPS_PROGRESS_STEP1_OUTPUTS_ELAPSED: ${{ steps.progress_step1.outputs.elapsed }}
          PAW_IN_STEPS_PROGRESS_STEP1_OUTPUTS_END_TIME: ${{ steps.progress_step1.outputs.end_time }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const M = JSON.parse(require('fs').readFileSync(`${process.env.RUNNER_TEMP}/paw-msg.json`, 'utf8'));
            const msg = (k, p = {}) => M[k].replace(/\{(\w+)\}/g, (s, n) => (n in p ? p[n] : s));
            const row = (name, status, elapsed = '-') => `| ${msg('apk_test.step_' + name)} | ${msg('apk_test.st_' + status)} | ${elapsed} |`;
            const commentId = parseInt(process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_PROGRESS_COMMENT_ID);
            const step1EndTime = parseInt(process.env.PAW_IN_STEPS_PROGRESS_STEP1_OUTPUTS_END_TIME);
            const step1Elapsed = process.env.PAW_IN_STEPS_PROGRESS_STEP1_OUTPUTS_ELAPSED;
            const runId = process.env.PAW_IN_GITHUB_RUN_ID;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const now = Date.now();
            const elapsed = Math.round((now - step1EndTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            const elapsedStr = minutes > 0 ? msg('apk_test.elapsed_min_sec', { m: minutes, s: seconds }) : msg('apk_test.elapsed_sec', { s: seconds });
            const firebaseAvailable = process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_FIREBASE_AVAILABLE === 'true';

            const rows = [
              row('prepare', 'done', step1Elapsed || '-'),
              row('build', 'done', elapsedStr),
              row('upload', 'running'),
            ];
            if (firebaseAvailable) {
              rows.push(row('firebase', 'waiting'));
            }

            const body = [
              msg('apk_test.title_running'),
              '',
              msg('apk_test.table_header'),
              '|------|------|----------|',
              ...rows,
              '',
              msg('apk_test.live_log', { url: runUrl })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log(msg('apk_test.log_build_done', { elapsed: elapsedStr }));
            core.setOutput('elapsed', elapsedStr);
            core.setOutput('end_time', now.toString());

      - name: Create build info file
        env:
          PAW_BRANCH_NAME: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref_name }}
          PAW_ISSUE_TITLE: ${{ needs.prepare-test-build.outputs.issue_title }}
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          BUILD_NUMBER="${{ needs.prepare-test-build.outputs.build_number }}"
          PR_NUMBER="${{ needs.prepare-test-build.outputs.pr_number }}"
          BRANCH_NAME="$PAW_BRANCH_NAME"
          COMMIT_SHA="${{ needs.prepare-test-build.outputs.commit_sha }}"
          COMMIT_SHORT="${{ needs.prepare-test-build.outputs.commit_hash }}"
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          {
            m apk_test.info_title
            echo
            m apk_test.info_build_number build="$BUILD_NUMBER"
          } > build-info.txt

          if [ -n "$PR_NUMBER" ]; then
            m apk_test.info_pr_number pr="$PR_NUMBER" >> build-info.txt
          fi

          {
            m apk_test.info_branch branch="$BRANCH_NAME"
            m apk_test.info_commit commit="$COMMIT_SHORT"
            m apk_test.info_full_commit sha="$COMMIT_SHA"
            m apk_test.info_date date="$BUILD_DATE"
            echo
          } >> build-info.txt

          # Add the issue info when available
          if [ -n "${{ needs.prepare-test-build.outputs.issue_number }}" ]; then
            ISSUE_NUMBER="${{ needs.prepare-test-build.outputs.issue_number }}"
            ISSUE_TITLE="$PAW_ISSUE_TITLE"
            ISSUE_URL="${{ needs.prepare-test-build.outputs.issue_url }}"

            {
              m apk_test.info_issue_header
              echo "- #$ISSUE_NUMBER: $ISSUE_TITLE"
              echo "- URL: $ISSUE_URL"
              echo
            } >> build-info.txt
          fi

          m apk_test.info_file_created
          cat build-info.txt

      # Create the build metadata file (for the comment-posting workflow)
      - name: Create build metadata file
        env:
          PAW_BRANCH_NAME: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref_name }}
        run: |
          cat > build-metadata.json << EOF
          {
            "pr_number": "${{ needs.prepare-test-build.outputs.pr_number }}",
            "build_number": "${{ needs.prepare-test-build.outputs.build_number }}",
            "issue_number": "${{ needs.prepare-test-build.outputs.issue_number }}",
            "branch_name": "$PAW_BRANCH_NAME"
          }
          EOF
          cat build-metadata.json

      # Upload the APK and build info as an artifact (the name includes the branch name)
      - name: Upload APK and build info as Artifact
        id: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk_filename.outputs.artifact_name }}
          path: |
            ${{ env.FLUTTER_PROJECT_DIR }}/android/app/build/outputs/apk/release/*.apk
            ${{ env.FLUTTER_PROJECT_DIR }}/build-info.txt
            ${{ env.FLUTTER_PROJECT_DIR }}/build-metadata.json
          retention-days: 7
          if-no-files-found: error

      - name: Record artifact upload time
        id: artifact_time
        if: github.event_name == 'repository_dispatch' && needs.prepare-test-build.outputs.progress_comment_id != ''
        uses: actions/github-script@v9
        env:
          PAW_IN_STEPS_PROGRESS_STEP2_OUTPUTS_END_TIME: ${{ steps.progress_step2.outputs.end_time }}
        with:
          script: |
            const M = JSON.parse(require('fs').readFileSync(`${process.env.RUNNER_TEMP}/paw-msg.json`, 'utf8'));
            const msg = (k, p = {}) => M[k].replace(/\{(\w+)\}/g, (s, n) => (n in p ? p[n] : s));
            const step2EndTime = parseInt(process.env.PAW_IN_STEPS_PROGRESS_STEP2_OUTPUTS_END_TIME);
            const now = Date.now();
            const elapsed = Math.round((now - step2EndTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            const elapsedStr = minutes > 0 ? msg('apk_test.elapsed_min_sec', { m: minutes, s: seconds }) : msg('apk_test.elapsed_sec', { s: seconds });
            core.setOutput('elapsed', elapsedStr);
            core.setOutput('end_time', now.toString());

      # Firebase App Distribution upload (only when the secret exists)
      - name: Setup Firebase credentials file
        if: needs.prepare-test-build.outputs.firebase_available == 'true'
        env:
          FIREBASE_SA_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          echo "$FIREBASE_SA_BASE64" | base64 --decode > firebase-service-account.json
          m apk_test.firebase_creds_ok

      - name: Prepare Firebase release notes
        id: firebase_notes
        if: needs.prepare-test-build.outputs.firebase_available == 'true'
        env:
          NOTES_BUILD_NUMBER: ${{ needs.prepare-test-build.outputs.build_number }}
          NOTES_BRANCH: ${{ needs.prepare-test-build.outputs.branch_name }}
          NOTES_COMMIT: ${{ needs.prepare-test-build.outputs.commit_hash }}
          NOTES_ISSUE_NUMBER: ${{ needs.prepare-test-build.outputs.issue_number }}
          NOTES_ISSUE_TITLE: ${{ needs.prepare-test-build.outputs.issue_title }}
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          # The release notes go through a multi-line step output so the wording follows the configured language
          {
            echo "notes<<PAW_NOTES_EOF"
            m apk_test.fb_notes_build build="$NOTES_BUILD_NUMBER"
            m apk_test.fb_notes_branch branch="$NOTES_BRANCH"
            m apk_test.fb_notes_commit commit="$NOTES_COMMIT"
            m apk_test.fb_notes_issue number="$NOTES_ISSUE_NUMBER" title="$NOTES_ISSUE_TITLE"
            echo "PAW_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to Firebase App Distribution
        id: firebase_upload
        if: needs.prepare-test-build.outputs.firebase_available == 'true'
        continue-on-error: true
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_APP_ID }}
          serviceCredentialsFile: ${{ env.FLUTTER_PROJECT_DIR }}/firebase-service-account.json
          groups: ${{ env.FIREBASE_TESTER_GROUP }}
          file: ${{ env.FLUTTER_PROJECT_DIR }}/android/app/build/outputs/apk/release/${{ steps.apk_filename.outputs.apk_name }}
          releaseNotes: ${{ steps.firebase_notes.outputs.notes }}

      - name: Cleanup Firebase credentials
        if: always() && needs.prepare-test-build.outputs.firebase_available == 'true'
        run: rm -f firebase-service-account.json

      - name: Firebase upload result
        id: firebase_result
        if: needs.prepare-test-build.outputs.firebase_available == 'true'
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          if [ "${{ steps.firebase_upload.outcome }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            m apk_test.firebase_upload_ok
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            m apk_test.firebase_upload_failed
          fi

      - name: Record Firebase upload time
        id: firebase_time
        if: needs.prepare-test-build.outputs.firebase_available == 'true' && github.event_name == 'repository_dispatch' && needs.prepare-test-build.outputs.progress_comment_id != ''
        uses: actions/github-script@v9
        env:
          PAW_IN_STEPS_ARTIFACT_TIME_OUTPUTS_END_TIME: ${{ steps.artifact_time.outputs.end_time }}
        with:
          script: |
            const M = JSON.parse(require('fs').readFileSync(`${process.env.RUNNER_TEMP}/paw-msg.json`, 'utf8'));
            const msg = (k, p = {}) => M[k].replace(/\{(\w+)\}/g, (s, n) => (n in p ? p[n] : s));
            const artifactEndTime = parseInt(process.env.PAW_IN_STEPS_ARTIFACT_TIME_OUTPUTS_END_TIME);
            const now = Date.now();
            const elapsed = Math.round((now - artifactEndTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            const elapsedStr = minutes > 0 ? msg('apk_test.elapsed_min_sec', { m: minutes, s: seconds }) : msg('apk_test.elapsed_sec', { s: seconds });
            core.setOutput('elapsed', elapsedStr);

      - name: Final progress update - success
        if: success() && github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number != '' && needs.prepare-test-build.outputs.progress_comment_id != ''
        uses: actions/github-script@v9
        env:
          PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          PAW_IN_GITHUB_RUN_ID: ${{ github.run_id }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_BRANCH_NAME: ${{ needs.prepare-test-build.outputs.branch_name }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_BUILD_NUMBER: ${{ needs.prepare-test-build.outputs.build_number }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_COMMIT_HASH: ${{ needs.prepare-test-build.outputs.commit_hash }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_FIREBASE_AVAILABLE: ${{ needs.prepare-test-build.outputs.firebase_available }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_ISSUE_NUMBER: ${{ needs.prepare-test-build.outputs.issue_number }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_PROGRESS_COMMENT_ID: ${{ needs.prepare-test-build.outputs.progress_comment_id }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_PROGRESS_START_TIME: ${{ needs.prepare-test-build.outputs.progress_start_time }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_VERSION: ${{ needs.prepare-test-build.outputs.version }}
          PAW_IN_STEPS_ARTIFACT_TIME_OUTPUTS_ELAPSED: ${{ steps.artifact_time.outputs.elapsed }}
          PAW_IN_STEPS_FIREBASE_RESULT_OUTPUTS_STATUS: ${{ steps.firebase_result.outputs.status }}
          PAW_IN_STEPS_FIREBASE_TIME_OUTPUTS_ELAPSED: ${{ steps.firebase_time.outputs.elapsed }}
          PAW_IN_STEPS_PROGRESS_STEP1_OUTPUTS_ELAPSED: ${{ steps.progress_step1.outputs.elapsed }}
          PAW_IN_STEPS_PROGRESS_STEP2_OUTPUTS_ELAPSED: ${{ steps.progress_step2.outputs.elapsed }}
          PAW_IN_STEPS_UPLOAD_ARTIFACT_OUTPUTS_ARTIFACT_URL: ${{ steps.upload_artifact.outputs.artifact-url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const M = JSON.parse(require('fs').readFileSync(`${process.env.RUNNER_TEMP}/paw-msg.json`, 'utf8'));
            const msg = (k, p = {}) => M[k].replace(/\{(\w+)\}/g, (s, n) => (n in p ? p[n] : s));
            const row = (name, status, elapsed = '-') => `| ${msg('apk_test.step_' + name)} | ${msg('apk_test.st_' + status)} | ${elapsed} |`;
            const commentId = parseInt(process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_PROGRESS_COMMENT_ID);
            const startTime = parseInt(process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_PROGRESS_START_TIME);
            const step1Elapsed = process.env.PAW_IN_STEPS_PROGRESS_STEP1_OUTPUTS_ELAPSED;
            const step2Elapsed = process.env.PAW_IN_STEPS_PROGRESS_STEP2_OUTPUTS_ELAPSED;
            const step3Elapsed = process.env.PAW_IN_STEPS_ARTIFACT_TIME_OUTPUTS_ELAPSED;
            const step4Elapsed = process.env.PAW_IN_STEPS_FIREBASE_TIME_OUTPUTS_ELAPSED;
            const prNumber = parseInt(process.env.PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_PR_NUMBER);
            const buildNumber = process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_BUILD_NUMBER;
            const branchName = process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_BRANCH_NAME;
            const commitHash = process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_COMMIT_HASH;
            const issueNumber = process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_ISSUE_NUMBER;
            const runId = process.env.PAW_IN_GITHUB_RUN_ID;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const artifactUrl = process.env.PAW_IN_STEPS_UPLOAD_ARTIFACT_OUTPUTS_ARTIFACT_URL || `${runUrl}#artifacts`;

            const now = Date.now();
            const totalElapsed_s = Math.round((now - startTime) / 1000);
            const totalMin = Math.floor(totalElapsed_s / 60);
            const totalSec = totalElapsed_s % 60;
            const totalElapsed = totalMin > 0 ? msg('apk_test.elapsed_min_sec', { m: totalMin, s: totalSec }) : msg('apk_test.elapsed_sec', { s: totalSec });

            const firebaseAvailable = process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_FIREBASE_AVAILABLE === 'true';
            const firebaseSuccess = process.env.PAW_IN_STEPS_FIREBASE_RESULT_OUTPUTS_STATUS === 'success';

            const lines = [
              msg('apk_test.title_done'),
              '',
              msg('apk_test.table_header'),
              '|------|------|----------|',
              row('prepare', 'done', step1Elapsed || '-'),
              row('build', 'done', step2Elapsed || '-'),
              row('upload', 'done', step3Elapsed || '-'),
            ];

            if (firebaseAvailable) {
              if (firebaseSuccess) {
                lines.push(row('firebase', 'done', step4Elapsed || '-'));
              } else {
                lines.push(row('firebase', 'failed', step4Elapsed || '-'));
              }
            }

            const version = process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_VERSION;

            lines.push(
              '',
              msg('apk_test.result_title'),
              msg('apk_test.kv_head'),
              '|------|-----|',
              msg('apk_test.row_app_version', { version, build: buildNumber }),
              msg('apk_test.row_branch', { branch: branchName }),
              msg('apk_test.row_commit', { commit: commitHash }),
              msg('apk_test.row_total', { elapsed: totalElapsed }),
              '',
            );

            if (firebaseAvailable && firebaseSuccess) {
              lines.push(msg('apk_test.firebase_installable'));
            } else if (firebaseAvailable && !firebaseSuccess) {
              lines.push(msg('apk_test.firebase_failed_hint'));
            }

            lines.push(
              msg('apk_test.artifact_link', { url: artifactUrl }),
              msg('apk_test.run_log_link', { url: runUrl })
            );

            const body = lines.join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log(msg('apk_test.log_success', { elapsed: totalElapsed }));

            // If an issue is linked to the PR and differs from the PR number, comment on the issue too
            if (issueNumber && issueNumber !== '' && parseInt(issueNumber) !== prNumber) {
              const issueLines = [
                msg('apk_test.issue_done_title'),
                '',
                msg('apk_test.issue_line_version', { version, build: buildNumber }),
                msg('apk_test.issue_line_commit', { commit: commitHash }),
                '',
              ];

              if (firebaseAvailable && firebaseSuccess) {
                issueLines.push(msg('apk_test.firebase_installable'));
              } else if (firebaseAvailable && !firebaseSuccess) {
                issueLines.push(msg('apk_test.firebase_failed_hint'));
              }

              issueLines.push(msg('apk_test.artifact_link', { url: artifactUrl }));

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(issueNumber),
                body: issueLines.join('\n')
              });
              console.log(msg('apk_test.log_issue_success', { number: issueNumber }));
            }

      - name: Final progress update - failure
        if: failure() && steps.load_messages.outcome == 'success' && github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number != '' && needs.prepare-test-build.outputs.progress_comment_id != ''
        uses: actions/github-script@v9
        env:
          PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          PAW_IN_GITHUB_RUN_ID: ${{ github.run_id }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_BRANCH_NAME: ${{ needs.prepare-test-build.outputs.branch_name }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_BUILD_NUMBER: ${{ needs.prepare-test-build.outputs.build_number }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_FIREBASE_AVAILABLE: ${{ needs.prepare-test-build.outputs.firebase_available }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_ISSUE_NUMBER: ${{ needs.prepare-test-build.outputs.issue_number }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_PROGRESS_COMMENT_ID: ${{ needs.prepare-test-build.outputs.progress_comment_id }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_PROGRESS_START_TIME: ${{ needs.prepare-test-build.outputs.progress_start_time }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_VERSION: ${{ needs.prepare-test-build.outputs.version }}
          PAW_IN_STEPS_PROGRESS_STEP1_OUTPUTS_ELAPSED: ${{ steps.progress_step1.outputs.elapsed }}
          PAW_IN_STEPS_PROGRESS_STEP1_OUTPUTS_END_TIME: ${{ steps.progress_step1.outputs.end_time }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const M = JSON.parse(require('fs').readFileSync(`${process.env.RUNNER_TEMP}/paw-msg.json`, 'utf8'));
            const msg = (k, p = {}) => M[k].replace(/\{(\w+)\}/g, (s, n) => (n in p ? p[n] : s));
            const row = (name, status, elapsed = '-') => `| ${msg('apk_test.step_' + name)} | ${msg('apk_test.st_' + status)} | ${elapsed} |`;
            const commentId = parseInt(process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_PROGRESS_COMMENT_ID);
            const startTime = parseInt(process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_PROGRESS_START_TIME);
            const step1EndTime = parseInt(process.env.PAW_IN_STEPS_PROGRESS_STEP1_OUTPUTS_END_TIME) || 0;
            const step1Elapsed = process.env.PAW_IN_STEPS_PROGRESS_STEP1_OUTPUTS_ELAPSED;
            const prNumber = parseInt(process.env.PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_PR_NUMBER);
            const buildNumber = process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_BUILD_NUMBER;
            const version = process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_VERSION;
            const branchName = process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_BRANCH_NAME;
            const issueNumber = process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_ISSUE_NUMBER;
            const runId = process.env.PAW_IN_GITHUB_RUN_ID;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const now = Date.now();

            let step2ElapsedStr = '-';
            if (step1EndTime > 0) {
              const step2_s = Math.round((now - step1EndTime) / 1000);
              const s2Min = Math.floor(step2_s / 60);
              const s2Sec = step2_s % 60;
              step2ElapsedStr = s2Min > 0 ? msg('apk_test.elapsed_min_sec', { m: s2Min, s: s2Sec }) : msg('apk_test.elapsed_sec', { s: s2Sec });
            }

            const total_s = Math.round((now - startTime) / 1000);
            const tMin = Math.floor(total_s / 60);
            const tSec = total_s % 60;
            const totalElapsed = tMin > 0 ? msg('apk_test.elapsed_min_sec', { m: tMin, s: tSec }) : msg('apk_test.elapsed_sec', { s: tSec });

            const firebaseAvailable = process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_FIREBASE_AVAILABLE === 'true';

            const rows = [
              row('prepare', 'done', step1Elapsed || '-'),
              row('build', 'failed', step2ElapsedStr),
              row('upload', 'skipped'),
            ];
            if (firebaseAvailable) {
              rows.push(row('firebase', 'skipped'));
            }

            const body = [
              msg('apk_test.title_failed'),
              '',
              msg('apk_test.table_header'),
              '|------|------|----------|',
              ...rows,
              '',
              msg('apk_test.issue_line_version', { version, build: buildNumber }),
              msg('apk_test.fail_line_branch', { branch: branchName }),
              msg('apk_test.fail_line_total', { elapsed: totalElapsed }),
              '',
              msg('apk_test.build_error'),
              '',
              msg('apk_test.run_log_check_link', { url: runUrl })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log(msg('apk_test.log_failed', { elapsed: totalElapsed }));

            if (issueNumber && issueNumber !== '' && parseInt(issueNumber) !== prNumber) {
              const issueBody = [
                msg('apk_test.issue_failed_title'),
                '',
                msg('apk_test.issue_line_version', { version, build: buildNumber }),
                '',
                msg('apk_test.build_error'),
                '',
                msg('apk_test.run_log_check_link', { url: runUrl })
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(issueNumber),
                body: issueBody
              });
              console.log(msg('apk_test.log_issue_failed', { number: issueNumber }));
            }

      - name: Notify Build Success
        if: success()
        env:
          PAW_BRANCH_NAME: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref_name }}
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          m apk_test.notify_ok
          m apk_test.notify_build_number build="${{ needs.prepare-test-build.outputs.build_number }}"
          if [ -n "${{ needs.prepare-test-build.outputs.pr_number }}" ]; then
            m apk_test.notify_pr pr="${{ needs.prepare-test-build.outputs.pr_number }}"
          fi
          m apk_test.notify_branch branch="$PAW_BRANCH_NAME"
          m apk_test.notify_commit commit="${{ needs.prepare-test-build.outputs.commit_hash }}"
          if [ -n "${{ needs.prepare-test-build.outputs.issue_url }}" ]; then
            m apk_test.notify_issue url="${{ needs.prepare-test-build.outputs.issue_url }}"
          fi
          echo ""
          m apk_test.notify_artifact_hint

      - name: Notify on Failure
        if: failure() && steps.load_messages.outcome == 'success'
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          m apk_test.notify_fail
          m apk_test.check_logs
