# project-auto-wizard:managed-workflow
# Flutter Android self-hosted server (SMB) deploy workflow
#
# On a push to the {{MAIN_BRANCH}} branch, builds the Android APK and
# deploys it to an SMB share on your own server (e.g. Synology NAS, Linux).
#
# Required GitHub Secrets
# ENV_FILE or ENV: contents of the .env file (either one; ENV_FILE takes precedence)
# DEBUG_KEYSTORE (optional): signing keystore (base64, password android, alias androiddebugkey) - if missing, each build is signed with a fresh debug key
# GOOGLE_SERVICES_JSON (optional): Firebase google-services.json
# SERVER_HOST: server host (SMB address)
# SERVER_USER: SMB user name
# SERVER_PASSWORD: SMB password

name: PROJECT-Android-SelfHosted-CICD

on:
  push:
    branches: ["{{MAIN_BRANCH}}"]
    # @wizard paths-anchor (in a monorepo the installer injects a paths filter here)
  workflow_dispatch: # add a manual run option

# Project settings (edit the values below)
env:
  # Project name (used in the APK file name, artifact name, and history file name)
  APP_ARTIFACT_NAME: "__APP_ARTIFACT_NAME__"  # @wizard ask:@repo
  # Flutter SDK version - leave empty to use the latest stable channel (matches the SDK constraint of a fresh flutter create project).
  # To pin a version, write it like "3.38.9". It must satisfy the environment.sdk range in pubspec.yaml.
  FLUTTER_VERSION: ""
  JAVA_VERSION: "__JAVA_VERSION__"  # @wizard ask:17
  # Flutter root path (relative to the repo root): "." for a single repo, "app" etc. for a monorepo - set automatically at install
  FLUTTER_PROJECT_DIR: "."  # @wizard auto:flutter-root
  # How env vars are passed (dart-define | dotenv) - set automatically from the install-time choice
  ENV_MODE: "dart-define"  # @wizard auto:flutter-env-mode
  # SMB server settings (your own server - Synology NAS, Linux, etc.)
  SMB_PORT: "44445" # default 445
  SMB_SHARE: "web"
  SMB_PATH_IOS: "/your-project/ios/download" # SMB path: used in the form /{APP_ARTIFACT_NAME}/ios/download
jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    # Run only when the CHANGELOG workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    defaults:
      run:
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Without the upload Secrets the run would only fail at the SMB upload after the whole build, so report the missing names first and stop
      # Same condition as the deploy job - a manual run on a non-deploy branch only builds
      # DEBUG_KEYSTORE and GOOGLE_SERVICES_JSON are optional, so they are not checked
      - name: Pre-deploy check (Secrets)
        if: github.ref == 'refs/heads/{{MAIN_BRANCH}}'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          MISSING=""
          for NAME in SERVER_HOST SERVER_USER SERVER_PASSWORD; do
            [ -n "${!NAME}" ] || MISSING="$MISSING $NAME"
          done
          if [ -n "$MISSING" ]; then
            echo "::error title=$(m flutter_a.precheck_missing_title)::$(m flutter_a.precheck_missing_body missing="$MISSING")"
            exit 1
          fi
          m flutter_a.precheck_passed

      - name: List repository contents
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          m wf_flutter.repo_checked_out
          ls -la

      # Debug keystore setup - this workflow signs with DEBUG_KEYSTORE (password android, alias androiddebugkey)
      - name: Setup Debug Keystore
        id: signing
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          # This is for internal distribution, so the build proceeds even without the Secret - the runner signs with a freshly created debug key,
          # so the signature differs per build and cannot update an existing install; leave that as a warning.
          if [ -z "$DEBUG_KEYSTORE" ]; then
            echo "::warning::$(m flutter_a.debug_keystore_empty)"
            echo "mode=default" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A keystore that is set but broken is not skipped silently; fail here
          mkdir -p ~/.android
          printf '%s' "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android
          echo "mode=keystore" >> "$GITHUB_OUTPUT"
          m flutter_a.debug_keystore_created

      # Prepare env vars - a .env file when ENV_MODE=dotenv, a temp file outside the project (--dart-define-from-file) for dart-define
      - name: Prepare env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          if [ "$ENV_MODE" = "dotenv" ]; then
            printf '%s\n' "$ENV_CONTENT" > .env
            m wf_flutter.dotenv_created
          elif [ -n "$ENV_CONTENT" ]; then
            DART_DEFINE_FILE="$RUNNER_TEMP/dart-define.env"
            printf '%s\n' "$ENV_CONTENT" > "$DART_DEFINE_FILE"
            echo "DART_DEFINE_FILE=$DART_DEFINE_FILE" >> "$GITHUB_ENV"
            m wf_flutter.dart_define_prepared
          fi

      - name: Setup Keystore and key.properties
        if: steps.signing.outputs.mode == 'keystore'
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          mkdir -p android/app/keystore
          # Reuse the keystore validated in the previous step
          cp ~/.android/debug.keystore android/app/keystore/key.jks
          m wf_flutter.keystore_from_debug
          ls -la android/app/keystore
          echo "storeFile=app/keystore/key.jks" > android/key.properties
          echo "storePassword=android" >> android/key.properties
          echo "keyAlias=androiddebugkey" >> android/key.properties
          echo "keyPassword=android" >> android/key.properties
          m wf_flutter.key_properties_created
          ls -la android/

      # Create google-services.json (optional) - no empty file is written when the Secret is empty
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p android/app
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            m wf_flutter.google_services_created
          else
            m wf_flutter.google_services_skipped
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Verify Flutter version
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          m wf_flutter.flutter_setup_done
          flutter --version

      - name: Cache Flutter dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles(format('{0}/**/pubspec.lock', env.FLUTTER_PROJECT_DIR)) }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles(format('{0}/android/**/build.gradle', env.FLUTTER_PROJECT_DIR), format('{0}/android/**/gradle-wrapper.properties', env.FLUTTER_PROJECT_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          flutter pub get
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi
          m wf_flutter.deps_installed
          ls -la

      - name: Setup Gradle
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}/android
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          # The default flutter create .gitignore does not commit gradlew - flutter build creates it when missing
          if [ -f gradlew ]; then
            chmod +x gradlew
            m wf_flutter.gradle_perm
          else
            m flutter_a.gradlew_missing
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Verify Java version
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          m wf_flutter.java_setup_done
          java -version

      - name: Get version info and calculate short commit hash
        id: version_info
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          CURRENT_VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          VERSION=$(echo $CURRENT_VERSION | cut -d'+' -f1)
          BUILD_NUMBER=$(echo $CURRENT_VERSION | cut -d'+' -f2)
          SHORT_COMMIT_HASH=$(echo ${{ github.sha }} | cut -c1-7)

          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "SHORT_COMMIT_HASH=$SHORT_COMMIT_HASH" >> $GITHUB_ENV

          m flutter_a.current_version current_version="$CURRENT_VERSION"
          m flutter_a.short_commit_hash short_commit_hash="$SHORT_COMMIT_HASH"

      # APK build (keeps the release build - built directly with flutter)
      - name: Build APK
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          flutter build apk --release ${DART_DEFINE_FILE:+--dart-define-from-file="$DART_DEFINE_FILE"}
          ls -la build/app/outputs/flutter-apk/ || true
          m wf_flutter.apk_built

      - name: Rename and Prepare APK
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          mkdir -p ./android/app/build/outputs/apk/release/
          mv ./build/app/outputs/flutter-apk/app-release.apk ./android/app/build/outputs/apk/release/${{ env.APP_ARTIFACT_NAME }}-v${{ env.VERSION }}-${{ env.SHORT_COMMIT_HASH }}.apk
          m wf_flutter.apk_renamed name="${{ env.APP_ARTIFACT_NAME }}-v${{ env.VERSION }}-${{ env.SHORT_COMMIT_HASH }}.apk"
          ls -la ./android/app/build/outputs/apk/release/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_ARTIFACT_NAME }}-apk
          path: ${{ env.FLUTTER_PROJECT_DIR }}/android/app/build/outputs/apk/release/${{ env.APP_ARTIFACT_NAME }}-v${{ env.VERSION }}-${{ env.SHORT_COMMIT_HASH }}.apk
          retention-days: 1

  deploy-android:
    name: Deploy Android APK
    runs-on: ubuntu-latest
    needs: build-android
    if: github.ref == 'refs/heads/{{MAIN_BRANCH}}'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: List repository contents for deploy
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          m wf_flutter.repo_checked_out_deploy
          ls -la

      - name: Install dependencies
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          sudo apt-get update
          sudo apt-get install -y smbclient jq
          m wf_flutter.smb_deps_installed

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_ARTIFACT_NAME }}-apk
          path: android/app/build/outputs/

      - name: List downloaded structure (Debug)
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          ls -alR android/app/build/outputs
          m wf_flutter.download_listed

      - name: Find APK file
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          APK_FILE=$(find android/app/build/outputs/ -name "*.apk" | head -n 1)
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          APK_NAME=$(basename "$APK_FILE")
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          m wf_flutter.apk_file_found file="$APK_FILE"

      - name: Upload files to server via SMB
        env:
          SMB_USERNAME: ${{ secrets.SERVER_USER }}
          SMB_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          SMB_SERVER=${{ secrets.SERVER_HOST }}
          SMB_PORT=${{ env.SMB_PORT }}
          SMB_SHARE=${{ env.SMB_SHARE }}
          SMB_PATH="/${{ env.APP_ARTIFACT_NAME }}${{ env.SMB_PATH_ANDROID }}"
          m wf_flutter.smb_uploading name="${{ env.APK_NAME }}"
          m wf_flutter.smb_path path="$SMB_PATH"
          smbclient "//$SMB_SERVER/$SMB_SHARE" -p "$SMB_PORT" -U "$SMB_USERNAME%$SMB_PASSWORD" -m SMB3 -d 10 -c "mkdir $SMB_PATH; cd $SMB_PATH; put ${{ env.APK_FILE }} ${{ env.APK_NAME }}"
          m wf_flutter.smb_uploaded

      - name: Update CICD history JSON
        env:
          SMB_USERNAME: ${{ secrets.SERVER_USER }}
          SMB_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          export TZ='Asia/Seoul'
          BUILD_DATE=$(date +"%Y-%m-%d %H:%M")
          FILE_SIZE=$(stat -c%s "${{ env.APK_FILE }}")
          COMMIT_LINK="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          FULL_COMMIT_HASH="${{ github.sha }}"
          HISTORY_FILE="${{ env.APP_ARTIFACT_NAME }}-android-cicd-history.json"

          NEW_BUILD_INFO=$(jq -n \
            --arg apk_name "${{ env.APK_NAME }}" \
            --arg file_size "$FILE_SIZE" \
            --arg build_date "$BUILD_DATE" \
            --arg commit_link "$COMMIT_LINK" \
            --arg full_commit_hash "$FULL_COMMIT_HASH" \
            '{apk_name: $apk_name, file_size: $file_size, build_date: $build_date, commit_link: $commit_link, full_commit_hash: $full_commit_hash}')

          SMB_SERVER=${{ secrets.SERVER_HOST }}
          SMB_PORT=${{ env.SMB_PORT }}
          SMB_SHARE=${{ env.SMB_SHARE }}
          SMB_PATH="/${{ env.APP_ARTIFACT_NAME }}${{ env.SMB_PATH_ANDROID }}"

          smbclient "//$SMB_SERVER/$SMB_SHARE" -p "$SMB_PORT" -U "$SMB_USERNAME%$SMB_PASSWORD" -m SMB3 -d 10 -c "cd $SMB_PATH; get $HISTORY_FILE" || echo '{"files": []}' > $HISTORY_FILE
          m wf_flutter.history_loaded file="$HISTORY_FILE"
          cat $HISTORY_FILE

          jq --argjson new_build "$NEW_BUILD_INFO" '.files += [$new_build]' $HISTORY_FILE > updated.json
          m wf_flutter.history_updated file="$HISTORY_FILE"
          cat updated.json

          smbclient "//$SMB_SERVER/$SMB_SHARE" -p "$SMB_PORT" -U "$SMB_USERNAME%$SMB_PASSWORD" -m SMB3 -d 10 -c "cd $SMB_PATH; put updated.json $HISTORY_FILE"
          m wf_flutter.history_uploaded file="$HISTORY_FILE"
