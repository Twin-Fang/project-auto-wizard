# project-auto-wizard:managed-workflow
# Flutter CI (code analysis and build verification) workflow
#
# On a pull request or a push to the {{MAIN_BRANCH}} branch, this workflow
# verifies static analysis (flutter analyze), tests (flutter test) and the Android/iOS app builds.
#
# Key features:
# - Runs automatically when a PR is opened/updated
# - Runs automatically on a push to the {{MAIN_BRANCH}} branch
# - Checks code quality with flutter analyze
# - Runs flutter test when test/ contains tests (*_test.dart); skipped otherwise
# - Android/iOS builds can be enabled/disabled individually
# - Analyze Only mode: run only the code analysis, without builds
# - On a PR, progress is updated live in a comment
# - Detailed error info when a build fails
# - Analyze and builds run in parallel to save time
#
# Usage:
# 1. Edit the values in the env section at the top for your project
# 2. Set ANALYZE_ONLY to true to run only the code analysis, without builds
# 3. Choose the build target platforms with ENABLE_ANDROID and ENABLE_IOS
# 4. Customize the env file path with ENV_FILE_PATH
#
# Project settings
#
# ANALYZE_ONLY    : if true, only analyze and test run and builds are skipped (default: false)
# ENABLE_ANDROID  : whether to build Android (when ANALYZE_ONLY=false)
# ENABLE_IOS      : whether to build iOS (when ANALYZE_ONLY=false)
# FLUTTER_VERSION : Flutter SDK version (empty = latest stable)
# JAVA_VERSION    : Java version (for the Android build)
# XCODE_VERSION   : Xcode version (for the iOS build)
# ENV_FILE_PATH   : path where .env is created in dotenv mode (relative to the Flutter root, default: .env)
# ENV_MODE        : how env vars are passed - dart-define (--dart-define-from-file) | dotenv (.env file)
# FLUTTER_PROJECT_DIR : Flutter root path (set automatically at install; app etc. for a monorepo)
# PROJECT_PATH    : path used for change detection (set automatically at install; "." always runs)
#
# Required GitHub Secrets
# ENV_FILE (optional): contents of the .env file
#
# Note: CI only verifies builds, so no signing/deploy Secrets are needed
# Note: to use this CI as a required check in a monorepo, register only `ci-gate`, not the individual jobs.
#    (jobs skipped because no paths changed count as Success, and ci-gate decides the final result)

name: PROJECT-Flutter-CI

on:
  pull_request:
    branches: ["{{DEVELOP_BRANCH}}"]
    types: [opened, synchronize, reopened]
  push:
    branches: ["{{DEVELOP_BRANCH}}"]
  workflow_dispatch:
    inputs:
      analyze_only:
        description: 'Analyze Only mode (code analysis only, no builds)'
        type: boolean
        default: false
      enable_android:
        description: 'Enable the Android build (when Analyze Only is false)'
        type: boolean
        default: true
      enable_ios:
        description: 'Enable the iOS build (when Analyze Only is false)'
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

# Project settings (edit the values below)
env:
  # Monorepo change-detection path (set automatically at install; "." for a single repo)
  PROJECT_PATH: "."  # @wizard auto:project-path
  # Flutter root path (relative to the repo root): "." for a single repo, "app" etc. for a monorepo - set automatically at install
  FLUTTER_PROJECT_DIR: "."  # @wizard auto:flutter-root
  # How env vars are passed (dart-define | dotenv) - set automatically from the install-time choice
  ENV_MODE: "dart-define"  # @wizard auto:flutter-env-mode

  # CI mode settings
  ANALYZE_ONLY: "false"     # true: run only analyze and test (skip builds), false: analyze, test and builds

  # Build target platform settings (only applied when ANALYZE_ONLY=false)
  ENABLE_ANDROID: "true"    # enable the Android build (true/false)
  ENABLE_IOS: "true"        # enable the iOS build (true/false)

  # Project settings
  # Flutter SDK version - leave empty to use the latest stable channel (matches the SDK constraint of a fresh flutter create project).
  # To pin a version, write it like "3.38.9". It must satisfy the environment.sdk range in pubspec.yaml.
  FLUTTER_VERSION: ""
  JAVA_VERSION: "__JAVA_VERSION__"  # @wizard ask:17
  XCODE_VERSION: "26.0"
  ENV_FILE_PATH: ".env"     # path where .env is created in dotenv mode (relative to the Flutter root, customizable)

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 0: change detection (later jobs run only when something under PROJECT_PATH changed)
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      project: ${{ steps.filter.outputs.project }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check whether the project path changed
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          # For a push, compare only the commits in this push (relative to the previous commit, github.event.before).
          # If left empty, the result is based on the cumulative diff against the default branch, so skipping would effectively never happen.
          # The first push of a new branch (before is all zeros) or a PR uses an empty value -> default behavior (compare against the default branch / PR base).
          base: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
          filters: |
            project:
              - '${{ env.PROJECT_PATH == '.' && '**' || format('{0}/**', env.PROJECT_PATH) }}'

  # Job 1: preparation
  prepare:
    name: Prepare CI
    needs: changes
    if: ${{ (github.event_name == 'workflow_dispatch' || needs.changes.outputs.project == 'true') }}
    runs-on: ubuntu-latest

    outputs:
      comment_id: ${{ steps.comment.outputs.comment_id }}
      start_time: ${{ steps.comment.outputs.start_time }}
      branch_name: ${{ steps.info.outputs.branch_name }}
      commit_hash: ${{ steps.info.outputs.commit_hash }}
      analyze_only: ${{ steps.config.outputs.analyze_only }}
      enable_android: ${{ steps.config.outputs.enable_android }}
      enable_ios: ${{ steps.config.outputs.enable_ios }}

    steps:
      - name: Checkout messages
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/messages.py
            version.yml
          sparse-checkout-cone-mode: false

      - name: Load messages
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          echo "PAW_MSG=$(cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py dump flutter_a.ci_)" >> "$GITHUB_ENV"

      # Pass the settings on as outputs
      - name: Pass settings
        id: config
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          # Check the workflow_dispatch inputs
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ANALYZE_ONLY="${{ github.event.inputs.analyze_only }}"
            ENABLE_ANDROID="${{ github.event.inputs.enable_android }}"
            ENABLE_IOS="${{ github.event.inputs.enable_ios }}"
          else
            ANALYZE_ONLY="${{ env.ANALYZE_ONLY }}"
            ENABLE_ANDROID="${{ env.ENABLE_ANDROID }}"
            ENABLE_IOS="${{ env.ENABLE_IOS }}"
          fi

          echo "analyze_only=$ANALYZE_ONLY" >> $GITHUB_OUTPUT
          echo "enable_android=$ENABLE_ANDROID" >> $GITHUB_OUTPUT
          echo "enable_ios=$ENABLE_IOS" >> $GITHUB_OUTPUT
          m flutter_a.ci_config_header
          m wf_flutter.ci_analyze_only value="$ANALYZE_ONLY"
          echo "  Android: $ENABLE_ANDROID"
          echo "  iOS: $ENABLE_IOS"
          m flutter_a.ci_config_trigger event_name="${{ github.event_name }}"

      - name: Collect build info
        id: info
        env:
          # Branch names are passed through env so shell metacharacters in them are never parsed as commands
          PAW_EVENT_NAME: ${{ github.event_name }}
          PAW_HEAD_REF: ${{ github.head_ref }}
          PAW_REF_NAME: ${{ github.ref_name }}
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          if [ "$PAW_EVENT_NAME" == "pull_request" ]; then
            BRANCH_NAME="$PAW_HEAD_REF"
          else
            BRANCH_NAME="$PAW_REF_NAME"
          fi
          COMMIT_HASH=$(echo "${{ github.sha }}" | cut -c1-7)

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT

          m flutter_a.ci_info_header
          m flutter_a.ci_info_branch branch_name="$BRANCH_NAME"
          m flutter_a.ci_info_commit commit_hash="$COMMIT_HASH"

      - name: Create progress comment
        id: comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          PAW_IN_GITHUB_RUN_ID: ${{ github.run_id }}
          PAW_IN_STEPS_CONFIG_OUTPUTS_ANALYZE_ONLY: ${{ steps.config.outputs.analyze_only }}
          PAW_IN_STEPS_CONFIG_OUTPUTS_ENABLE_ANDROID: ${{ steps.config.outputs.enable_android }}
          PAW_IN_STEPS_CONFIG_OUTPUTS_ENABLE_IOS: ${{ steps.config.outputs.enable_ios }}
          PAW_IN_STEPS_INFO_OUTPUTS_BRANCH_NAME: ${{ steps.info.outputs.branch_name }}
          PAW_IN_STEPS_INFO_OUTPUTS_COMMIT_HASH: ${{ steps.info.outputs.commit_hash }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const M = JSON.parse(process.env.PAW_MSG);
            const m = (k, p = {}) => M[k].replace(/\{(\w+)\}/g, (s, n) => (n in p ? p[n] : s));
            const prNumber = context.payload.pull_request.number;
            const branchName = process.env.PAW_IN_STEPS_INFO_OUTPUTS_BRANCH_NAME;
            const commitHash = process.env.PAW_IN_STEPS_INFO_OUTPUTS_COMMIT_HASH;
            const analyzeOnly = process.env.PAW_IN_STEPS_CONFIG_OUTPUTS_ANALYZE_ONLY === 'true';
            const enableAndroid = process.env.PAW_IN_STEPS_CONFIG_OUTPUTS_ENABLE_ANDROID === 'true';
            const enableIos = process.env.PAW_IN_STEPS_CONFIG_OUTPUTS_ENABLE_IOS === 'true';
            const runId = process.env.PAW_IN_GITHUB_RUN_ID;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            const startTime = Date.now();

            // Decide the header
            const header = analyzeOnly
              ? m('flutter_a.ci_hdr_analyze_running')
              : m('flutter_a.ci_hdr_running');

            // Decide the platform status
            let androidStatus, iosStatus;
            if (analyzeOnly) {
              androidStatus = m('flutter_a.ci_status_skipped');
              iosStatus = m('flutter_a.ci_status_skipped');
            } else {
              androidStatus = enableAndroid ? m('flutter_a.ci_status_running') : m('flutter_a.ci_status_disabled');
              iosStatus = enableIos ? m('flutter_a.ci_status_running') : m('flutter_a.ci_status_disabled');
            }

            const bodyParts = [
              header,
              '',
              m('flutter_a.ci_table_head'),
              '|----------|------|----------|',
              m('flutter_a.ci_row_analyze_running'),
              m('flutter_a.ci_row_test_running'),
              m('flutter_a.ci_row_android_pending', { status: androidStatus }),
              m('flutter_a.ci_row_ios_pending', { status: iosStatus }),
              '',
              m('flutter_a.ci_info_head'),
              '|------|-----|',
              m('flutter_a.ci_row_branch', { branch: branchName }),
              m('flutter_a.ci_row_commit', { commit: commitHash })
            ];

            if (analyzeOnly) {
              bodyParts.push('');
              bodyParts.push(m('flutter_a.ci_note_analyze_only_running'));
            }

            bodyParts.push('');
            bodyParts.push(m('flutter_a.ci_link_live_log', { url: runUrl }));
            bodyParts.push('');
            bodyParts.push('---');
            bodyParts.push(m('flutter_a.ci_footer_auto_update'));

            const body = bodyParts.join('\n');

            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });

            console.log(m('flutter_a.ci_log_comment_created', { id: comment.id }));
            core.setOutput('comment_id', comment.id);
            core.setOutput('start_time', startTime);

  # Job 2: code analysis (parallel)
  analyze:
    name: Code analysis
    runs-on: ubuntu-latest
    needs: [changes, prepare]
    if: ${{ (github.event_name == 'workflow_dispatch' || needs.changes.outputs.project == 'true') }}
    defaults:
      run:
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}

    outputs:
      status: ${{ steps.result.outputs.status }}
      test_status: ${{ steps.result.outputs.test_status }}
      test_duration: ${{ steps.result.outputs.test_duration }}
      duration: ${{ steps.result.outputs.duration }}

    steps:
      - name: Record analysis start time
        id: analyze_start
        uses: actions/github-script@v9
        with:
          script: |
            core.setOutput('time', Date.now().toString());

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load messages
        id: load_messages
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          echo "PAW_MSG=$(cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py dump flutter_a.ci_)" >> "$GITHUB_ENV"

      # Prepare env vars - a .env file when ENV_MODE=dotenv, a temp file outside the project (--dart-define-from-file) for dart-define
      - name: Prepare env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          if [ "$ENV_MODE" = "dotenv" ]; then
            printf '%s\n' "$ENV_CONTENT" > "$ENV_FILE_PATH"
            m wf_flutter.env_file_created file="$ENV_FILE_PATH"
          elif [ -n "$ENV_CONTENT" ]; then
            DART_DEFINE_FILE="$RUNNER_TEMP/dart-define.env"
            printf '%s\n' "$ENV_CONTENT" > "$DART_DEFINE_FILE"
            echo "DART_DEFINE_FILE=$DART_DEFINE_FILE" >> "$GITHUB_ENV"
            m wf_flutter.dart_define_prepared
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Verify Flutter version
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          m wf_flutter.flutter_setup_done_ok
          flutter --version

      - name: Cache Flutter dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles(format('{0}/**/pubspec.lock', env.FLUTTER_PROJECT_DIR)) }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Install dependencies
        id: deps
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          flutter pub get
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi
          m wf_flutter.deps_installed_ok

      - name: Run Flutter Analyze
        id: analyze
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          m flutter_a.ci_analyze_start
          flutter analyze --no-fatal-infos
          m flutter_a.ci_analyze_done

      # Show the test result separately even if analyze fails. A failure fails the job and therefore the CI Gate too.
      - name: Run Flutter Test
        id: test
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          # flutter test itself fails when test/ has no *_test.dart, so skip it
          if [ -d test ] && [ -n "$(find test -name '*_test.dart' -print -quit)" ]; then
            m flutter_a.ci_test_start
            TEST_STARTED=$(date +%s)
            flutter test ${DART_DEFINE_FILE:+--dart-define-from-file="$DART_DEFINE_FILE"}
            echo "seconds=$(( $(date +%s) - TEST_STARTED ))" >> "$GITHUB_OUTPUT"
            echo "ran=true" >> "$GITHUB_OUTPUT"
            m flutter_a.ci_test_passed
          else
            echo "::notice title=$(m flutter_a.ci_test_skipped_title)::$(m flutter_a.ci_test_skipped_body)"
            echo "ran=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record analysis result
        id: result
        if: always() && steps.load_messages.outcome == 'success'
        uses: actions/github-script@v9
        env:
          PAW_IN_STEPS_ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          PAW_IN_STEPS_ANALYZE_START_OUTPUTS_TIME: ${{ steps.analyze_start.outputs.time }}
          PAW_IN_STEPS_TEST_OUTCOME: ${{ steps.test.outcome }}
          PAW_IN_STEPS_TEST_OUTPUTS_RAN: ${{ steps.test.outputs.ran }}
          PAW_IN_STEPS_TEST_OUTPUTS_SECONDS: ${{ steps.test.outputs.seconds }}
        with:
          script: |
            const M = JSON.parse(process.env.PAW_MSG);
            const m = (k, p = {}) => M[k].replace(/\{(\w+)\}/g, (s, n) => (n in p ? p[n] : s));
            const analyzeStart = parseInt(process.env.PAW_IN_STEPS_ANALYZE_START_OUTPUTS_TIME);
            const now = Date.now();
            const elapsed = now - analyzeStart;
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            const duration = minutes > 0 ? m('flutter_a.ci_dur_min_sec', { minutes, seconds }) : m('flutter_a.ci_dur_sec', { seconds });

            const status = process.env.PAW_IN_STEPS_ANALYZE_OUTCOME === 'success' ? 'success' : 'failure';
            // none: no test files, skipped: not run because the dependency install failed
            const testOutcome = process.env.PAW_IN_STEPS_TEST_OUTCOME;
            const testStatus = testOutcome === 'success'
              ? (process.env.PAW_IN_STEPS_TEST_OUTPUTS_RAN === 'true' ? 'success' : 'none')
              : (testOutcome === 'failure' ? 'failure' : 'skipped');

            core.setOutput('status', status);
            // Only a run that finished has a measured time; otherwise leave it empty (shown as -)
            const testSeconds = parseInt(process.env.PAW_IN_STEPS_TEST_OUTPUTS_SECONDS, 10);
            const testDuration = Number.isNaN(testSeconds) ? '' : (testSeconds >= 60
              ? m('flutter_a.ci_dur_min_sec', { minutes: Math.floor(testSeconds / 60), seconds: testSeconds % 60 })
              : m('flutter_a.ci_dur_sec', { seconds: testSeconds }));

            core.setOutput('test_status', testStatus);
            core.setOutput('test_duration', testDuration);
            core.setOutput('duration', duration);
            console.log(m('flutter_a.ci_log_analyze_result', { status, test: testStatus, duration }));

  # Job 3: Android build (conditional, parallel)
  build-android:
    name: Android build
    if: |
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.project == 'true') &&
      needs.prepare.outputs.analyze_only != 'true' &&
      needs.prepare.outputs.enable_android == 'true'
    runs-on: ubuntu-latest
    needs: [changes, prepare]
    defaults:
      run:
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}

    outputs:
      status: ${{ steps.result.outputs.status }}
      duration: ${{ steps.result.outputs.duration }}

    steps:
      - name: Record build start time
        id: build_start
        uses: actions/github-script@v9
        with:
          script: |
            core.setOutput('time', Date.now().toString());

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load messages
        id: load_messages
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          echo "PAW_MSG=$(cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py dump flutter_a.ci_)" >> "$GITHUB_ENV"

      # Prepare env vars - a .env file when ENV_MODE=dotenv, a temp file outside the project (--dart-define-from-file) for dart-define
      - name: Prepare env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          if [ "$ENV_MODE" = "dotenv" ]; then
            printf '%s\n' "$ENV_CONTENT" > "$ENV_FILE_PATH"
            m wf_flutter.env_file_created file="$ENV_FILE_PATH"
          elif [ -n "$ENV_CONTENT" ]; then
            DART_DEFINE_FILE="$RUNNER_TEMP/dart-define.env"
            printf '%s\n' "$ENV_CONTENT" > "$DART_DEFINE_FILE"
            echo "DART_DEFINE_FILE=$DART_DEFINE_FILE" >> "$GITHUB_ENV"
            m wf_flutter.dart_define_prepared
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Verify Flutter version
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          m wf_flutter.flutter_setup_done_ok
          flutter --version

      - name: Cache Flutter dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles(format('{0}/**/pubspec.lock', env.FLUTTER_PROJECT_DIR)) }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles(format('{0}/android/**/build.gradle', env.FLUTTER_PROJECT_DIR), format('{0}/android/**/gradle-wrapper.properties', env.FLUTTER_PROJECT_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          flutter pub get
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi
          m wf_flutter.deps_installed_ok

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Verify Java version
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          m wf_flutter.java_setup_done_ok
          java -version

      - name: Setup Gradle
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}/android
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          # The default flutter create .gitignore does not commit gradlew - flutter build creates it when missing
          if [ -f gradlew ]; then
            chmod +x gradlew
            m wf_flutter.gradle_perm_ok
          else
            m flutter_a.gradlew_missing
          fi

      # APK build (CI only verifies the build, so use a debug build that needs no signing)
      - name: Build APK
        id: build
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          m flutter_a.ci_apk_start
          flutter build apk --debug ${DART_DEFINE_FILE:+--dart-define-from-file="$DART_DEFINE_FILE"}
          m flutter_a.ci_apk_done
          ls -la ./build/app/outputs/flutter-apk/ || true

      - name: Record build result
        id: result
        if: always() && steps.load_messages.outcome == 'success'
        uses: actions/github-script@v9
        env:
          PAW_IN_STEPS_BUILD_OUTCOME: ${{ steps.build.outcome }}
          PAW_IN_STEPS_BUILD_START_OUTPUTS_TIME: ${{ steps.build_start.outputs.time }}
        with:
          script: |
            const M = JSON.parse(process.env.PAW_MSG);
            const m = (k, p = {}) => M[k].replace(/\{(\w+)\}/g, (s, n) => (n in p ? p[n] : s));
            const buildStart = parseInt(process.env.PAW_IN_STEPS_BUILD_START_OUTPUTS_TIME);
            const now = Date.now();
            const elapsed = now - buildStart;
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            const duration = minutes > 0 ? m('flutter_a.ci_dur_min_sec', { minutes, seconds }) : m('flutter_a.ci_dur_sec', { seconds });

            const status = process.env.PAW_IN_STEPS_BUILD_OUTCOME === 'success' ? 'success' : 'failure';

            core.setOutput('status', status);
            core.setOutput('duration', duration);
            console.log(m('flutter_a.ci_log_android_result', { status, duration }));

  # Job 4: iOS build (conditional, parallel)
  build-ios:
    name: iOS build
    if: |
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.project == 'true') &&
      needs.prepare.outputs.analyze_only != 'true' &&
      needs.prepare.outputs.enable_ios == 'true'
    runs-on: macos-26
    needs: [changes, prepare]
    defaults:
      run:
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}

    outputs:
      status: ${{ steps.result.outputs.status }}
      duration: ${{ steps.result.outputs.duration }}

    steps:
      - name: Record build start time
        id: build_start
        uses: actions/github-script@v9
        with:
          script: |
            core.setOutput('time', Date.now().toString());

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load messages
        id: load_messages
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          echo "PAW_MSG=$(cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py dump flutter_a.ci_)" >> "$GITHUB_ENV"

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Install iOS device platform
        env:
          # xcode-select alone does not propagate to subprocesses, so set it explicitly
          DEVELOPER_DIR: /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          m wf_flutter.xcode_platform_check
          if ls "$DEVELOPER_DIR/Platforms/iPhoneOS.platform/" 2>/dev/null; then
            m wf_flutter.xcode_platform_exists
          else
            m wf_flutter.xcode_platform_missing
          fi
          m wf_flutter.xcode_install_pkgs
          sudo installer -pkg /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Resources/Packages/MobileDevice.pkg -target /
          sudo installer -pkg /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Resources/Packages/MobileDeviceDevelopment.pkg -target /
          m wf_flutter.xcode_license
          sudo xcodebuild -license accept
          m wf_flutter.xcode_init
          xcrun simctl list >/dev/null 2>&1 || true
          m wf_flutter.xcode_download
          xcodebuild -downloadPlatform iOS

      # Prepare env vars - a .env file when ENV_MODE=dotenv, a temp file outside the project (--dart-define-from-file) for dart-define
      - name: Prepare env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          if [ "$ENV_MODE" = "dotenv" ]; then
            printf '%s\n' "$ENV_CONTENT" > "$ENV_FILE_PATH"
            m wf_flutter.env_file_created file="$ENV_FILE_PATH"
          elif [ -n "$ENV_CONTENT" ]; then
            DART_DEFINE_FILE="$RUNNER_TEMP/dart-define.env"
            printf '%s\n' "$ENV_CONTENT" > "$DART_DEFINE_FILE"
            echo "DART_DEFINE_FILE=$DART_DEFINE_FILE" >> "$GITHUB_ENV"
            m wf_flutter.dart_define_prepared
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Verify Flutter version
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          m wf_flutter.flutter_setup_done_ok
          flutter --version

      - name: Cache Flutter dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles(format('{0}/**/pubspec.lock', env.FLUTTER_PROJECT_DIR)) }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Install dependencies
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          flutter pub get
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi
          m wf_flutter.deps_installed_ok

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          # A default project without plugins has no Podfile - once plugins are added, flutter build creates it
          if [ -f ios/Podfile ]; then
            gem install cocoapods
            (cd ios && (pod install --repo-update || pod install))
            echo "✅ CocoaPods installed"
          else
            m flutter_a.ci_podfile_missing
          fi

      - name: Build iOS
        id: build
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          m flutter_a.ci_ios_start
          flutter build ios --release --no-codesign ${DART_DEFINE_FILE:+--dart-define-from-file="$DART_DEFINE_FILE"}
          m flutter_a.ci_ios_done

      - name: Record build result
        id: result
        if: always() && steps.load_messages.outcome == 'success'
        uses: actions/github-script@v9
        env:
          PAW_IN_STEPS_BUILD_OUTCOME: ${{ steps.build.outcome }}
          PAW_IN_STEPS_BUILD_START_OUTPUTS_TIME: ${{ steps.build_start.outputs.time }}
        with:
          script: |
            const M = JSON.parse(process.env.PAW_MSG);
            const m = (k, p = {}) => M[k].replace(/\{(\w+)\}/g, (s, n) => (n in p ? p[n] : s));
            const buildStart = parseInt(process.env.PAW_IN_STEPS_BUILD_START_OUTPUTS_TIME);
            const now = Date.now();
            const elapsed = now - buildStart;
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            const duration = minutes > 0 ? m('flutter_a.ci_dur_min_sec', { minutes, seconds }) : m('flutter_a.ci_dur_sec', { seconds });

            const status = process.env.PAW_IN_STEPS_BUILD_OUTCOME === 'success' ? 'success' : 'failure';

            core.setOutput('status', status);
            core.setOutput('duration', duration);
            console.log(m('flutter_a.ci_log_ios_result', { status, duration }));

  # Job 5: result report
  report:
    name: Report results
    if: always() && github.event_name == 'pull_request' && needs.changes.outputs.project == 'true'
    runs-on: ubuntu-latest
    needs: [changes, prepare, analyze, build-android, build-ios]

    steps:
      - name: Checkout messages
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/messages.py
            version.yml
          sparse-checkout-cone-mode: false

      - name: Load messages
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          echo "PAW_MSG=$(cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py dump flutter_a.ci_)" >> "$GITHUB_ENV"

      - name: Update final result comment
        uses: actions/github-script@v9
        env:
          PAW_IN_GITHUB_RUN_ID: ${{ github.run_id }}
          PAW_IN_NEEDS_ANALYZE_OUTPUTS_DURATION: ${{ needs.analyze.outputs.duration }}
          PAW_IN_NEEDS_ANALYZE_OUTPUTS_STATUS: ${{ needs.analyze.outputs.status }}
          PAW_IN_NEEDS_ANALYZE_OUTPUTS_TEST_STATUS: ${{ needs.analyze.outputs.test_status }}
          PAW_IN_NEEDS_ANALYZE_OUTPUTS_TEST_DURATION: ${{ needs.analyze.outputs.test_duration }}
          PAW_IN_NEEDS_BUILD_ANDROID_OUTPUTS_DURATION: ${{ needs.build-android.outputs.duration }}
          PAW_IN_NEEDS_BUILD_ANDROID_OUTPUTS_STATUS: ${{ needs.build-android.outputs.status }}
          PAW_IN_NEEDS_BUILD_IOS_OUTPUTS_DURATION: ${{ needs.build-ios.outputs.duration }}
          PAW_IN_NEEDS_BUILD_IOS_OUTPUTS_STATUS: ${{ needs.build-ios.outputs.status }}
          PAW_IN_NEEDS_PREPARE_OUTPUTS_ANALYZE_ONLY: ${{ needs.prepare.outputs.analyze_only }}
          PAW_IN_NEEDS_PREPARE_OUTPUTS_BRANCH_NAME: ${{ needs.prepare.outputs.branch_name }}
          PAW_IN_NEEDS_PREPARE_OUTPUTS_COMMENT_ID: ${{ needs.prepare.outputs.comment_id }}
          PAW_IN_NEEDS_PREPARE_OUTPUTS_COMMIT_HASH: ${{ needs.prepare.outputs.commit_hash }}
          PAW_IN_NEEDS_PREPARE_OUTPUTS_ENABLE_ANDROID: ${{ needs.prepare.outputs.enable_android }}
          PAW_IN_NEEDS_PREPARE_OUTPUTS_ENABLE_IOS: ${{ needs.prepare.outputs.enable_ios }}
          PAW_IN_NEEDS_PREPARE_OUTPUTS_START_TIME: ${{ needs.prepare.outputs.start_time }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const M = JSON.parse(process.env.PAW_MSG);
            const m = (k, p = {}) => M[k].replace(/\{(\w+)\}/g, (s, n) => (n in p ? p[n] : s));
            const commentId = parseInt(process.env.PAW_IN_NEEDS_PREPARE_OUTPUTS_COMMENT_ID);
            const startTime = parseInt(process.env.PAW_IN_NEEDS_PREPARE_OUTPUTS_START_TIME);
            const branchName = process.env.PAW_IN_NEEDS_PREPARE_OUTPUTS_BRANCH_NAME;
            const commitHash = process.env.PAW_IN_NEEDS_PREPARE_OUTPUTS_COMMIT_HASH;
            const analyzeOnly = process.env.PAW_IN_NEEDS_PREPARE_OUTPUTS_ANALYZE_ONLY === 'true';
            const enableAndroid = process.env.PAW_IN_NEEDS_PREPARE_OUTPUTS_ENABLE_ANDROID === 'true';
            const enableIos = process.env.PAW_IN_NEEDS_PREPARE_OUTPUTS_ENABLE_IOS === 'true';
            const runId = process.env.PAW_IN_GITHUB_RUN_ID;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            // Collect the results
            const analyzeStatus = process.env.PAW_IN_NEEDS_ANALYZE_OUTPUTS_STATUS;
            const analyzeDuration = process.env.PAW_IN_NEEDS_ANALYZE_OUTPUTS_DURATION || '-';
            const testStatus = process.env.PAW_IN_NEEDS_ANALYZE_OUTPUTS_TEST_STATUS;
            const testDuration = process.env.PAW_IN_NEEDS_ANALYZE_OUTPUTS_TEST_DURATION || '-';
            const androidStatus = process.env.PAW_IN_NEEDS_BUILD_ANDROID_OUTPUTS_STATUS;
            const androidDuration = process.env.PAW_IN_NEEDS_BUILD_ANDROID_OUTPUTS_DURATION || '-';
            const iosStatus = process.env.PAW_IN_NEEDS_BUILD_IOS_OUTPUTS_STATUS;
            const iosDuration = process.env.PAW_IN_NEEDS_BUILD_IOS_OUTPUTS_DURATION || '-';

            // Compute the total duration
            const now = Date.now();
            const totalElapsed = now - startTime;
            const totalMin = Math.floor(totalElapsed / 60000);
            const totalSec = Math.floor((totalElapsed % 60000) / 1000);
            const totalDuration = totalMin > 0 ? m('flutter_a.ci_dur_min_sec', { minutes: totalMin, seconds: totalSec }) : m('flutter_a.ci_dur_sec', { seconds: totalSec });

            // Decide the status
            let overallSuccess = true;
            let analyzeDisplay, androidDisplay, iosDisplay;

            // Analyze status
            if (analyzeStatus === 'success') {
              analyzeDisplay = m('flutter_a.ci_status_success');
            } else {
              analyzeDisplay = m('flutter_a.ci_status_failure');
              overallSuccess = false;
            }

            // Test status (no test files is not treated as a failure)
            let testDisplay;
            if (testStatus === 'success') {
              testDisplay = m('flutter_a.ci_status_success');
            } else if (testStatus === 'none') {
              testDisplay = m('flutter_a.ci_status_no_tests');
            } else {
              testDisplay = testStatus === 'failure' ? m('flutter_a.ci_status_failure') : m('flutter_a.ci_status_not_run');
              overallSuccess = false;
            }

            // Android status
            if (analyzeOnly) {
              androidDisplay = m('flutter_a.ci_status_skipped');
            } else if (!enableAndroid) {
              androidDisplay = m('flutter_a.ci_status_disabled');
            } else if (androidStatus === 'success') {
              androidDisplay = m('flutter_a.ci_status_success');
            } else {
              androidDisplay = m('flutter_a.ci_status_failure');
              overallSuccess = false;
            }

            // iOS status
            if (analyzeOnly) {
              iosDisplay = m('flutter_a.ci_status_skipped');
            } else if (!enableIos) {
              iosDisplay = m('flutter_a.ci_status_disabled');
            } else if (iosStatus === 'success') {
              iosDisplay = m('flutter_a.ci_status_success');
            } else {
              iosDisplay = m('flutter_a.ci_status_failure');
              overallSuccess = false;
            }

            // Decide the header
            let header;
            if (analyzeOnly) {
              header = overallSuccess
                ? m('flutter_a.ci_hdr_analyze_success')
                : m('flutter_a.ci_hdr_analyze_failure');
            } else {
              header = overallSuccess
                ? m('flutter_a.ci_hdr_success')
                : m('flutter_a.ci_hdr_failure');
            }

            // Build the comment body
            const bodyParts = [
              header,
              '',
              m('flutter_a.ci_table_head'),
              '|----------|------|----------|',
              `| 🔍 Analyze | ${analyzeDisplay} | ${analyzeDuration} |`,
              `| 🧪 Test | ${testDisplay} | ${testDuration} |`,
              m('flutter_a.ci_row_android_result', { status: androidDisplay, duration: analyzeOnly || !enableAndroid ? '-' : androidDuration }),
              m('flutter_a.ci_row_ios_result', { status: iosDisplay, duration: analyzeOnly || !enableIos ? '-' : iosDuration }),
              '',
              m('flutter_a.ci_info_head'),
              '|------|-----|',
              m('flutter_a.ci_row_branch', { branch: branchName }),
              m('flutter_a.ci_row_commit', { commit: commitHash }),
              m('flutter_a.ci_row_total', { duration: totalDuration }),
              ''
            ];

            // Analyze Only mode note
            if (analyzeOnly && overallSuccess) {
              bodyParts.push(m('flutter_a.ci_note_analyze_only_done'));
              bodyParts.push('');
            }

            // Extra guidance on failure
            if (!overallSuccess) {
              bodyParts.push(
                m('flutter_a.ci_hdr_checks'),
                ''
              );

              if (analyzeStatus !== 'success') {
                bodyParts.push(m('flutter_a.ci_analyze_fail_title'));
                bodyParts.push(m('flutter_a.ci_analyze_fail_lint'));
                bodyParts.push(m('flutter_a.ci_analyze_fail_fix'));
                bodyParts.push('');
              }

              if (testStatus === 'failure') {
                bodyParts.push(m('flutter_a.ci_test_fail_title'));
                bodyParts.push(m('flutter_a.ci_test_fail_local'));
                bodyParts.push('');
              }

              if (!analyzeOnly && enableAndroid && androidStatus !== 'success') {
                bodyParts.push(m('flutter_a.ci_android_fail_title'));
                bodyParts.push(m('flutter_a.ci_android_fail_gradle'));
                bodyParts.push(m('flutter_a.ci_android_fail_deps'));
                bodyParts.push('');
              }

              if (!analyzeOnly && enableIos && iosStatus !== 'success') {
                bodyParts.push(m('flutter_a.ci_ios_fail_title'));
                bodyParts.push(m('flutter_a.ci_ios_fail_xcode'));
                bodyParts.push(m('flutter_a.ci_ios_fail_pods'));
                bodyParts.push('');
              }
            }

            bodyParts.push(m('flutter_a.ci_link_workflow_log', { url: runUrl }));

            const body = bodyParts.join('\n');

            // Update the comment
            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body: body
              });
              console.log(m('flutter_a.ci_log_result_updated'));
            } else {
              console.log(m('flutter_a.ci_log_no_comment_id'));
            }

  # Job 6: CI Gate (the single entry point to register as a required check)
  # Skipped jobs count as passed; any failure/cancelled result fails the gate.
  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [changes, prepare, analyze, build-android, build-ios, report]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout messages
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/messages.py
            version.yml
          sparse-checkout-cone-mode: false

      - name: Aggregate results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          m flutter_a.ci_gate_results results="$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            m flutter_a.ci_gate_failed
            exit 1
          fi
