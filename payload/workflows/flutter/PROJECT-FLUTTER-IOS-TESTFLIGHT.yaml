# project-auto-wizard:managed-workflow
# Flutter iOS TestFlight deploy workflow
#
# Builds the Flutter iOS app and deploys it to TestFlight automatically.
#
# The config files (ios/fastlane/Fastfile, ios/ExportOptions.plist) are installed by
# project-auto-wizard only when missing; existing files are never overwritten.
#
# Build pipeline:
#   1. flutter build ios --no-codesign (Flutter build)
#   2. xcodebuild archive (create the Xcode archive)
#   3. xcodebuild -exportArchive (create the IPA using ExportOptions.plist)
#   4. fastlane deploy (uses ios/fastlane/Fastfile; TestFlight or review submission depending on DEPLOY_MODE)
#
# Required GitHub Secrets
#
# Apple certificate & provisioning profile:
# APPLE_CERTIFICATE_BASE64: .p12 certificate (base64 encoded)
# APPLE_CERTIFICATE_PASSWORD: .p12 certificate password
# APPLE_PROVISIONING_PROFILE_BASE64: .mobileprovision file (base64 encoded)
# IOS_PROVISIONING_PROFILE_NAME: provisioning profile name
#
# App Store Connect API:
# APP_STORE_CONNECT_API_KEY_ID: API Key ID (10 characters)
# APP_STORE_CONNECT_ISSUER_ID: Issuer ID (UUID format)
# APP_STORE_CONNECT_API_KEY_BASE64: AuthKey_XXXXXX.p8 file (base64 encoded)
# IOS_BUNDLE_ID (Secret first, otherwise Variable): app bundle ID —
#   required when using store_prepare/store_submit (the Fastfile stops with a clear error if empty)
#
# Environment settings (optional):
# ENV_FILE (선택): contents of the .env file
# SECRETS_XCCONFIG (선택): contents of ios/Flutter/Secrets.xcconfig
#
# Initial setup
#
# 1. Configure the GitHub Secrets (see the list above)
#
# 2. Fill in the placeholders in ios/ExportOptions.plist (team ID, bundle ID, provisioning profile name) and commit:
#    git add ios/
#    git commit -m "chore: add iOS TestFlight deploy settings"
#
# 3. Push to the {{MAIN_BRANCH}} branch to start a deploy

name: PROJECT-iOS-TestFlight-Deploy

on:
  push:
    branches: ["{{MAIN_BRANCH}}"]
    # @wizard paths-anchor (in a monorepo the installer injects a paths filter here)
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "Deploy mode (store_only=up to TestFlight / store_prepare=right before ASC submission / store_submit=auto-submit for review)"
        required: false
        default: "store_only"  # @wizard auto:ios-deploy-mode
        type: choice
        options:
          - store_only
          - store_prepare
          - store_submit

# Project settings (edit the values below)
env:
  FLUTTER_PROJECT_DIR: "."  # @wizard auto:flutter-root
  # How env vars are passed (dart-define | dotenv) — set automatically from the value chosen at install
  ENV_MODE: "dart-define"  # @wizard auto:flutter-env-mode
  # Flutter SDK version — leave empty to use the latest stable channel (matches the SDK constraint of a fresh flutter create project).
  # To pin a version, write it like "3.38.9". It must satisfy environment.sdk in pubspec.yaml.
  FLUTTER_VERSION: ""
  XCODE_VERSION: "26.0"
  PROJECT_TYPE: "flutter"

  # Env file settings
  # Where to create the .env file in dotenv mode (relative to the Flutter root)
  ENV_FILE_PATH: ".env"

  # TestFlight changelog settings
  SKIP_WAITING_FOR_BUILD_PROCESSING: "false"

  # Deploy mode (store_only | store_prepare | store_submit)
  DEPLOY_MODE: ${{ github.event.inputs.deploy_mode || vars.IOS_DEPLOY_MODE || 'store_only' }}  # @wizard fallback:ios-deploy-mode

jobs:
  prepare-build:
    name: Set up environment
    runs-on: macos-26
    defaults:
      run:
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}

    outputs:
      version: ${{ steps.current_version.outputs.version }}
      build_number: ${{ steps.current_version.outputs.build_number }}
      project_type: ${{ steps.current_version.outputs.project_type }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: "{{MAIN_BRANCH}}"
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin {{MAIN_BRANCH}}

      # Report every missing setting up front, before importing certificates or building — otherwise the macOS runner builds for a long time and fails at an unrelated step
      - name: Validate deploy settings
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          FAILED=0
          MISSING=""
          for name in APPLE_CERTIFICATE_BASE64 APPLE_PROVISIONING_PROFILE_BASE64 IOS_PROVISIONING_PROFILE_NAME \
                      APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            [ -n "${!name}" ] || MISSING="$MISSING $name"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::$(m ios_testflight.secrets_missing missing="$MISSING")"
            FAILED=1
          fi
          if [ ! -f ios/ExportOptions.plist ]; then
            echo "::error::$(m ios_testflight.export_options_missing)"
            FAILED=1
          elif grep -Eq '__[A-Z][A-Z0-9_]*__' ios/ExportOptions.plist; then
            echo "::error::$(m ios_testflight.export_options_placeholders)"
            grep -En '__[A-Z][A-Z0-9_]*__' ios/ExportOptions.plist
            FAILED=1
          fi
          if [ ! -f ios/fastlane/Fastfile ]; then
            echo "::error::$(m ios_testflight.fastfile_missing_error)"
            FAILED=1
          fi
          [ "$FAILED" -eq 0 ] || exit 1
          m ios_testflight.preflight_ok

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Prepare env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          if [ "$ENV_MODE" = "dotenv" ]; then
            printf '%s\n' "$ENV_CONTENT" > "$ENV_FILE_PATH"
            echo "✅ $ENV_FILE_PATH file created"
          elif [ -n "$ENV_CONTENT" ]; then
            DART_DEFINE_FILE="$RUNNER_TEMP/dart-define.env"
            printf '%s\n' "$ENV_CONTENT" > "$DART_DEFINE_FILE"
            echo "DART_DEFINE_FILE=$DART_DEFINE_FILE" >> "$GITHUB_ENV"
            echo "dart-define file prepared"
          fi

      - name: Create Secrets.xcconfig file
        run: |
          mkdir -p ios/Flutter
          if [ -n "${{ secrets.SECRETS_XCCONFIG }}" ]; then
            echo "${{ secrets.SECRETS_XCCONFIG }}" > ios/Flutter/Secrets.xcconfig
            echo "Secrets.xcconfig created"
          else
            echo "// No secrets provided" > ios/Flutter/Secrets.xcconfig
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles(format('{0}/**/pubspec.lock', env.FLUTTER_PROJECT_DIR)) }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Install dependencies
        run: |
          flutter pub get
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          # A default project without plugins has no Podfile — flutter build creates one once a plugin is added
          if [ -f ios/Podfile ]; then
            gem install cocoapods
            (cd ios && pod install)
          else
            m ios_testflight.podfile_skip
          fi

      - name: Get current version
        id: current_version
        working-directory: ${{ github.workspace }}   # version_manager.py must read version.yml at the repo root
        run: |
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          VERSION=$(python3 .github/scripts/version_manager.py get | tail -n 1)
          BUILD_NUMBER=$(python3 .github/scripts/version_manager.py get-code | tail -n 1)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "project_type=${{ env.PROJECT_TYPE }}" >> $GITHUB_OUTPUT

          m ios_testflight.version_info version="$VERSION" build="$BUILD_NUMBER"

      - name: Generate release notes
        id: release_notes
        working-directory: ${{ github.workspace }}   # CHANGELOG.json, changelog_manager.py and final_release_notes.txt (paired with the upload step) are relative to the repo root
        run: |
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          VERSION="${{ steps.current_version.outputs.version }}"

          if [ -f "CHANGELOG.json" ]; then
            python3 ./.github/scripts/changelog_manager.py generate-md
            python3 ./.github/scripts/changelog_manager.py export --version $VERSION --output final_release_notes.txt

            if [ -s final_release_notes.txt ]; then
              echo "RELEASE_NOTES_FOUND=true" >> $GITHUB_ENV
            else
              echo "RELEASE_NOTES_FOUND=false" >> $GITHUB_ENV
              m ios_testflight.default_notes version="$VERSION" > final_release_notes.txt
            fi
          else
            echo "RELEASE_NOTES_FOUND=false" >> $GITHUB_ENV
            m ios_testflight.default_notes version="$VERSION" > final_release_notes.txt
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: final_release_notes.txt
          retention-days: 1
          if-no-files-found: error

      - name: Upload project files
        uses: actions/upload-artifact@v7
        with:
          name: project-files
          path: |
            ${{ env.FLUTTER_PROJECT_DIR }}/ios/Flutter/Secrets.xcconfig
            ${{ env.FLUTTER_PROJECT_DIR }}/pubspec.yaml
            ${{ env.FLUTTER_PROJECT_DIR }}/lib/
            ${{ env.FLUTTER_PROJECT_DIR }}/assets/
          retention-days: 1
          if-no-files-found: error

  # iOS build (uses xcodebuild directly)
  build-ios:
    name: Build iOS app
    runs-on: macos-26
    defaults:
      run:
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}
    needs: prepare-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: "{{MAIN_BRANCH}}"
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin {{MAIN_BRANCH}}

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Install iOS device platform
        env:
          # xcode-select alone does not propagate to subprocesses, so set it explicitly
          DEVELOPER_DIR: /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
        run: |
          echo "=== iPhoneOS.platform check ==="
          ls "$DEVELOPER_DIR/Platforms/iPhoneOS.platform/" 2>/dev/null && echo "iPhoneOS.platform EXISTS" || echo "iPhoneOS.platform NOT FOUND"
          echo "=== Installing MobileDevice packages ==="
          sudo installer -pkg /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Resources/Packages/MobileDevice.pkg -target /
          sudo installer -pkg /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Resources/Packages/MobileDeviceDevelopment.pkg -target /
          echo "=== Accepting Xcode license ==="
          sudo xcodebuild -license accept
          echo "=== Initializing Xcode components ==="
          xcrun simctl list >/dev/null 2>&1 || true
          echo "=== Downloading iOS platform ==="
          xcodebuild -downloadPlatform iOS

      - name: Download project files
        uses: actions/download-artifact@v8
        with:
          name: project-files
          path: ${{ env.FLUTTER_PROJECT_DIR }}

      - name: Prepare env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          if [ "$ENV_MODE" = "dotenv" ]; then
            printf '%s\n' "$ENV_CONTENT" > "$ENV_FILE_PATH"
            echo "✅ $ENV_FILE_PATH file created"
          elif [ -n "$ENV_CONTENT" ]; then
            DART_DEFINE_FILE="$RUNNER_TEMP/dart-define.env"
            printf '%s\n' "$ENV_CONTENT" > "$DART_DEFINE_FILE"
            echo "DART_DEFINE_FILE=$DART_DEFINE_FILE" >> "$GITHUB_ENV"
            echo "dart-define file prepared"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles(format('{0}/**/pubspec.lock', env.FLUTTER_PROJECT_DIR)) }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Install dependencies
        run: |
          flutter pub get
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          # A default project without plugins has no Podfile — flutter build creates one once a plugin is added
          if [ -f ios/Podfile ]; then
            gem install cocoapods
            (cd ios && pod install)
          else
            m ios_testflight.podfile_skip
          fi

      - name: Import Code-Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install Provisioning Profile
        run: |
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          uuid=$(grep -A1 -a "UUID" profile.mobileprovision | grep string | sed -e "s/<string>//" -e "s/<\/string>//" -e "s/[[:space:]]//g")
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$uuid.mobileprovision

      - name: Verify ExportOptions.plist
        run: |
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          cd ios
          if [ ! -f "ExportOptions.plist" ]; then
            exit 1
          fi
          # If the placeholders in the installer-generated template are not filled in, xcodebuild ends with a hard-to-read error
          if grep -Eq '__[A-Z][A-Z0-9_]*__' ExportOptions.plist; then
            m ios_testflight.plist_placeholders
            grep -En '__[A-Z][A-Z0-9_]*__' ExportOptions.plist
            m ios_testflight.plist_placeholders_hint
            exit 1
          fi

      - name: Flutter build (no codesign)
        env:
          # xcode-select alone does not propagate to subprocesses, so set it explicitly
          DEVELOPER_DIR: /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
        run: |
          flutter build ios --release --no-codesign \
            --build-name="${{ needs.prepare-build.outputs.version }}" \
            --build-number="${{ needs.prepare-build.outputs.build_number }}" \
            ${DART_DEFINE_FILE:+--dart-define-from-file="$DART_DEFINE_FILE"}

      - name: Create Archive
        env:
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          # xcode-select alone does not propagate to subprocesses, so set it explicitly
          DEVELOPER_DIR: /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -archivePath build/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            archive \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Export IPA
        run: |
          cd ios
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: ${{ env.FLUTTER_PROJECT_DIR }}/ios/build/ipa/*.ipa
          retention-days: 1
          if-no-files-found: error

  # TestFlight deploy (uses ios/fastlane/Fastfile)
  deploy-testflight:
    name: Deploy to TestFlight
    runs-on: macos-26
    defaults:
      run:
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}
    needs: [prepare-build, build-ios]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: "{{MAIN_BRANCH}}"
          fetch-depth: 0

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      - name: Download IPA artifact
        uses: actions/download-artifact@v8
        with:
          name: ios-ipa
          path: ${{ env.FLUTTER_PROJECT_DIR }}/ios/build/ipa/

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: .

      - name: Verify Fastfile exists
        run: |
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          if [ ! -f "ios/fastlane/Fastfile" ]; then
            m ios_testflight.fastfile_missing
            m ios_testflight.fastfile_missing_hint
            exit 1
          fi
          m ios_testflight.fastfile_ok

      - name: Install Fastlane
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}/ios
        run: |
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          # Use the repository's Gemfile as-is if it lists fastlane (committing Gemfile.lock is recommended). Otherwise generate one.
          if [ -f Gemfile ] && grep -Eq "['\"]fastlane['\"]" Gemfile; then
            m ios_testflight.gemfile_repo
          else
            # multi_json: works around an upstream bug where a google-apis transitive dependency omits it from its gemspec (Gem::LoadError)
            printf 'source "https://rubygems.org"\ngem "fastlane"\ngem "multi_json"\n' > Gemfile
          fi
          bundle install
          echo "✅ Fastlane installed (Bundler)"

      - name: Upload to TestFlight (+ App Store Submit if store_submit)
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          SKIP_WAITING_FOR_BUILD_PROCESSING: ${{ env.SKIP_WAITING_FOR_BUILD_PROCESSING }}
        run: |
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          # Find the IPA by absolute path
          IPA_PATH=$(find "$GITHUB_WORKSPACE/${FLUTTER_PROJECT_DIR}/ios/build/ipa" -name "*.ipa" | head -1)
          echo "📦 Found IPA at: $IPA_PATH"

          if [ ! -f "$IPA_PATH" ]; then
            m ios_testflight.ipa_missing; ls -la ios/build/ipa/ || true; exit 1
          fi

          # Prepare release notes (final_release_notes.txt and the truncate script are relative to the repo root — use absolute paths since working-directory is FLUTTER_PROJECT_DIR)
          if [ -f "$GITHUB_WORKSPACE/final_release_notes.txt" ]; then
            # Truncate to the App Store Connect "What to Test" limit (4000 bytes), with a margin (3800 bytes)
            python3 "$GITHUB_WORKSPACE/.github/scripts/truncate_release_notes.py" "$GITHUB_WORKSPACE/final_release_notes.txt" 3800 byte
            RELEASE_NOTES=$(cat "$GITHUB_WORKSPACE/final_release_notes.txt")
            echo "📝 Release Notes:"
            echo "$RELEASE_NOTES"
          else
            RELEASE_NOTES="$(m ios_testflight.default_notes version="${{ needs.prepare-build.outputs.version }}")"
            m ios_testflight.default_notes_echo notes="$RELEASE_NOTES"
          fi

          export APP_STORE_CONNECT_API_KEY_ID="${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}"
          export APP_STORE_CONNECT_ISSUER_ID="${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          export API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"
          export IPA_PATH="$IPA_PATH"
          export RELEASE_NOTES="$RELEASE_NOTES"
          export APP_IDENTIFIER="${{ secrets.IOS_BUNDLE_ID || vars.IOS_BUNDLE_ID }}"
          export DEPLOY_MODE="${{ env.DEPLOY_MODE }}"
          export APP_VERSION="${{ needs.prepare-build.outputs.version }}"
          export BUILD_NUMBER="${{ needs.prepare-build.outputs.build_number }}"

          echo "🔧 DEPLOY_MODE: $DEPLOY_MODE / APP_IDENTIFIER: $APP_IDENTIFIER"
          cd ios
          bundle exec fastlane deploy

      - name: Notify TestFlight Upload Success
        if: success()
        run: |
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          m ios_testflight.upload_ok
          m ios_testflight.upload_version version="${{ needs.prepare-build.outputs.version }}"
          m ios_testflight.upload_build build="${{ needs.prepare-build.outputs.build_number }}"
          m ios_testflight.upload_commit sha="${{ github.sha }}"

      - name: Notify on Failure
        if: failure()
        run: |
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          m ios_testflight.upload_failed
          m ios_testflight.check_logs
