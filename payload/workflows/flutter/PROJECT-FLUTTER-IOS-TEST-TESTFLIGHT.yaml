# project-auto-wizard:managed-workflow
# Flutter iOS test TestFlight deploy workflow
#
# Run this workflow manually from a feature branch
# to deploy a test iOS build to TestFlight.
#
# The config files (ios/fastlane/Fastfile, ios/ExportOptions.plist) are installed by
# project-auto-wizard only when missing; existing files are never overwritten.
#
# Highlights:
# - Runs manually via workflow_dispatch or is triggered by repository_dispatch
# - The version is read dynamically from version.yml (same as production; builds are told apart by build number)
# - The build number is PR number + count, or GITHUB_RUN_NUMBER
# - Extracts the issue number from the branch name automatically (YYYYMMDD_#issue-number_title format)
# - Fetches the issue through the GitHub API and includes it in the release notes
#
# Build pipeline:
#   1. flutter build ios --no-codesign (Flutter build)
#   2. xcodebuild archive (create the Xcode archive)
#   3. xcodebuild -exportArchive (create the IPA using ExportOptions.plist)
#   4. fastlane upload_testflight (uses ios/fastlane/Fastfile)
#
# Required GitHub Secrets
#
# Apple certificate & provisioning profile:
# APPLE_CERTIFICATE_BASE64: .p12 certificate (base64 encoded)
# APPLE_CERTIFICATE_PASSWORD: .p12 certificate password
# APPLE_PROVISIONING_PROFILE_BASE64: .mobileprovision file (base64 encoded)
# IOS_PROVISIONING_PROFILE_NAME: provisioning profile name
#
# App Store Connect API:
# APP_STORE_CONNECT_API_KEY_ID: API Key ID (10 characters)
# APP_STORE_CONNECT_ISSUER_ID: Issuer ID (UUID format)
# APP_STORE_CONNECT_API_KEY_BASE64: AuthKey_XXXXXX.p8 file (base64 encoded)
#
# Environment settings (optional):
# ENV_FILE (optional): contents of the .env file
# SECRETS_XCCONFIG (optional): contents of ios/Flutter/Secrets.xcconfig

name: PROJECT-Flutter-iOS-Test-TestFlight

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-ios-app]

# Declare the needed permissions explicitly so progress comments work even when the repository default is read-only
permissions:
  contents: read
  issues: write
  pull-requests: write

# Project settings (edit the values below)
env:
  # Flutter SDK version — leave empty to use the latest stable channel (matches the SDK constraint of a fresh flutter create project).
  # To pin a version, write it like "3.38.9". It must satisfy environment.sdk in pubspec.yaml.
  FLUTTER_VERSION: ""
  XCODE_VERSION: "26.0"
  PROJECT_TYPE: "flutter"
  # Flutter root path (relative to the repo root). "." for a single repo, "app" etc. for a monorepo — set automatically at install
  FLUTTER_PROJECT_DIR: "."  # @wizard auto:flutter-root
  # How env vars are passed (dart-define | dotenv) — set automatically from the value chosen at install
  ENV_MODE: "dart-define"  # @wizard auto:flutter-env-mode
  # Where to create the .env file in dotenv mode (relative to the Flutter root)
  ENV_FILE_PATH: ".env"

jobs:
  # Create the comment right away (runs quickly on ubuntu-latest)
  notify-start:
    name: Progress notification
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch'

    outputs:
      comment_id: ${{ steps.progress.outputs.comment_id }}
      start_time: ${{ steps.progress.outputs.start_time }}
      branch_valid: ${{ steps.verify_branch.outputs.valid }}

    steps:
      # Fetch the message catalog from the triggering ref first — the feature branch being built may predate it
      - name: Checkout messages
        uses: actions/checkout@v7
        with:
          path: .paw-msg
          sparse-checkout: |
            .github/scripts/messages.py
            version.yml
          sparse-checkout-cone-mode: false

      - name: Load messages
        working-directory: ${{ github.workspace }}
        run: |
          cp .paw-msg/.github/scripts/messages.py "$RUNNER_TEMP/paw_messages.py"
          LANG_CODE=$(cd .paw-msg && python3 "$RUNNER_TEMP/paw_messages.py" lang)
          rm -rf .paw-msg
          echo "PROJECT_AUTO_WIZARD_LANG=$LANG_CODE" >> "$GITHUB_ENV"
          echo "PAW_MESSAGES_PY=$RUNNER_TEMP/paw_messages.py" >> "$GITHUB_ENV"
          echo "PAW_MSG=$(PROJECT_AUTO_WIZARD_LANG=$LANG_CODE python3 "$RUNNER_TEMP/paw_messages.py" dump ios_test_tf.)" >> "$GITHUB_ENV"

      - name: Verify the branch exists up front
        id: verify_branch
        uses: actions/github-script@v9
        env:
          PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
          PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          PAW_IN_GITHUB_RUN_ID: ${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const M = JSON.parse(process.env.PAW_MSG);
            const msg = (k, p = {}) => M[k].replace(/\{(\w+)\}/g, (s, n) => (n in p ? p[n] : s));
            const branchName = process.env.PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BRANCH_NAME;
            const prNumber = process.env.PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_PR_NUMBER;
            const runId = process.env.PAW_IN_GITHUB_RUN_ID;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            console.log(msg('ios_test_tf.branch_check_log', { branch: branchName }));

            try {
              await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: branchName
              });
              console.log(msg('ios_test_tf.branch_exists_log', { branch: branchName }));
              core.setOutput('valid', 'true');
            } catch (error) {
              if (error.status === 404) {
                console.log(msg('ios_test_tf.branch_not_found_log', { branch: branchName }));

                const body = [
                  msg('ios_test_tf.branch_missing_title'),
                  '',
                  msg('ios_test_tf.kv_head'),
                  '|------|-----|',
                  msg('ios_test_tf.row_requested_branch', { branch: branchName }),
                  msg('ios_test_tf.row_issue_pr', { number: prNumber }),
                  '',
                  msg('ios_test_tf.hint_title'),
                  msg('ios_test_tf.hint_pushed'),
                  msg('ios_test_tf.hint_helper_branch'),
                  msg('ios_test_tf.hint_typo'),
                  '',
                  msg('ios_test_tf.workflow_log_link', { url: runUrl })
                ].join('\n');

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(prNumber),
                  body: body
                });

                core.setFailed(msg('ios_test_tf.branch_not_found_fail', { branch: branchName }));
              } else {
                core.setFailed(msg('ios_test_tf.branch_check_error_fail', { error: error.message }));
              }
            }

      - name: Create the progress comment
        id: progress
        if: github.event.client_payload.pr_number != ''
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
          PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BUILD_NUMBER: ${{ github.event.client_payload.build_number }}
          PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          PAW_IN_GITHUB_RUN_ID: ${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const M = JSON.parse(process.env.PAW_MSG);
            const msg = (k, p = {}) => M[k].replace(/\{(\w+)\}/g, (s, n) => (n in p ? p[n] : s));
            const row = (name, status, elapsed = '-') => `| ${msg('ios_test_tf.step_' + name)} | ${msg('ios_test_tf.st_' + status)} | ${elapsed} |`;
            const prNumber = parseInt(process.env.PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_PR_NUMBER);
            const branchName = process.env.PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BRANCH_NAME;
            const buildNumber = process.env.PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BUILD_NUMBER;
            const runId = process.env.PAW_IN_GITHUB_RUN_ID;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            const startTime = Date.now();

            const body = [
              msg('ios_test_tf.title_running'),
              '',
              msg('ios_test_tf.table_header'),
              '|------|------|----------|',
              row('prepare', 'running'),
              row('build', 'waiting'),
              row('deploy', 'waiting'),
              '',
              msg('ios_test_tf.kv_head'),
              '|------|-----|',
              msg('ios_test_tf.row_build_number', { build: buildNumber }),
              msg('ios_test_tf.row_branch', { branch: branchName }),
              '',
              msg('ios_test_tf.live_log_link', { url: runUrl }),
              '',
              '---',
              msg('ios_test_tf.auto_update_note')
            ].join('\n');

            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });

            console.log(msg('ios_test_tf.log_progress_created', { id: comment.id }));
            core.setOutput('comment_id', comment.id);
            core.setOutput('start_time', startTime);

  # Prepare the test build (macOS environment setup)
  prepare-test-build:
    name: Prepare test build
    runs-on: macos-26
    defaults:
      run:
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}
    needs: notify-start
    if: |
      always() &&
      (needs.notify-start.result == 'skipped' || needs.notify-start.outputs.branch_valid == 'true')

    outputs:
      version: ${{ steps.test_version.outputs.version }}
      build_number: ${{ steps.test_version.outputs.build_number }}
      issue_url: ${{ steps.issue_info.outputs.issue_url }}
      issue_title: ${{ steps.issue_info.outputs.issue_title }}
      issue_number: ${{ steps.issue_info.outputs.issue_number }}
      branch_name: ${{ steps.issue_info.outputs.branch_name }}
      pr_number: ${{ steps.test_version.outputs.pr_number }}
      commit_hash: ${{ steps.release_notes.outputs.commit_hash }}

    steps:
      # Fetch the message catalog from the triggering ref first — the feature branch being built may predate it
      - name: Checkout messages
        uses: actions/checkout@v7
        with:
          path: .paw-msg
          sparse-checkout: |
            .github/scripts/messages.py
            version.yml
          sparse-checkout-cone-mode: false

      - name: Load messages
        working-directory: ${{ github.workspace }}
        run: |
          cp .paw-msg/.github/scripts/messages.py "$RUNNER_TEMP/paw_messages.py"
          LANG_CODE=$(cd .paw-msg && python3 "$RUNNER_TEMP/paw_messages.py" lang)
          rm -rf .paw-msg
          echo "PROJECT_AUTO_WIZARD_LANG=$LANG_CODE" >> "$GITHUB_ENV"
          echo "PAW_MESSAGES_PY=$RUNNER_TEMP/paw_messages.py" >> "$GITHUB_ENV"
          echo "PAW_MSG=$(PROJECT_AUTO_WIZARD_LANG=$LANG_CODE python3 "$RUNNER_TEMP/paw_messages.py" dump ios_test_tf.)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref }}

      - name: Pull latest changes
        run: git pull origin ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref_name }}

      # Report every missing setting up front, before importing certificates or building — otherwise the macOS runner builds for a long time and fails at an unrelated step
      - name: Validate deploy settings
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          FAILED=0
          MISSING=""
          for name in APPLE_CERTIFICATE_BASE64 APPLE_PROVISIONING_PROFILE_BASE64 IOS_PROVISIONING_PROFILE_NAME \
                      APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            [ -n "${!name}" ] || MISSING="$MISSING $name"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::$(m ios_test_tf.secrets_missing missing="$MISSING")"
            FAILED=1
          fi
          if [ ! -f ios/ExportOptions.plist ]; then
            echo "::error::$(m ios_test_tf.export_options_missing)"
            FAILED=1
          elif grep -Eq '__[A-Z][A-Z0-9_]*__' ios/ExportOptions.plist; then
            echo "::error::$(m ios_test_tf.export_options_placeholders)"
            grep -En '__[A-Z][A-Z0-9_]*__' ios/ExportOptions.plist
            FAILED=1
          fi
          if [ ! -f ios/fastlane/Fastfile ]; then
            echo "::error::$(m ios_test_tf.fastfile_missing_error)"
            FAILED=1
          fi
          [ "$FAILED" -eq 0 ] || exit 1
          m ios_test_tf.preflight_ok

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Create Secrets.xcconfig file
        env:
          SECRETS_XCCONFIG_CONTENT: ${{ secrets.SECRETS_XCCONFIG }}
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          mkdir -p ios/Flutter
          if [ -n "$SECRETS_XCCONFIG_CONTENT" ]; then
            echo "$SECRETS_XCCONFIG_CONTENT" > ios/Flutter/Secrets.xcconfig
            m wf_flutter.secrets_xcconfig_created_ok
          else
            echo "// No secrets provided" > ios/Flutter/Secrets.xcconfig
            m wf_flutter.secrets_xcconfig_empty
          fi

      - name: Set test build version
        id: test_version
        working-directory: ${{ github.workspace }}   # version_manager.py must read version.yml at the repo root
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          # Get the version through version_manager.py (same approach as the production workflow)
          VERSION=$(python3 .github/scripts/version_manager.py get | tail -n 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # For repository_dispatch events, use the PR number as the build number
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            BUILD_NUMBER="${{ github.event.client_payload.build_number }}"
            PR_NUMBER="${{ github.event.client_payload.pr_number }}"
            m ios_test_tf.event_dispatch
            m ios_test_tf.event_pr_number pr="$PR_NUMBER"
            m ios_test_tf.event_build_number_pr build="$BUILD_NUMBER"
          else
            BUILD_NUMBER="${{ github.run_number }}"
            PR_NUMBER=""
            m ios_test_tf.event_workflow_dispatch
            m ios_test_tf.event_build_number_default build="$BUILD_NUMBER"
          fi

          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          m ios_test_tf.test_build_log version="$VERSION" build="$BUILD_NUMBER"

      - name: Extract issue info from the branch name
        id: issue_info
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          # For repository_dispatch, take the branch name from client_payload
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            BRANCH_NAME="${{ github.event.client_payload.branch_name }}"
            ISSUE_NUMBER="${{ github.event.client_payload.issue_number }}"
          else
            BRANCH_NAME="${{ github.ref_name }}"
            # Extract the issue number from the branch name (`<date>_#<number>_...` format)
            ISSUE_NUMBER=$(echo "$BRANCH_NAME" | sed -n 's/.*#\([0-9]*\).*/\1/p')
          fi

          m ios_test_tf.branch_name_log branch="$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          if [ -z "$ISSUE_NUMBER" ]; then
            m ios_test_tf.issue_number_missing
            echo "issue_url=" >> $GITHUB_OUTPUT
            echo "issue_title=" >> $GITHUB_OUTPUT
            echo "issue_number=" >> $GITHUB_OUTPUT
          else
            m ios_test_tf.issue_number_extracted number="$ISSUE_NUMBER"
            ISSUE_URL="https://github.com/${{ github.repository }}/issues/$ISSUE_NUMBER"
            echo "issue_url=$ISSUE_URL" >> $GITHUB_OUTPUT
            echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT

            # Fetch the issue info through the GitHub API
            m ios_test_tf.issue_fetching
            ISSUE_RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER")

            NO_ISSUE_INFO="$(m ios_test_tf.issue_title_default)"
            ISSUE_TITLE=$(echo "$ISSUE_RESPONSE" | jq -r --arg d "$NO_ISSUE_INFO" '.title // $d')
            ISSUE_STATE=$(echo "$ISSUE_RESPONSE" | jq -r '.state // "unknown"')

            if [ "$ISSUE_TITLE" = "null" ] || [ "$ISSUE_TITLE" = "$NO_ISSUE_INFO" ]; then
              m ios_test_tf.issue_not_found number="$ISSUE_NUMBER"
              echo "issue_title=" >> $GITHUB_OUTPUT
            else
              m ios_test_tf.issue_title_log title="$ISSUE_TITLE"
              m ios_test_tf.issue_state_log state="$ISSUE_STATE"
              echo "issue_title=$ISSUE_TITLE" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Generate release notes
        id: release_notes
        working-directory: ${{ github.workspace }}   # final_release_notes.txt (paired with the upload step) is relative to the repo root
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          BUILD_NUMBER="${{ steps.test_version.outputs.build_number }}"
          BRANCH_NAME="${{ steps.issue_info.outputs.branch_name }}"
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_SHORT=$(echo "$COMMIT_SHA" | cut -c1-7)
          BUILD_DATE=$(date '+%Y-%m-%d %H:%M:%S')

          echo "commit_hash=$COMMIT_SHORT" >> $GITHUB_OUTPUT

          {
            m ios_test_tf.notes_build build="$BUILD_NUMBER"
            echo
            m ios_test_tf.notes_branch branch="$BRANCH_NAME"
            m ios_test_tf.notes_commit commit="$COMMIT_SHORT"
            m ios_test_tf.notes_date date="$BUILD_DATE"
            echo
          } > final_release_notes.txt

          # Add the issue info when available
          if [ -n "${{ steps.issue_info.outputs.issue_number }}" ]; then
            ISSUE_NUMBER="${{ steps.issue_info.outputs.issue_number }}"
            ISSUE_TITLE="${{ steps.issue_info.outputs.issue_title }}"
            ISSUE_URL="${{ steps.issue_info.outputs.issue_url }}"

            {
              m ios_test_tf.notes_issue_header
              echo "- #$ISSUE_NUMBER: $ISSUE_TITLE"
              echo "- URL: $ISSUE_URL"
              echo
            } >> final_release_notes.txt
          fi

          m ios_test_tf.notes_generated
          echo "----------------------------------------"
          cat final_release_notes.txt
          echo "----------------------------------------"

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: final_release_notes.txt
          retention-days: 1

      - name: Upload project files
        uses: actions/upload-artifact@v7
        with:
          name: project-files
          path: |
            ${{ env.FLUTTER_PROJECT_DIR }}/ios/Flutter/Secrets.xcconfig
            ${{ env.FLUTTER_PROJECT_DIR }}/pubspec.yaml
            ${{ env.FLUTTER_PROJECT_DIR }}/lib/
            ${{ env.FLUTTER_PROJECT_DIR }}/assets/
          retention-days: 1

      - name: Progress update - prepare failed
        if: failure() && github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number != '' && needs.notify-start.outputs.comment_id != ''
        uses: actions/github-script@v9
        env:
          PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
          PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BUILD_NUMBER: ${{ github.event.client_payload.build_number }}
          PAW_IN_GITHUB_RUN_ID: ${{ github.run_id }}
          PAW_IN_NEEDS_NOTIFY_START_OUTPUTS_COMMENT_ID: ${{ needs.notify-start.outputs.comment_id }}
          PAW_IN_NEEDS_NOTIFY_START_OUTPUTS_START_TIME: ${{ needs.notify-start.outputs.start_time }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const M = JSON.parse(process.env.PAW_MSG);
            const msg = (k, p = {}) => M[k].replace(/\{(\w+)\}/g, (s, n) => (n in p ? p[n] : s));
            const row = (name, status, elapsed = '-') => `| ${msg('ios_test_tf.step_' + name)} | ${msg('ios_test_tf.st_' + status)} | ${elapsed} |`;
            const commentId = parseInt(process.env.PAW_IN_NEEDS_NOTIFY_START_OUTPUTS_COMMENT_ID);
            const startTime = parseInt(process.env.PAW_IN_NEEDS_NOTIFY_START_OUTPUTS_START_TIME);
            const branchName = process.env.PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BRANCH_NAME;
            const buildNumber = process.env.PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BUILD_NUMBER;
            const runId = process.env.PAW_IN_GITHUB_RUN_ID;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const now = Date.now();
            const elapsed = now - startTime;
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            const duration = minutes > 0 ? msg('ios_test_tf.elapsed_min_sec', { m: minutes, s: seconds }) : msg('ios_test_tf.elapsed_sec', { s: seconds });

            const body = [
              msg('ios_test_tf.title_prepare_failed'),
              '',
              msg('ios_test_tf.table_header'),
              '|------|------|----------|',
              row('prepare', 'failed', duration),
              row('build', 'canceled'),
              row('deploy', 'canceled'),
              '',
              msg('ios_test_tf.kv_head'),
              '|------|-----|',
              msg('ios_test_tf.row_build_number', { build: buildNumber }),
              msg('ios_test_tf.row_branch', { branch: branchName }),
              '',
              msg('ios_test_tf.prepare_error'),
              '',
              msg('ios_test_tf.run_log_check_link', { url: runUrl })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log(msg('ios_test_tf.log_prepare_failed'));

  # iOS build (uses xcodebuild directly)
  build-ios-test:
    name: iOS test build
    runs-on: macos-26
    defaults:
      run:
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}
    needs: [notify-start, prepare-test-build]
    if: |
      !cancelled() &&
      needs.prepare-test-build.result == 'success'

    outputs:
      step1_elapsed: ${{ steps.progress_step1.outputs.elapsed }}
      step1_end_time: ${{ steps.progress_step1.outputs.end_time }}
      step2_elapsed: ${{ steps.progress_step2.outputs.elapsed }}
      step2_end_time: ${{ steps.progress_step2.outputs.end_time }}

    steps:
      # Fetch the message catalog from the triggering ref first — the feature branch being built may predate it
      - name: Checkout messages
        uses: actions/checkout@v7
        with:
          path: .paw-msg
          sparse-checkout: |
            .github/scripts/messages.py
            version.yml
          sparse-checkout-cone-mode: false

      - name: Load messages
        working-directory: ${{ github.workspace }}
        run: |
          cp .paw-msg/.github/scripts/messages.py "$RUNNER_TEMP/paw_messages.py"
          LANG_CODE=$(cd .paw-msg && python3 "$RUNNER_TEMP/paw_messages.py" lang)
          rm -rf .paw-msg
          echo "PROJECT_AUTO_WIZARD_LANG=$LANG_CODE" >> "$GITHUB_ENV"
          echo "PAW_MESSAGES_PY=$RUNNER_TEMP/paw_messages.py" >> "$GITHUB_ENV"
          echo "PAW_MSG=$(PROJECT_AUTO_WIZARD_LANG=$LANG_CODE python3 "$RUNNER_TEMP/paw_messages.py" dump ios_test_tf.)" >> "$GITHUB_ENV"

      # Progress update - prepare done (must be updated when the build job starts so the prepare time is shown accurately)
      - name: Progress update - prepare done
        id: progress_step1
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number != '' && needs.notify-start.outputs.comment_id != ''
        uses: actions/github-script@v9
        env:
          PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
          PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BUILD_NUMBER: ${{ github.event.client_payload.build_number }}
          PAW_IN_GITHUB_RUN_ID: ${{ github.run_id }}
          PAW_IN_NEEDS_NOTIFY_START_OUTPUTS_COMMENT_ID: ${{ needs.notify-start.outputs.comment_id }}
          PAW_IN_NEEDS_NOTIFY_START_OUTPUTS_START_TIME: ${{ needs.notify-start.outputs.start_time }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_VERSION: ${{ needs.prepare-test-build.outputs.version }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const M = JSON.parse(process.env.PAW_MSG);
            const msg = (k, p = {}) => M[k].replace(/\{(\w+)\}/g, (s, n) => (n in p ? p[n] : s));
            const row = (name, status, elapsed = '-') => `| ${msg('ios_test_tf.step_' + name)} | ${msg('ios_test_tf.st_' + status)} | ${elapsed} |`;
            const commentId = parseInt(process.env.PAW_IN_NEEDS_NOTIFY_START_OUTPUTS_COMMENT_ID);
            const startTime = parseInt(process.env.PAW_IN_NEEDS_NOTIFY_START_OUTPUTS_START_TIME);
            const branchName = process.env.PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BRANCH_NAME;
            const buildNumber = process.env.PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BUILD_NUMBER;
            const version = process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_VERSION;
            const runId = process.env.PAW_IN_GITHUB_RUN_ID;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const now = Date.now();
            const elapsed = Math.round((now - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            const elapsedStr = minutes > 0 ? msg('ios_test_tf.elapsed_min_sec', { m: minutes, s: seconds }) : msg('ios_test_tf.elapsed_sec', { s: seconds });

            const body = [
              msg('ios_test_tf.title_running'),
              '',
              msg('ios_test_tf.table_header'),
              '|------|------|----------|',
              row('prepare', 'done', elapsedStr),
              row('build', 'running'),
              row('deploy', 'waiting'),
              '',
              msg('ios_test_tf.kv_head'),
              '|------|-----|',
              msg('ios_test_tf.row_app_version', { version, build: buildNumber }),
              msg('ios_test_tf.row_branch', { branch: branchName }),
              '',
              msg('ios_test_tf.live_log_link', { url: runUrl }),
              '',
              '---',
              msg('ios_test_tf.auto_update_note')
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log(msg('ios_test_tf.log_prepare_done', { elapsed: elapsedStr }));
            core.setOutput('elapsed', elapsedStr);
            core.setOutput('end_time', now.toString());

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref }}

      - name: Pull latest changes
        run: git pull origin ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref_name }}

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Install iOS device platform
        env:
          # xcode-select alone does not propagate to subprocesses, so set it explicitly
          DEVELOPER_DIR: /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          m wf_flutter.xcode_platform_check
          if ls "$DEVELOPER_DIR/Platforms/iPhoneOS.platform/" 2>/dev/null; then
            m wf_flutter.xcode_platform_exists
          else
            m wf_flutter.xcode_platform_missing
          fi
          m wf_flutter.xcode_install_pkgs
          sudo installer -pkg /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Resources/Packages/MobileDevice.pkg -target /
          sudo installer -pkg /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Resources/Packages/MobileDeviceDevelopment.pkg -target /
          m wf_flutter.xcode_license
          sudo xcodebuild -license accept
          m wf_flutter.xcode_init
          xcrun simctl list >/dev/null 2>&1 || true
          m wf_flutter.xcode_download
          xcodebuild -downloadPlatform iOS

      - name: Download project files
        uses: actions/download-artifact@v8
        with:
          name: project-files
          path: ${{ env.FLUTTER_PROJECT_DIR }}

      - name: Prepare env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          if [ "$ENV_MODE" = "dotenv" ]; then
            printf '%s\n' "$ENV_CONTENT" > "$ENV_FILE_PATH"
            m wf_flutter.env_file_created file="$ENV_FILE_PATH"
          elif [ -n "$ENV_CONTENT" ]; then
            DART_DEFINE_FILE="$RUNNER_TEMP/dart-define.env"
            printf '%s\n' "$ENV_CONTENT" > "$DART_DEFINE_FILE"
            echo "DART_DEFINE_FILE=$DART_DEFINE_FILE" >> "$GITHUB_ENV"
            m wf_flutter.dart_define_prepared
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles(format('{0}/**/pubspec.lock', env.FLUTTER_PROJECT_DIR)) }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Install dependencies
        run: |
          flutter pub get
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          # A default project without plugins has no Podfile — flutter build creates one once a plugin is added
          if [ -f ios/Podfile ]; then
            gem install cocoapods
            (cd ios && pod install)
          else
            m ios_test_tf.podfile_skip
          fi

      - name: Import Code-Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          uuid=$(grep -A1 -a "UUID" profile.mobileprovision | grep string | sed -e "s/<string>//" -e "s/<\/string>//" -e "s/[[:space:]]//g")
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$uuid.mobileprovision

      - name: Verify ExportOptions.plist
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          cd ios
          if [ ! -f "ExportOptions.plist" ]; then
            m ios_test_tf.plist_missing
            m ios_test_tf.plist_missing_hint
            exit 1
          fi
          m ios_test_tf.plist_ok

      - name: Flutter build (no codesign)
        env:
          # xcode-select alone does not propagate to subprocesses, so set it explicitly
          DEVELOPER_DIR: /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
        run: |
          flutter build ios --release --no-codesign \
            --build-name="${{ needs.prepare-test-build.outputs.version }}" \
            --build-number="${{ needs.prepare-test-build.outputs.build_number }}" \
            ${DART_DEFINE_FILE:+--dart-define-from-file="$DART_DEFINE_FILE"}

      - name: Create Archive
        env:
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          # xcode-select alone does not propagate to subprocesses, so set it explicitly
          DEVELOPER_DIR: /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -archivePath build/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            archive \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Export IPA
        run: |
          cd ios
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: Create build metadata file
        run: |
          cat > build-metadata.json << EOF
          {
            "pr_number": "${{ needs.prepare-test-build.outputs.pr_number }}",
            "build_number": "${{ needs.prepare-test-build.outputs.build_number }}",
            "issue_number": "${{ needs.prepare-test-build.outputs.issue_number }}",
            "branch_name": "${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref_name }}"
          }
          EOF
          cat build-metadata.json

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: |
            ${{ env.FLUTTER_PROJECT_DIR }}/ios/build/ipa/*.ipa
            ${{ env.FLUTTER_PROJECT_DIR }}/build-metadata.json
          retention-days: 1

      - name: Progress update - IPA build done
        id: progress_step2
        if: success() && github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number != '' && needs.notify-start.outputs.comment_id != ''
        uses: actions/github-script@v9
        env:
          PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
          PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BUILD_NUMBER: ${{ github.event.client_payload.build_number }}
          PAW_IN_GITHUB_RUN_ID: ${{ github.run_id }}
          PAW_IN_NEEDS_NOTIFY_START_OUTPUTS_COMMENT_ID: ${{ needs.notify-start.outputs.comment_id }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_VERSION: ${{ needs.prepare-test-build.outputs.version }}
          PAW_IN_STEPS_PROGRESS_STEP1_OUTPUTS_ELAPSED: ${{ steps.progress_step1.outputs.elapsed }}
          PAW_IN_STEPS_PROGRESS_STEP1_OUTPUTS_END_TIME: ${{ steps.progress_step1.outputs.end_time }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const M = JSON.parse(process.env.PAW_MSG);
            const msg = (k, p = {}) => M[k].replace(/\{(\w+)\}/g, (s, n) => (n in p ? p[n] : s));
            const row = (name, status, elapsed = '-') => `| ${msg('ios_test_tf.step_' + name)} | ${msg('ios_test_tf.st_' + status)} | ${elapsed} |`;
            const commentId = parseInt(process.env.PAW_IN_NEEDS_NOTIFY_START_OUTPUTS_COMMENT_ID);
            const step1EndTime = parseInt(process.env.PAW_IN_STEPS_PROGRESS_STEP1_OUTPUTS_END_TIME);
            const step1Elapsed = process.env.PAW_IN_STEPS_PROGRESS_STEP1_OUTPUTS_ELAPSED;
            const branchName = process.env.PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BRANCH_NAME;
            const buildNumber = process.env.PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BUILD_NUMBER;
            const version = process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_VERSION;
            const runId = process.env.PAW_IN_GITHUB_RUN_ID;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const now = Date.now();

            // Build step duration (step1 end to now)
            const elapsed = Math.round((now - step1EndTime) / 1000);
            const buildMin = Math.floor(elapsed / 60);
            const buildSec = elapsed % 60;
            const elapsedStr = buildMin > 0 ? msg('ios_test_tf.elapsed_min_sec', { m: buildMin, s: buildSec }) : msg('ios_test_tf.elapsed_sec', { s: buildSec });

            const body = [
              msg('ios_test_tf.title_ipa_done'),
              '',
              msg('ios_test_tf.table_header'),
              '|------|------|----------|',
              row('prepare', 'done', step1Elapsed || '-'),
              row('build', 'done', elapsedStr),
              row('deploy', 'running'),
              '',
              msg('ios_test_tf.kv_head'),
              '|------|-----|',
              msg('ios_test_tf.row_app_version', { version, build: buildNumber }),
              msg('ios_test_tf.row_branch', { branch: branchName }),
              '',
              msg('ios_test_tf.live_log_link', { url: runUrl }),
              '',
              '---',
              msg('ios_test_tf.auto_update_note')
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log(msg('ios_test_tf.log_ipa_done', { elapsed: elapsedStr }));
            core.setOutput('elapsed', elapsedStr);
            core.setOutput('end_time', now.toString());

      - name: Update the progress comment on build failure
        if: failure() && github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number != '' && needs.notify-start.outputs.comment_id != ''
        uses: actions/github-script@v9
        env:
          PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
          PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BUILD_NUMBER: ${{ github.event.client_payload.build_number }}
          PAW_IN_GITHUB_RUN_ID: ${{ github.run_id }}
          PAW_IN_NEEDS_NOTIFY_START_OUTPUTS_COMMENT_ID: ${{ needs.notify-start.outputs.comment_id }}
          PAW_IN_NEEDS_NOTIFY_START_OUTPUTS_START_TIME: ${{ needs.notify-start.outputs.start_time }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_COMMIT_HASH: ${{ needs.prepare-test-build.outputs.commit_hash }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_VERSION: ${{ needs.prepare-test-build.outputs.version }}
          PAW_IN_STEPS_PROGRESS_STEP1_OUTPUTS_ELAPSED: ${{ steps.progress_step1.outputs.elapsed }}
          PAW_IN_STEPS_PROGRESS_STEP1_OUTPUTS_END_TIME: ${{ steps.progress_step1.outputs.end_time }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const M = JSON.parse(process.env.PAW_MSG);
            const msg = (k, p = {}) => M[k].replace(/\{(\w+)\}/g, (s, n) => (n in p ? p[n] : s));
            const row = (name, status, elapsed = '-') => `| ${msg('ios_test_tf.step_' + name)} | ${msg('ios_test_tf.st_' + status)} | ${elapsed} |`;
            const commentId = parseInt(process.env.PAW_IN_NEEDS_NOTIFY_START_OUTPUTS_COMMENT_ID);
            const startTime = parseInt(process.env.PAW_IN_NEEDS_NOTIFY_START_OUTPUTS_START_TIME);
            const step1EndTime = parseInt(process.env.PAW_IN_STEPS_PROGRESS_STEP1_OUTPUTS_END_TIME) || 0;
            const step1Elapsed = process.env.PAW_IN_STEPS_PROGRESS_STEP1_OUTPUTS_ELAPSED;
            const branchName = process.env.PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BRANCH_NAME;
            const buildNumber = process.env.PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BUILD_NUMBER;
            const version = process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_VERSION;
            const commitHash = process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_COMMIT_HASH;
            const runId = process.env.PAW_IN_GITHUB_RUN_ID;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const now = Date.now();

            // Build step duration (step1 end to now)
            let step2ElapsedStr = '-';
            if (step1EndTime > 0) {
              const step2_s = Math.round((now - step1EndTime) / 1000);
              const s2Min = Math.floor(step2_s / 60);
              const s2Sec = step2_s % 60;
              step2ElapsedStr = s2Min > 0 ? msg('ios_test_tf.elapsed_min_sec', { m: s2Min, s: s2Sec }) : msg('ios_test_tf.elapsed_sec', { s: s2Sec });
            }

            const body = [
              msg('ios_test_tf.title_ipa_failed'),
              '',
              msg('ios_test_tf.table_header'),
              '|------|------|----------|',
              row('prepare', 'done', step1Elapsed || '-'),
              row('build', 'failed', step2ElapsedStr),
              row('deploy', 'canceled'),
              '',
              msg('ios_test_tf.kv_head'),
              '|------|-----|',
              msg('ios_test_tf.row_app_version', { version, build: buildNumber }),
              msg('ios_test_tf.row_branch', { branch: branchName }),
              msg('ios_test_tf.row_commit', { commit: commitHash }),
              '',
              msg('ios_test_tf.ipa_error'),
              '',
              msg('ios_test_tf.run_log_check_link', { url: runUrl })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log(msg('ios_test_tf.log_ipa_failed'));

  # TestFlight deploy (uses ios/fastlane/Fastfile)
  deploy-testflight-test:
    name: TestFlight test deploy
    runs-on: macos-26
    defaults:
      run:
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}
    needs: [notify-start, prepare-test-build, build-ios-test]
    if: |
      !cancelled() &&
      needs.build-ios-test.result == 'success'

    steps:
      # Fetch the message catalog from the triggering ref first — the feature branch being built may predate it
      - name: Checkout messages
        uses: actions/checkout@v7
        with:
          path: .paw-msg
          sparse-checkout: |
            .github/scripts/messages.py
            version.yml
          sparse-checkout-cone-mode: false

      - name: Load messages
        working-directory: ${{ github.workspace }}
        run: |
          cp .paw-msg/.github/scripts/messages.py "$RUNNER_TEMP/paw_messages.py"
          LANG_CODE=$(cd .paw-msg && python3 "$RUNNER_TEMP/paw_messages.py" lang)
          rm -rf .paw-msg
          echo "PROJECT_AUTO_WIZARD_LANG=$LANG_CODE" >> "$GITHUB_ENV"
          echo "PAW_MESSAGES_PY=$RUNNER_TEMP/paw_messages.py" >> "$GITHUB_ENV"
          echo "PAW_MSG=$(PROJECT_AUTO_WIZARD_LANG=$LANG_CODE python3 "$RUNNER_TEMP/paw_messages.py" dump ios_test_tf.)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref }}

      - name: Setup App Store Connect API Key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

      - name: Download IPA artifact
        uses: actions/download-artifact@v8
        with:
          name: ios-ipa
          path: ${{ env.FLUTTER_PROJECT_DIR }}/ios/build/ipa/

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: .

      - name: Verify Fastfile exists
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          if [ ! -f "ios/fastlane/Fastfile" ]; then
            m ios_test_tf.fastfile_missing
            m ios_test_tf.fastfile_missing_hint
            exit 1
          fi
          m ios_test_tf.fastfile_ok

      - name: Install Fastlane
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}/ios
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          # Use the repository's Gemfile as-is if it lists fastlane (committing Gemfile.lock is recommended). Otherwise generate one.
          if [ -f Gemfile ] && grep -Eq "['\"]fastlane['\"]" Gemfile; then
            m ios_test_tf.gemfile_repo
          else
            # multi_json: works around an upstream bug where a google-apis transitive dependency omits it from its gemspec (Gem::LoadError)
            printf 'source "https://rubygems.org"\ngem "fastlane"\ngem "multi_json"\n' > Gemfile
          fi
          bundle install
          m flutter_a.fastlane_installed_bundler

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          # Find the IPA file
          IPA_PATH=$(find "$GITHUB_WORKSPACE/${FLUTTER_PROJECT_DIR}/ios/build/ipa" -name "*.ipa" | head -1)
          m wf_flutter.ipa_found path="$IPA_PATH"

          if [ ! -f "$IPA_PATH" ]; then
            m ios_test_tf.ipa_missing
            ls -la ios/build/ipa/
            exit 1
          fi

          # Prepare release notes (final_release_notes.txt is relative to the repo root — use an absolute path since working-directory is FLUTTER_PROJECT_DIR)
          if [ -f "$GITHUB_WORKSPACE/final_release_notes.txt" ]; then
            RELEASE_NOTES=$(cat "$GITHUB_WORKSPACE/final_release_notes.txt")
            m wf_flutter.release_notes_heading
            echo "$RELEASE_NOTES"
          else
            RELEASE_NOTES="$(m ios_test_tf.notes_build build="${{ needs.prepare-test-build.outputs.build_number }}")"
            m ios_test_tf.default_notes_echo notes="$RELEASE_NOTES"
          fi

          # Set the environment variables (used by the Fastfile)
          export API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          export IPA_PATH="$IPA_PATH"
          export RELEASE_NOTES="$RELEASE_NOTES"

          m wf_flutter.working_dir dir="$(pwd)"
          echo "🔧 IPA_PATH: $IPA_PATH"
          echo "🔧 API_KEY_PATH: $API_KEY_PATH"

          # Run Fastlane (uses ios/fastlane/Fastfile)
          cd ios
          bundle exec fastlane upload_testflight

      - name: Notify TestFlight Upload Success
        if: success()
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          m ios_test_tf.upload_ok
          m ios_test_tf.upload_version version="${{ needs.prepare-test-build.outputs.version }}"
          m ios_test_tf.upload_build build="${{ needs.prepare-test-build.outputs.build_number }}"
          if [ -n "${{ needs.prepare-test-build.outputs.pr_number }}" ]; then
            m ios_test_tf.upload_pr pr="${{ needs.prepare-test-build.outputs.pr_number }}"
          fi
          m ios_test_tf.upload_branch branch="${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref_name }}"
          m ios_test_tf.upload_commit sha="${{ github.sha }}"
          if [ -n "${{ needs.prepare-test-build.outputs.issue_url }}" ]; then
            m ios_test_tf.upload_issue url="${{ needs.prepare-test-build.outputs.issue_url }}"
          fi

      - name: Notify on Failure
        if: failure()
        run: |
          m() { python3 "$PAW_MESSAGES_PY" get "$@"; }
          m ios_test_tf.upload_failed
          m ios_test_tf.check_logs

      - name: Final progress update - success
        if: success() && github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number != '' && needs.notify-start.outputs.comment_id != ''
        uses: actions/github-script@v9
        env:
          PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
          PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BUILD_NUMBER: ${{ github.event.client_payload.build_number }}
          PAW_IN_GITHUB_RUN_ID: ${{ github.run_id }}
          PAW_IN_NEEDS_BUILD_IOS_TEST_OUTPUTS_STEP1_ELAPSED: ${{ needs.build-ios-test.outputs.step1_elapsed }}
          PAW_IN_NEEDS_BUILD_IOS_TEST_OUTPUTS_STEP2_ELAPSED: ${{ needs.build-ios-test.outputs.step2_elapsed }}
          PAW_IN_NEEDS_BUILD_IOS_TEST_OUTPUTS_STEP2_END_TIME: ${{ needs.build-ios-test.outputs.step2_end_time }}
          PAW_IN_NEEDS_NOTIFY_START_OUTPUTS_COMMENT_ID: ${{ needs.notify-start.outputs.comment_id }}
          PAW_IN_NEEDS_NOTIFY_START_OUTPUTS_START_TIME: ${{ needs.notify-start.outputs.start_time }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_COMMIT_HASH: ${{ needs.prepare-test-build.outputs.commit_hash }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_VERSION: ${{ needs.prepare-test-build.outputs.version }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const M = JSON.parse(process.env.PAW_MSG);
            const msg = (k, p = {}) => M[k].replace(/\{(\w+)\}/g, (s, n) => (n in p ? p[n] : s));
            const row = (name, status, elapsed = '-') => `| ${msg('ios_test_tf.step_' + name)} | ${msg('ios_test_tf.st_' + status)} | ${elapsed} |`;
            const commentId = parseInt(process.env.PAW_IN_NEEDS_NOTIFY_START_OUTPUTS_COMMENT_ID);
            const startTime = parseInt(process.env.PAW_IN_NEEDS_NOTIFY_START_OUTPUTS_START_TIME);
            const step2EndTime = parseInt(process.env.PAW_IN_NEEDS_BUILD_IOS_TEST_OUTPUTS_STEP2_END_TIME);
            const step1Elapsed = process.env.PAW_IN_NEEDS_BUILD_IOS_TEST_OUTPUTS_STEP1_ELAPSED;
            const step2Elapsed = process.env.PAW_IN_NEEDS_BUILD_IOS_TEST_OUTPUTS_STEP2_ELAPSED;
            const branchName = process.env.PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BRANCH_NAME;
            const buildNumber = process.env.PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BUILD_NUMBER;
            const version = process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_VERSION;
            const commitHash = process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_COMMIT_HASH;
            const runId = process.env.PAW_IN_GITHUB_RUN_ID;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const now = Date.now();

            // Deploy step duration (step2 end to now)
            const step3_s = Math.round((now - step2EndTime) / 1000);
            const s3Min = Math.floor(step3_s / 60);
            const s3Sec = step3_s % 60;
            const step3Elapsed = s3Min > 0 ? msg('ios_test_tf.elapsed_min_sec', { m: s3Min, s: s3Sec }) : msg('ios_test_tf.elapsed_sec', { s: s3Sec });

            // Total duration
            const total_s = Math.round((now - startTime) / 1000);
            const tMin = Math.floor(total_s / 60);
            const tSec = total_s % 60;
            const totalElapsed = tMin > 0 ? msg('ios_test_tf.elapsed_min_sec', { m: tMin, s: tSec }) : msg('ios_test_tf.elapsed_sec', { s: tSec });

            const body = [
              msg('ios_test_tf.title_deploy_done'),
              '',
              msg('ios_test_tf.table_header'),
              '|------|------|----------|',
              row('prepare', 'done', step1Elapsed || '-'),
              row('build', 'done', step2Elapsed || '-'),
              row('deploy', 'done', step3Elapsed),
              '',
              msg('ios_test_tf.kv_head'),
              '|------|-----|',
              msg('ios_test_tf.row_app_version', { version, build: buildNumber }),
              msg('ios_test_tf.row_branch', { branch: branchName }),
              msg('ios_test_tf.row_commit', { commit: commitHash }),
              msg('ios_test_tf.row_total', { elapsed: totalElapsed }),
              '',
              msg('ios_test_tf.download_hint'),
              '',
              msg('ios_test_tf.run_log_link', { url: runUrl })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log(msg('ios_test_tf.log_all_done', { elapsed: totalElapsed }));

      - name: Final progress update - failure
        if: failure() && github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number != '' && needs.notify-start.outputs.comment_id != ''
        uses: actions/github-script@v9
        env:
          PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
          PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BUILD_NUMBER: ${{ github.event.client_payload.build_number }}
          PAW_IN_GITHUB_RUN_ID: ${{ github.run_id }}
          PAW_IN_NEEDS_BUILD_IOS_TEST_OUTPUTS_STEP1_ELAPSED: ${{ needs.build-ios-test.outputs.step1_elapsed }}
          PAW_IN_NEEDS_BUILD_IOS_TEST_OUTPUTS_STEP2_ELAPSED: ${{ needs.build-ios-test.outputs.step2_elapsed }}
          PAW_IN_NEEDS_BUILD_IOS_TEST_OUTPUTS_STEP2_END_TIME: ${{ needs.build-ios-test.outputs.step2_end_time }}
          PAW_IN_NEEDS_NOTIFY_START_OUTPUTS_COMMENT_ID: ${{ needs.notify-start.outputs.comment_id }}
          PAW_IN_NEEDS_NOTIFY_START_OUTPUTS_START_TIME: ${{ needs.notify-start.outputs.start_time }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_COMMIT_HASH: ${{ needs.prepare-test-build.outputs.commit_hash }}
          PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_VERSION: ${{ needs.prepare-test-build.outputs.version }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const M = JSON.parse(process.env.PAW_MSG);
            const msg = (k, p = {}) => M[k].replace(/\{(\w+)\}/g, (s, n) => (n in p ? p[n] : s));
            const row = (name, status, elapsed = '-') => `| ${msg('ios_test_tf.step_' + name)} | ${msg('ios_test_tf.st_' + status)} | ${elapsed} |`;
            const commentId = parseInt(process.env.PAW_IN_NEEDS_NOTIFY_START_OUTPUTS_COMMENT_ID);
            const startTime = parseInt(process.env.PAW_IN_NEEDS_NOTIFY_START_OUTPUTS_START_TIME);
            const step2EndTime = parseInt(process.env.PAW_IN_NEEDS_BUILD_IOS_TEST_OUTPUTS_STEP2_END_TIME) || 0;
            const step1Elapsed = process.env.PAW_IN_NEEDS_BUILD_IOS_TEST_OUTPUTS_STEP1_ELAPSED;
            const step2Elapsed = process.env.PAW_IN_NEEDS_BUILD_IOS_TEST_OUTPUTS_STEP2_ELAPSED;
            const branchName = process.env.PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BRANCH_NAME;
            const buildNumber = process.env.PAW_IN_GITHUB_EVENT_CLIENT_PAYLOAD_BUILD_NUMBER;
            const version = process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_VERSION;
            const commitHash = process.env.PAW_IN_NEEDS_PREPARE_TEST_BUILD_OUTPUTS_COMMIT_HASH;
            const runId = process.env.PAW_IN_GITHUB_RUN_ID;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const now = Date.now();

            // Deploy step duration (step2 end to now)
            let step3Elapsed = '-';
            if (step2EndTime > 0) {
              const step3_s = Math.round((now - step2EndTime) / 1000);
              const s3Min = Math.floor(step3_s / 60);
              const s3Sec = step3_s % 60;
              step3Elapsed = s3Min > 0 ? msg('ios_test_tf.elapsed_min_sec', { m: s3Min, s: s3Sec }) : msg('ios_test_tf.elapsed_sec', { s: s3Sec });
            }

            const body = [
              msg('ios_test_tf.title_deploy_failed'),
              '',
              msg('ios_test_tf.table_header'),
              '|------|------|----------|',
              row('prepare', 'done', step1Elapsed || '-'),
              row('build', 'done', step2Elapsed || '-'),
              row('deploy', 'failed', step3Elapsed),
              '',
              msg('ios_test_tf.kv_head'),
              '|------|-----|',
              msg('ios_test_tf.row_app_version', { version, build: buildNumber }),
              msg('ios_test_tf.row_branch', { branch: branchName }),
              msg('ios_test_tf.row_commit', { commit: commitHash }),
              '',
              msg('ios_test_tf.deploy_error'),
              '',
              msg('ios_test_tf.run_log_check_link', { url: runUrl })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log(msg('ios_test_tf.log_deploy_failed'));
