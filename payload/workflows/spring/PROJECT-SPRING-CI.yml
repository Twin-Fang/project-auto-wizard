# project-auto-wizard:managed-workflow
# Spring CI workflow

name: PROJECT-SPRING-CI

on:
  pull_request:
    branches: ["{{DEVELOP_BRANCH}}"]
    types: [opened, synchronize, reopened]
  push:
    branches: ["{{DEVELOP_BRANCH}}"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

env:
  JAVA_VERSION: "__JAVA_VERSION__"  # @wizard ask:@jdk
  # Subdirectory of this project in a monorepo ('.' = always verify)
  PROJECT_PATH: "."  # @wizard auto:project-path

jobs:
  # Change detection (decides whether this project's path changed in a monorepo)
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      project: ${{ steps.filter.outputs.project }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect project path changes
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          # A push only looks at this push's range (against the previous commit, 'before'). Left empty it would diff cumulatively against the default branch.
          # The first push of a new branch (before is 0) and PRs use an empty value -> default behavior (against the default branch / PR base)
          base: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
          filters: |
            project:
              - '${{ env.PROJECT_PATH == '.' && '**' || format('{0}/**', env.PROJECT_PATH) }}'

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.project == 'true' }}
    # In a monorepo (--paths) build inside that subfolder
    defaults:
      run:
        working-directory: ${{ env.PROJECT_PATH }}
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Load messages
      id: load_messages
      run: |
        [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
        echo "PAW_MSG=$(python3 "$GITHUB_WORKSPACE/.github/scripts/messages.py" dump wf_spring_ci.)" >> "$GITHUB_ENV"

    - name: Setup JDK
      uses: actions/setup-java@v5
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v5
      continue-on-error: true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: wrapper

    - name: Clean Build Directory
      run: ./gradlew clean

    - name: Compile Sources
      id: compile
      run: |
        set +e
        ./gradlew compileJava compileTestJava 2>&1 | tee compile_output.txt
        # $? is tee's exit code, so read gradle's result from PIPESTATUS
        echo "compile_exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        set -e
      continue-on-error: true

    - name: Run Tests
      id: test
      run: |
        set +e
        ./gradlew test 2>&1 | tee test_output.txt
        # $? is tee's exit code, so read gradle's result from PIPESTATUS
        echo "test_exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        set -e
      continue-on-error: true

    - name: Build JAR
      id: build
      run: |
        set +e
        ./gradlew build -x test 2>&1 | tee build_output.txt
        # $? is tee's exit code, so read gradle's result from PIPESTATUS
        echo "build_exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        set -e
      continue-on-error: true

    - name: Generate Build Report
      id: report
      if: always() && steps.load_messages.outcome == 'success'
      run: |
        [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
        m() { python3 "$GITHUB_WORKSPACE/.github/scripts/messages.py" get "$@"; }
        STATUS_OK="$(m wf_spring_ci.status_ok)"
        STATUS_FAIL="$(m wf_spring_ci.status_fail)"
        STATUS_NOT_RUN="$(m wf_spring_ci.status_not_run)"
        COMPILE_STATUS="$STATUS_OK"
        TEST_STATUS="$STATUS_OK"
        BUILD_STATUS="$STATUS_OK"
        
        COMPILE_EXIT_CODE="${{ steps.compile.outputs.compile_exit_code }}"
        TEST_EXIT_CODE="${{ steps.test.outputs.test_exit_code }}"
        BUILD_EXIT_CODE="${{ steps.build.outputs.build_exit_code }}"

        # An empty exit code means the step never ran; a failed compile means gradle never got to run the tests
        # or package the jar, so their non-zero exit codes are not failures of those steps themselves
        if [ -z "$COMPILE_EXIT_CODE" ]; then
          COMPILE_STATUS="$STATUS_NOT_RUN"
        elif [ "$COMPILE_EXIT_CODE" != "0" ]; then
          COMPILE_STATUS="$STATUS_FAIL"
        fi

        if [ -z "$TEST_EXIT_CODE" ] || { [ -n "$COMPILE_EXIT_CODE" ] && [ "$COMPILE_EXIT_CODE" != "0" ]; }; then
          TEST_STATUS="$STATUS_NOT_RUN"
        elif [ "$TEST_EXIT_CODE" != "0" ]; then
          TEST_STATUS="$STATUS_FAIL"
        fi

        if [ -z "$BUILD_EXIT_CODE" ] || { [ -n "$COMPILE_EXIT_CODE" ] && [ "$COMPILE_EXIT_CODE" != "0" ]; }; then
          BUILD_STATUS="$STATUS_NOT_RUN"
        elif [ "$BUILD_EXIT_CODE" != "0" ]; then
          BUILD_STATUS="$STATUS_FAIL"
        fi
        
        OVERALL_STATUS="$STATUS_OK"
        OVERALL_OK=true
        if [ "$COMPILE_EXIT_CODE" != "0" ] || [ "$TEST_EXIT_CODE" != "0" ] || [ "$BUILD_EXIT_CODE" != "0" ]; then
          OVERALL_STATUS="$STATUS_FAIL"
          OVERALL_OK=false
        fi
        
        echo "compile_status=$COMPILE_STATUS" >> $GITHUB_OUTPUT
        echo "test_status=$TEST_STATUS" >> $GITHUB_OUTPUT
        echo "build_status=$BUILD_STATUS" >> $GITHUB_OUTPUT
        echo "overall_status=$OVERALL_STATUS" >> $GITHUB_OUTPUT
        # Language-neutral flag for the step conditions below
        echo "overall_ok=$OVERALL_OK" >> $GITHUB_OUTPUT

    - name: Extract Error Details
      id: errors
      if: always() && steps.load_messages.outcome == 'success'
      run: |
        [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
        m() { python3 "$GITHUB_WORKSPACE/.github/scripts/messages.py" get "$@"; }
        if [ -f compile_output.txt ] && [ "${{ steps.compile.outputs.compile_exit_code }}" != "0" ]; then
          echo "compile_errors<<EOF" >> $GITHUB_OUTPUT
          m wf_spring_ci.err_compile_header >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo '```' >> $GITHUB_OUTPUT
          grep -A 15 -B 15 "error\|Error\|ERROR\|FAILED\|Failed\|failed" compile_output.txt | head -60 >> $GITHUB_OUTPUT || m wf_spring_ci.err_compile_missing >> $GITHUB_OUTPUT
          echo '```' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        fi
        
        if [ -f test_output.txt ] && [ "${{ steps.test.outputs.test_exit_code }}" != "0" ] && [ "${{ steps.compile.outputs.compile_exit_code }}" = "0" ]; then
          echo "test_errors<<EOF" >> $GITHUB_OUTPUT
          m wf_spring_ci.err_test_header >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo '```' >> $GITHUB_OUTPUT
          grep -A 15 -B 15 "FAILED\|Failed\|failed\|error\|Error\|ERROR" test_output.txt | head -60 >> $GITHUB_OUTPUT || m wf_spring_ci.err_test_missing >> $GITHUB_OUTPUT
          echo '```' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        fi
        
        if [ -f build_output.txt ] && [ "${{ steps.build.outputs.build_exit_code }}" != "0" ] && [ "${{ steps.compile.outputs.compile_exit_code }}" = "0" ]; then
          echo "build_errors<<EOF" >> $GITHUB_OUTPUT
          m wf_spring_ci.err_build_header >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo '```' >> $GITHUB_OUTPUT
          grep -A 15 -B 15 "FAILED\|Failed\|failed\|error\|Error\|ERROR" build_output.txt | head -60 >> $GITHUB_OUTPUT || m wf_spring_ci.err_build_missing >> $GITHUB_OUTPUT
          echo '```' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        fi

    - name: Comment on PR (Success)
      if: github.event_name == 'pull_request' && steps.report.outputs.overall_ok == 'true'
      uses: actions/github-script@v9
      env:
        PAW_IN_STEPS_REPORT_OUTPUTS_BUILD_STATUS: ${{ steps.report.outputs.build_status }}
        PAW_IN_STEPS_REPORT_OUTPUTS_COMPILE_STATUS: ${{ steps.report.outputs.compile_status }}
        PAW_IN_STEPS_REPORT_OUTPUTS_OVERALL_STATUS: ${{ steps.report.outputs.overall_status }}
        PAW_IN_STEPS_REPORT_OUTPUTS_TEST_STATUS: ${{ steps.report.outputs.test_status }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const M = JSON.parse(process.env.PAW_MSG);
          const m = (k, p = {}) => M['wf_spring_ci.' + k].replace(/\{(\w+)\}/g, (s, n) => (n in p ? p[n] : s));
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          // Find the existing bot comment
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && 
            comment.body.includes('🔧 CI Build Check')
          );
          
          const successMessage = [
            m('comment_title'),
            '',
            m('comment_success'),
            '',
            m('table_header'),
            '|------|------|',
            m('row_compile', { status: process.env.PAW_IN_STEPS_REPORT_OUTPUTS_COMPILE_STATUS }),
            m('row_test', { status: process.env.PAW_IN_STEPS_REPORT_OUTPUTS_TEST_STATUS }),
            m('row_build', { status: process.env.PAW_IN_STEPS_REPORT_OUTPUTS_BUILD_STATUS }),
            '',
            m('overall', { status: process.env.PAW_IN_STEPS_REPORT_OUTPUTS_OVERALL_STATUS }),
            '',
            '---',
            m('footer', { time: new Date().toISOString().slice(0, 19).replace('T', ' ') + ' UTC' }),
          ].join('\n');
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: successMessage
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: successMessage
            });
          }

    - name: Comment on PR (Failure)
      if: github.event_name == 'pull_request' && steps.report.outputs.overall_ok == 'false'
      uses: actions/github-script@v9
      # Pass multi-line error logs via env; inlining them into a JS string literal breaks the script
      env:
        PAW_IN_STEPS_ERRORS_OUTPUTS_BUILD_ERRORS: ${{ steps.errors.outputs.build_errors }}
        PAW_IN_STEPS_ERRORS_OUTPUTS_COMPILE_ERRORS: ${{ steps.errors.outputs.compile_errors }}
        PAW_IN_STEPS_ERRORS_OUTPUTS_TEST_ERRORS: ${{ steps.errors.outputs.test_errors }}
        PAW_IN_STEPS_REPORT_OUTPUTS_BUILD_STATUS: ${{ steps.report.outputs.build_status }}
        PAW_IN_STEPS_REPORT_OUTPUTS_COMPILE_STATUS: ${{ steps.report.outputs.compile_status }}
        PAW_IN_STEPS_REPORT_OUTPUTS_OVERALL_STATUS: ${{ steps.report.outputs.overall_status }}
        PAW_IN_STEPS_REPORT_OUTPUTS_TEST_STATUS: ${{ steps.report.outputs.test_status }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const M = JSON.parse(process.env.PAW_MSG);
          const m = (k, p = {}) => M['wf_spring_ci.' + k].replace(/\{(\w+)\}/g, (s, n) => (n in p ? p[n] : s));
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          // Find the existing bot comment
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && 
            comment.body.includes('🔧 CI Build Check')
          );
          
          let errorDetails = '';
          
          // Append compile errors
          if (process.env.PAW_IN_STEPS_ERRORS_OUTPUTS_COMPILE_ERRORS) {
            errorDetails += process.env.PAW_IN_STEPS_ERRORS_OUTPUTS_COMPILE_ERRORS + '\n\n';
          }
          
          // Append test errors
          if (process.env.PAW_IN_STEPS_ERRORS_OUTPUTS_TEST_ERRORS) {
            errorDetails += process.env.PAW_IN_STEPS_ERRORS_OUTPUTS_TEST_ERRORS + '\n\n';
          }
          
          // Append build errors
          if (process.env.PAW_IN_STEPS_ERRORS_OUTPUTS_BUILD_ERRORS) {
            errorDetails += process.env.PAW_IN_STEPS_ERRORS_OUTPUTS_BUILD_ERRORS + '\n\n';
          }
          
          const failureMessage = [
            m('comment_title'),
            '',
            m('comment_failure'),
            '',
            m('table_header'),
            '|------|------|',
            m('row_compile', { status: process.env.PAW_IN_STEPS_REPORT_OUTPUTS_COMPILE_STATUS }),
            m('row_test', { status: process.env.PAW_IN_STEPS_REPORT_OUTPUTS_TEST_STATUS }),
            m('row_build', { status: process.env.PAW_IN_STEPS_REPORT_OUTPUTS_BUILD_STATUS }),
            '',
            m('overall', { status: process.env.PAW_IN_STEPS_REPORT_OUTPUTS_OVERALL_STATUS }),
            '',
            m('details_header'),
            '',
            errorDetails,
            '',
            m('fix_header'),
            m('fix_build'),
            m('fix_error'),
            m('fix_test'),
            '',
            '---',
            m('footer', { time: new Date().toISOString().slice(0, 19).replace('T', ' ') + ' UTC' }),
          ].join('\n');
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: failureMessage
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: failureMessage
            });
          }

    - name: Create Check Run
      if: always() && steps.load_messages.outcome == 'success'
      uses: actions/github-script@v9
      env:
        PAW_IN_STEPS_REPORT_OUTPUTS_BUILD_STATUS: ${{ steps.report.outputs.build_status }}
        PAW_IN_STEPS_REPORT_OUTPUTS_COMPILE_STATUS: ${{ steps.report.outputs.compile_status }}
        PAW_IN_STEPS_REPORT_OUTPUTS_OVERALL_OK: ${{ steps.report.outputs.overall_ok }}
        PAW_IN_STEPS_REPORT_OUTPUTS_TEST_STATUS: ${{ steps.report.outputs.test_status }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const M = JSON.parse(process.env.PAW_MSG);
          const m = (k, p = {}) => M['wf_spring_ci.' + k].replace(/\{(\w+)\}/g, (s, n) => (n in p ? p[n] : s));
          const conclusion = process.env.PAW_IN_STEPS_REPORT_OUTPUTS_OVERALL_OK === 'true' ? 'success' : 'failure';
          const summary = m(conclusion === 'success' ? 'check_summary_success' : 'check_summary_failure');
          
          await github.rest.checks.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            name: 'Build Verification',
            head_sha: context.sha,
            status: 'completed',
            conclusion: conclusion,
            output: {
              title: '🔧 CI Build Check',
              summary: summary,
              text: '\n    ' + m('check_compile', { status: process.env.PAW_IN_STEPS_REPORT_OUTPUTS_COMPILE_STATUS }) +
                '\n    ' + m('check_test', { status: process.env.PAW_IN_STEPS_REPORT_OUTPUTS_TEST_STATUS }) + '  ' +
                '\n    ' + m('check_build', { status: process.env.PAW_IN_STEPS_REPORT_OUTPUTS_BUILD_STATUS }) +
                '\n    '
            }
          });

    - name: Fail Job on Build Failure
      if: steps.report.outputs.overall_ok == 'false'
      run: |
        [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
        python3 "$GITHUB_WORKSPACE/.github/scripts/messages.py" get wf_spring_ci.build_failed
        exit 1

  # CI Gate (the single job to register as a required check)
  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [changes, build-check]
    runs-on: ubuntu-latest
    steps:
      # Sparse checkout: only the message catalog and version.yml (language setting) are needed here
      - name: Checkout message catalog
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/messages.py
            version.yml
          sparse-checkout-cone-mode: false

      - name: Aggregate results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          [ -f "$GITHUB_WORKSPACE/.github/scripts/messages.py" ] || { echo "::error::messages.py is missing; rerun \`npx project-auto-wizard --mode full --force\`"; exit 1; }
          m() { python3 "$GITHUB_WORKSPACE/.github/scripts/messages.py" get "$@"; }
          m wf_spring_ci.gate_results results="$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            m wf_spring_ci.gate_failed
            exit 1
          fi
