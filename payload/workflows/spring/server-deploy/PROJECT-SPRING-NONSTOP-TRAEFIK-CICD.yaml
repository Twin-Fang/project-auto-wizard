# project-auto-wizard:managed-workflow
# Spring Boot zero-downtime deploy (Traefik Blue-Green, SSH + Docker)
#
# On a push to the deploy branch, builds a Docker image and
# deploys it with no downtime to a server (any SSH-reachable host) using a Traefik label based Blue-Green toggle.
#
# This workflow is the zero-downtime deploy option.
# The default deploy is PROJECT-SPRING-SIMPLE-CICD.yaml.
# To switch, uncomment push.branches below and comment out the push trigger in SIMPLE-CICD.
#
# Required GitHub Secrets
# APPLICATION_PROD_YML (선택): contents of application-prod.yml
# DOCKERHUB_USERNAME: DockerHub username
# DOCKERHUB_TOKEN: DockerHub access token
# SERVER_HOST: deployment server address
# SERVER_USER: SSH username
# SERVER_PASSWORD: SSH password (when SSH_AUTH_METHOD=password)
# SSH_KEY: contents of the SSH private key .pem (when SSH_AUTH_METHOD=key, e.g. AWS EC2)
#
# Environment variables (set in the env section)
#
# Ports and containers:
# PROJECT_NAME: project name (container/image/Traefik router name)
# SERVICE_DOMAIN: external entry domain
# CONTAINER_INTERNAL_PORT: Spring Boot internal port (default: 8080)
#
# Traefik:
# TRAEFIK_NETWORK: Traefik docker network (default: traefik-network)
# TRAEFIK_ENTRYPOINT: Traefik entrypoint name (default: web)
# TRAEFIK_INTERNAL_PORT: Traefik entry port on the NAS host (default: 8079)
# EXTRA_NETWORKS: extra docker networks (space separated, e.g. selenium-chrome-network)
#
# Volume/storage:
# ENABLE_VOLUME_MOUNT: whether to mount a volume (true/false)
# VOLUME_HOST_PATH: host volume path
# VOLUME_CONTAINER_PATH: mount path inside the container
#
# SSH connection:
# SSH_PORT: SSH port (default: 2022)
# SSH_COMMAND_TIMEOUT: command timeout (default: 600s)
# SSH_CONNECTION_TIMEOUT: connection timeout (default: 60s)
#
# Health check:
# HEALTHCHECK_PATH: path for the GET call through Traefik (default: /)
# HEALTHCHECK_ACCEPT_CODES: HTTP codes accepted as healthy (| separated, default: 200|301|302|308)
# HEALTHCHECK_MAX_RETRIES: max attempts (default: 36)
# HEALTHCHECK_RETRY_INTERVAL: retry interval in seconds (default: 5)
# IN_FLIGHT_WAIT: seconds to wait before removing the old container (default: 10)
#
# Prerequisites:
#   - a Traefik container must be running on the deploy server in traefik-network
#   - reverse proxy: ${SERVICE_DOMAIN}:443 -> localhost:${TRAEFIK_INTERNAL_PORT}
#     (e.g. Synology DSM reverse proxy, Nginx, Caddy)

name: PROJECT-SPRING-NONSTOP-TRAEFIK-CICD

# Trigger settings
# The automatic trigger on a push to the deploy branch is commented out.
# To switch to this workflow, uncomment push.branches below.
on:
  # push:
  #   branches:
  #     - {{MAIN_BRANCH}}
  workflow_dispatch:

env:
  # Project settings - change to your actual project name
  PROJECT_NAME: "__PROJECT_NAME__"  # @wizard ask:@repo
  # Subdirectory of this project in a monorepo (--paths). Base for the build and Docker context ('.' = repo root)
  PROJECT_PATH: "."  # @wizard auto:project-path
  # In a monorepo (PROJECT_PATH is not '.') '-spring' is appended to image, container and domain names
  # so they do not collide with services of other types in the same repo (e.g. my-app-spring)
  SERVICE_DOMAIN: "__SERVICE_DOMAIN__"  # @wizard ask:example.com

  # Spring Boot settings
  SPRING_PROFILE: "prod"
  JAVA_VERSION: "__JAVA_VERSION__"  # @wizard ask:@jdk
  GRADLE_OPTS: "-Dspring.profiles.active=prod"

  # Path settings
  APPLICATION_YML_DIR: "__APPLICATION_YML_DIR__"  # @wizard auto:spring-app-yml-dir
  DOCKERFILE_PATH: "./Dockerfile"  # relative to PROJECT_PATH

  # Port and container settings
  CONTAINER_INTERNAL_PORT: "8080"

  # Traefik settings (do not change after the server's Traefik environment is set up)
  TRAEFIK_NETWORK: "traefik-network"
  TRAEFIK_ENTRYPOINT: "web"
  TRAEFIK_INTERNAL_PORT: "8079"
  EXTRA_NETWORKS: ""

  # Volume mount settings
  ENABLE_VOLUME_MOUNT: "false"  # @wizard ask:false
  VOLUME_HOST_PATH: "/volume1/projects/__PROJECT_NAME__"  # @wizard ask:/volume1/projects/__PROJECT_NAME__
  VOLUME_CONTAINER_PATH: "/mnt/__PROJECT_NAME__"  # @wizard ask:/mnt/__PROJECT_NAME__

  # SSH auth method: "password" (Synology / generic servers) | "key" (AWS EC2 / .pem)
  #   password -> uses the SERVER_PASSWORD secret
  #   key      -> uses the SSH_KEY secret (the full .pem contents as the secret value)
  SSH_AUTH_METHOD: "password"  # @wizard ask:password

  # SSH connection settings
  SSH_PORT: "__SSH_PORT__"  # @wizard ask:2022
  SSH_COMMAND_TIMEOUT: "600s"
  SSH_CONNECTION_TIMEOUT: "60s"

  # Health check settings
  HEALTHCHECK_PATH: "/"
  HEALTHCHECK_ACCEPT_CODES: "200|301|302|308"
  HEALTHCHECK_MAX_RETRIES: "36"
  HEALTHCHECK_RETRY_INTERVAL: "5"
  IN_FLIGHT_WAIT: "10"

jobs:
  # Build job
  build:
    name: Build Spring Boot application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # If a required Secret or the Dockerfile is missing, name it and stop instead of failing later in a third-party step such as docker login
      - name: Deploy pre-check (Secrets and Dockerfile)
        working-directory: ${{ env.PROJECT_PATH }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DOCKERFILE: ${{ env.DOCKERFILE_PATH }}
        run: |
          m() { python3 "$GITHUB_WORKSPACE/.github/scripts/messages.py" get "$@"; }
          MISSING=""
          for NAME in DOCKERHUB_USERNAME DOCKERHUB_TOKEN SERVER_HOST SERVER_USER; do
            [ -n "${!NAME}" ] || MISSING="$MISSING $NAME"
          done
          # SSH_AUTH_METHOD=key needs SSH_KEY, anything else needs SERVER_PASSWORD
          if [ "${SSH_AUTH_METHOD:-password}" = "key" ]; then
            [ -n "$SSH_KEY" ] || MISSING="$MISSING SSH_KEY"
          else
            [ -n "$SERVER_PASSWORD" ] || MISSING="$MISSING SERVER_PASSWORD"
          fi
          FAILED=false
          if [ -n "$MISSING" ]; then
            echo "::error title=$(m cicd.precheck_secret_title)::$(m cicd.precheck_secret_body missing="$MISSING")"
            FAILED=true
          fi
          if [ ! -f "$DOCKERFILE" ]; then
            echo "::error title=$(m cicd.precheck_dockerfile_title)::$(m cicd.precheck_dockerfile_body path="${PROJECT_PATH}/${DOCKERFILE#./}")"
            FAILED=true
          fi
          if [ "$FAILED" = "true" ]; then
            exit 1
          fi
          m cicd.precheck_ok

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        working-directory: ${{ env.PROJECT_PATH }}
        run: chmod +x gradlew

      - name: Generate application-prod.yml
        run: |
          m() { python3 "$GITHUB_WORKSPACE/.github/scripts/messages.py" get "$@"; }
          mkdir -p ${{ env.APPLICATION_YML_DIR }}
          cat << 'EOF' > ./${{ env.APPLICATION_YML_DIR }}/application-prod.yml
          ${{ secrets.APPLICATION_PROD_YML }}
          EOF
          m wf_spring_deploy.prod_yml_created dir="${{ env.APPLICATION_YML_DIR }}"

      - name: Build with Gradle
        working-directory: ${{ env.PROJECT_PATH }}
        run: ./gradlew clean build -x test ${{ env.GRADLE_OPTS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.PROJECT_PATH }}
          file: ${{ env.PROJECT_PATH }}/${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_PATH != '.' && format('{0}-spring', env.PROJECT_NAME) || env.PROJECT_NAME }}:${{ github.ref_name }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move Docker cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # Deploy job (Blue-Green, zero downtime)
  deploy:
    name: Blue-Green zero-downtime deploy
    needs: build
    runs-on: ubuntu-latest

    steps:
      # The deploy script runs on the server, which has no messages.py:
      # render the message catalog here and pass it along as a base64 env var
      - name: Checkout message catalog
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/messages.py
            version.yml
          sparse-checkout-cone-mode: false

      - name: Load messages
        run: |
          MSGS="$(python3 "$GITHUB_WORKSPACE/.github/scripts/messages.py" dump wf_spring_deploy. \
            | python3 -c 'import json, shlex, sys; d = json.load(sys.stdin); print("\n".join("M_%s=%s" % (k.replace(".", "_"), shlex.quote(v)) for k, v in d.items()))' \
            | base64 | tr -d '\n')"
          echo "PAW_MSG_B64=$MSGS" >> "$GITHUB_ENV"

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          PAW_MSG_B64: ${{ env.PAW_MSG_B64 }}
          PROJECT_NAME: ${{ env.PROJECT_PATH != '.' && format('{0}-spring', env.PROJECT_NAME) || env.PROJECT_NAME }}
          SERVICE_DOMAIN: ${{ env.SERVICE_DOMAIN }}
          CONTAINER_INTERNAL_PORT: ${{ env.CONTAINER_INTERNAL_PORT }}
          SPRING_PROFILE: ${{ env.SPRING_PROFILE }}
          ENABLE_VOLUME_MOUNT: ${{ env.ENABLE_VOLUME_MOUNT }}
          VOLUME_HOST_PATH: ${{ env.VOLUME_HOST_PATH }}
          VOLUME_CONTAINER_PATH: ${{ env.VOLUME_CONTAINER_PATH }}
          EXTRA_NETWORKS: ${{ env.EXTRA_NETWORKS }}
          TRAEFIK_NETWORK: ${{ env.TRAEFIK_NETWORK }}
          TRAEFIK_ENTRYPOINT: ${{ env.TRAEFIK_ENTRYPOINT }}
          TRAEFIK_INTERNAL_PORT: ${{ env.TRAEFIK_INTERNAL_PORT }}
          HEALTHCHECK_PATH: ${{ env.HEALTHCHECK_PATH }}
          HEALTHCHECK_ACCEPT_CODES: ${{ env.HEALTHCHECK_ACCEPT_CODES }}
          HEALTHCHECK_MAX_RETRIES: ${{ env.HEALTHCHECK_MAX_RETRIES }}
          HEALTHCHECK_RETRY_INTERVAL: ${{ env.HEALTHCHECK_RETRY_INTERVAL }}
          IN_FLIGHT_WAIT: ${{ env.IN_FLIGHT_WAIT }}
          BRANCH_REF: ${{ github.ref_name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SSH_AUTH_METHOD: ${{ env.SSH_AUTH_METHOD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          command_timeout: ${{ env.SSH_COMMAND_TIMEOUT }}
          timeout: ${{ env.SSH_CONNECTION_TIMEOUT }}
          envs: PROJECT_NAME,SERVICE_DOMAIN,CONTAINER_INTERNAL_PORT,SPRING_PROFILE,ENABLE_VOLUME_MOUNT,VOLUME_HOST_PATH,VOLUME_CONTAINER_PATH,EXTRA_NETWORKS,TRAEFIK_NETWORK,TRAEFIK_ENTRYPOINT,TRAEFIK_INTERNAL_PORT,HEALTHCHECK_PATH,HEALTHCHECK_ACCEPT_CODES,HEALTHCHECK_MAX_RETRIES,HEALTHCHECK_RETRY_INTERVAL,IN_FLIGHT_WAIT,BRANCH_REF,DOCKERHUB_USERNAME,SERVER_PASSWORD,SSH_AUTH_METHOD,PAW_MSG_B64
          script: |
            set -e
            export PATH=$PATH:/usr/local/bin
            export PW="${SERVER_PASSWORD}"

            # Messages arrive as base64 shell assignments (the server has no messages.py)
            eval "$(printf '%s' "$PAW_MSG_B64" | base64 -d)"
            m() {
              local _v="M_wf_spring_deploy_$1" _kv
              local _s="${!_v}"
              shift
              for _kv in "$@"; do _s=${_s//\{${_kv%%=*}\}/${_kv#*=}}; done
              printf '%s\n' "$_s"
            }

            # Abstract sudo by SSH auth method
            SSH_AUTH_METHOD="${SSH_AUTH_METHOD:-password}"
            if [ "${SSH_AUTH_METHOD}" = "key" ]; then
              SUDO() { sudo "$@"; }
            else
              SUDO() { echo "$PW" | sudo -S "$@"; }
            fi
            m ssh_auth_method method="${SSH_AUTH_METHOD}"

            IMAGE="${DOCKERHUB_USERNAME}/${PROJECT_NAME}:${BRANCH_REF}"
            ROUTER_NAME="${PROJECT_NAME}"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            m traefik_deploy_start
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            m banner_project name="${PROJECT_NAME}"
            m banner_domain domain="${SERVICE_DOMAIN}"
            m banner_image image="${IMAGE}"
            m traefik_entry port="${TRAEFIK_INTERNAL_PORT}" entrypoint="${TRAEFIK_ENTRYPOINT}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # 1. Pull the latest image
            m image_pull image="${IMAGE}"
            SUDO docker pull "${IMAGE}"

            # 2. Determine the color of the active container (by whether it carries the Traefik label)
            ACTIVE=$(SUDO docker ps \
              --filter "label=traefik.http.routers.${ROUTER_NAME}.rule" \
              --filter "name=${PROJECT_NAME}-" \
              --format "{{.Names}}" | head -1 || echo "")

            if [ "$ACTIVE" = "${PROJECT_NAME}-blue" ]; then
              NEW_COLOR="green"
              OLD_COLOR="blue"
            elif [ "$ACTIVE" = "${PROJECT_NAME}-green" ]; then
              NEW_COLOR="blue"
              OLD_COLOR="green"
            else
              # First deploy or no active container -> start with blue
              NEW_COLOR="blue"
              OLD_COLOR="green"
            fi

            NEW_NAME="${PROJECT_NAME}-${NEW_COLOR}"
            OLD_NAME="${PROJECT_NAME}-${OLD_COLOR}"

            echo "🎨 active=${ACTIVE:-none} → new=${NEW_NAME}, old=${OLD_NAME}"

            # 3. Clean up a leftover container in the same (idle) slot
            m idle_slot_cleanup name="${NEW_NAME}"
            SUDO docker rm -f "${NEW_NAME}" 2>/dev/null || true

            # 4. Build the volume mount option
            VOLUME_MOUNT_OPTION="-v /etc/localtime:/etc/localtime:ro"
            if [ "${ENABLE_VOLUME_MOUNT}" = "true" ]; then
              if [ ! -d "${VOLUME_HOST_PATH}" ]; then
                m volume_mkdir path="${VOLUME_HOST_PATH}"
                SUDO mkdir -p "${VOLUME_HOST_PATH}"
              fi
              VOLUME_MOUNT_OPTION="${VOLUME_MOUNT_OPTION} -v ${VOLUME_HOST_PATH}:${VOLUME_CONTAINER_PATH}"
              m volume_enabled host="${VOLUME_HOST_PATH}" container="${VOLUME_CONTAINER_PATH}"
            else
              m volume_disabled
            fi

            # 5. Start the new container (with Traefik labels)
            m new_container_start name="${NEW_NAME}"
            SUDO docker run -d \
              --name "${NEW_NAME}" \
              --network "${TRAEFIK_NETWORK}" \
              --label "traefik.enable=true" \
              --label "traefik.http.routers.${ROUTER_NAME}.rule=Host(\`${SERVICE_DOMAIN}\`)" \
              --label "traefik.http.routers.${ROUTER_NAME}.entrypoints=${TRAEFIK_ENTRYPOINT}" \
              --label "traefik.http.services.${ROUTER_NAME}.loadbalancer.server.port=${CONTAINER_INTERNAL_PORT}" \
              -e TZ=Asia/Seoul \
              -e "SPRING_PROFILES_ACTIVE=${SPRING_PROFILE}" \
              ${VOLUME_MOUNT_OPTION} \
              "${IMAGE}"

            # 6. Connect extra networks (EXTRA_NETWORKS, space separated)
            if [ -n "${EXTRA_NETWORKS}" ]; then
              for net in ${EXTRA_NETWORKS}; do
                m traefik_extra_network net="${net}"
                SUDO docker network connect "${net}" "${NEW_NAME}" 2>/dev/null || true
              done
            fi

            # 7. Print the Traefik labels for debugging (to verify escaping)
            m traefik_labels
            SUDO docker inspect "${NEW_NAME}" --format '{{range $k, $v := .Config.Labels}}  {{$k}} = {{$v}}{{"\n"}}{{end}}' | grep traefik || true

            # 8. Health check - verify routing through Traefik
            MAX_WAIT=$((HEALTHCHECK_MAX_RETRIES * HEALTHCHECK_RETRY_INTERVAL))
            m traefik_hc_start max_wait="${MAX_WAIT}" retries="${HEALTHCHECK_MAX_RETRIES}" interval="${HEALTHCHECK_RETRY_INTERVAL}"

            RETRY_COUNT=0
            HEALTHCHECK_SUCCESS=false

            while [ $RETRY_COUNT -lt $HEALTHCHECK_MAX_RETRIES ]; do
              sleep ${HEALTHCHECK_RETRY_INTERVAL}
              RETRY_COUNT=$((RETRY_COUNT + 1))

              STATUS=$(SUDO docker inspect --format='{{.State.Status}}' "${NEW_NAME}" 2>/dev/null || echo "not_found")

              if [ "$STATUS" = "exited" ]; then
                m traefik_exited
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                SUDO docker logs --tail 200 "${NEW_NAME}"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                m traefik_kept name="${NEW_NAME}"
                m traefik_rollback_note name="${OLD_NAME}"
                exit 1
              fi

              if [ "$STATUS" = "running" ]; then
                HTTP_CODE=$(curl -sm 5 -o /dev/null -w "%{http_code}" \
                  -H "Host: ${SERVICE_DOMAIN}" \
                  "http://localhost:${TRAEFIK_INTERNAL_PORT}${HEALTHCHECK_PATH}" 2>/dev/null || echo "000")

                if echo "$HTTP_CODE" | grep -Eq "^(${HEALTHCHECK_ACCEPT_CODES})$"; then
                  m traefik_hc_pass n="${RETRY_COUNT}" max="${HEALTHCHECK_MAX_RETRIES}" code="${HTTP_CODE}"
                  HEALTHCHECK_SUCCESS=true
                  break
                fi
              fi

              m traefik_waiting n="${RETRY_COUNT}" max="${HEALTHCHECK_MAX_RETRIES}" status="${STATUS}" http="${HTTP_CODE:-?}"
            done

            if [ "$HEALTHCHECK_SUCCESS" = "false" ]; then
              m traefik_hc_timeout sec="${MAX_WAIT}"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              m traefik_logs_header name="${NEW_NAME}"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              SUDO docker logs --tail 200 "${NEW_NAME}"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              m traefik_kept name="${NEW_NAME}"
              m traefik_rollback_note name="${OLD_NAME}"
              exit 1
            fi

            # 9. Let in-flight requests finish, then remove the old container automatically
            if SUDO docker ps -a --format '{{.Names}}' | grep -Eq "^${OLD_NAME}$"; then
              m inflight_wait sec="${IN_FLIGHT_WAIT}"
              sleep ${IN_FLIGHT_WAIT}
              m old_removed name="${OLD_NAME}"
              SUDO docker rm -f "${OLD_NAME}"
            else
              m old_absent name="${OLD_NAME}"
            fi

            # 10. Clean up dangling images
            m prune_dangling
            SUDO docker image prune -af

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            m traefik_done name="${NEW_NAME}"
            m banner_domain domain="https://${SERVICE_DOMAIN}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

# Usage
#
# 1) Register the GitHub Secrets:
#    APPLICATION_PROD_YML, DOCKERHUB_USERNAME, DOCKERHUB_TOKEN,
#    SERVER_HOST, SERVER_USER, SERVER_PASSWORD
#
# 2) Edit the project-specific settings in this workflow's env block:
#    - PROJECT_NAME, SERVICE_DOMAIN
#    - APPLICATION_YML_DIR, CONTAINER_INTERNAL_PORT
#    - ENABLE_VOLUME_MOUNT, VOLUME_HOST_PATH, VOLUME_CONTAINER_PATH
#    - EXTRA_NETWORKS (e.g. selenium-chrome-network)
#    - HEALTHCHECK_PATH, HEALTHCHECK_ACCEPT_CODES
#
# 3) Server preparation:
#    - a Traefik container must be running in traefik-network
#    - reverse proxy: ${SERVICE_DOMAIN}:443 -> localhost:${TRAEFIK_INTERNAL_PORT}
#      (e.g. Synology DSM reverse proxy, Nginx, Caddy)
#
# 4) Switch to this workflow:
#    - uncomment push.branches in this file
#    - comment out the push trigger in PROJECT-SPRING-SIMPLE-CICD.yaml
