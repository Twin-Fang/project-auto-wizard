# project-auto-wizard:managed-workflow
# Spring Boot zero-downtime deploy (Nginx Blue-Green, SSH + Docker)
#
# On a push to the deploy branch, builds a Docker image and
# deploys it Blue-Green with no downtime by toggling the proxy_pass port in the nginx config.
#
# This workflow is the zero-downtime deploy option.
# The default deploy is PROJECT-SPRING-SIMPLE-CICD.yaml.
# To switch, uncomment push.branches below and comment out the push trigger in SIMPLE-CICD.
#
# Required GitHub Secrets
# APPLICATION_PROD_YML (optional): contents of application-prod.yml
# DOCKERHUB_USERNAME: DockerHub username
# DOCKERHUB_TOKEN: DockerHub access token
# SERVER_HOST: deployment server address
# SERVER_USER: SSH username
# SERVER_PASSWORD: SSH password (when SSH_AUTH_METHOD=password)
# SSH_KEY: contents of the SSH private key .pem (when SSH_AUTH_METHOD=key, e.g. AWS EC2)
#
# Environment variables (set in the env section)
#
# Ports and containers:
# PROJECT_NAME: project name (container/image name)
# SERVICE_DOMAIN: external domain (must match the nginx server_name)
# CONTAINER_INTERNAL_PORT: Spring Boot internal port (default: 8080)
# BLUE_PORT: host port exposed by Blue (default: 8080)
# GREEN_PORT: host port exposed by Green (default: 8081)
#
# Nginx:
# NGINX_RP_CONF: path of the nginx reverse proxy config file
# NGINX_BACKUP_DIR: directory for nginx config backups
# NGINX_BACKUP_KEEP: number of backups to keep (default: 10)
#
# Volume/storage:
# ENABLE_VOLUME_MOUNT: whether to mount a volume (true/false)
# VOLUME_HOST_PATH: host volume path
# VOLUME_CONTAINER_PATH: mount path inside the container
#
# SSH connection:
# SSH_PORT: SSH port (default: 2022)
# SSH_COMMAND_TIMEOUT: command timeout (default: 600s)
# SSH_CONNECTION_TIMEOUT: connection timeout (default: 60s)
#
# Health check:
# HEALTHCHECK_PATH: HTTP path (default: /actuator/health, fallback: /)
# HEALTHCHECK_MAX_RETRIES: max container health check attempts (default: 120)
# HEALTHCHECK_RETRY_INTERVAL: retry interval in seconds (default: 1)
# DOMAIN_CHECK_RETRIES: domain check attempts after the nginx reload (default: 10)
# DOMAIN_CHECK_INTERVAL: domain check interval in seconds (default: 2)
# IN_FLIGHT_WAIT: seconds to wait before removing the old container (default: 5)
#
# Prerequisites:
#   - nginx is installed on the server and a sites-enabled config exists
#   - the server block of that config contains these lines:
#       server_name ${SERVICE_DOMAIN};
#       proxy_pass http://127.0.0.1:${BLUE_PORT};   # or ${GREEN_PORT}
#   - the SSH user can run nginx -t / reload and docker commands via sudo

name: PROJECT-SPRING-NONSTOP-NGINX-CICD

# Trigger settings
# The automatic trigger on a push to the deploy branch is commented out.
# To switch to this workflow, uncomment push.branches below.
on:
  # push:
  #   branches:
  #     - {{MAIN_BRANCH}}
  workflow_dispatch:

env:
  # Project settings - change to your actual project name
  PROJECT_NAME: "__PROJECT_NAME__"  # @wizard ask:@repo
  # Subdirectory of this project in a monorepo (--paths). Base for the build and Docker context ('.' = repo root)
  PROJECT_PATH: "."  # @wizard auto:project-path
  # In a monorepo (PROJECT_PATH is not '.') '-spring' is appended to image, container and domain names
  # so they do not collide with services of other types in the same repo (e.g. my-app-spring)
  SERVICE_DOMAIN: "__SERVICE_DOMAIN__"  # @wizard ask:example.com

  # Spring Boot settings
  SPRING_PROFILE: "prod"
  JAVA_VERSION: "__JAVA_VERSION__"  # @wizard ask:@jdk
  GRADLE_OPTS: "-Dspring.profiles.active=prod"

  # Path settings
  APPLICATION_YML_DIR: "__APPLICATION_YML_DIR__"  # @wizard auto:spring-app-yml-dir
  DOCKERFILE_PATH: "./Dockerfile"  # relative to PROJECT_PATH

  # Port and container settings
  # BLUE/GREEN are the host ports of the two containers that alternate on the server - the deploy fails if they clash with another service.
  CONTAINER_INTERNAL_PORT: "8080"
  BLUE_PORT: "__BLUE_PORT__"  # @wizard ask:8080
  GREEN_PORT: "__GREEN_PORT__"  # @wizard ask:8081

  # Nginx settings
  # If the NGINX_RP_CONF path is wrong, the zero-downtime switch (proxy_pass port toggle) cannot work at all.
  NGINX_RP_CONF: "__NGINX_RP_CONF__"  # @wizard ask:/etc/nginx/sites-enabled/__PROJECT_NAME__.conf
  NGINX_BACKUP_DIR: "__NGINX_BACKUP_DIR__"  # @wizard ask:/volume1/projects/nginx/backups
  NGINX_BACKUP_KEEP: "10"

  # Volume mount settings
  ENABLE_VOLUME_MOUNT: "false"  # @wizard ask:false
  VOLUME_HOST_PATH: "/volume1/projects/__PROJECT_NAME__"  # @wizard ask:/volume1/projects/__PROJECT_NAME__
  VOLUME_CONTAINER_PATH: "/app"  # @wizard ask:/app

  # SSH auth method: "password" (Synology / generic servers) | "key" (AWS EC2 / .pem)
  #   password -> uses the SERVER_PASSWORD secret
  #   key      -> uses the SSH_KEY secret (the full .pem contents as the secret value)
  SSH_AUTH_METHOD: "password"  # @wizard ask:password

  # SSH connection settings
  SSH_PORT: "__SSH_PORT__"  # @wizard ask:2022
  SSH_COMMAND_TIMEOUT: "600s"
  SSH_CONNECTION_TIMEOUT: "60s"

  # Health check settings
  HEALTHCHECK_PATH: "/actuator/health"
  HEALTHCHECK_MAX_RETRIES: "120"
  HEALTHCHECK_RETRY_INTERVAL: "1"
  DOMAIN_CHECK_RETRIES: "10"
  DOMAIN_CHECK_INTERVAL: "2"
  IN_FLIGHT_WAIT: "5"

jobs:
  # Build job
  build:
    name: Build Spring Boot application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # If a required Secret or the Dockerfile is missing, name it and stop instead of failing later in a third-party step such as docker login
      - name: Deploy pre-check (Secrets and Dockerfile)
        working-directory: ${{ env.PROJECT_PATH }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DOCKERFILE: ${{ env.DOCKERFILE_PATH }}
        run: |
          m() { python3 "$GITHUB_WORKSPACE/.github/scripts/messages.py" get "$@"; }
          MISSING=""
          for NAME in DOCKERHUB_USERNAME DOCKERHUB_TOKEN SERVER_HOST SERVER_USER; do
            [ -n "${!NAME}" ] || MISSING="$MISSING $NAME"
          done
          # SSH_AUTH_METHOD=key needs SSH_KEY, anything else needs SERVER_PASSWORD
          if [ "${SSH_AUTH_METHOD:-password}" = "key" ]; then
            [ -n "$SSH_KEY" ] || MISSING="$MISSING SSH_KEY"
          else
            [ -n "$SERVER_PASSWORD" ] || MISSING="$MISSING SERVER_PASSWORD"
          fi
          FAILED=false
          if [ -n "$MISSING" ]; then
            echo "::error title=$(m cicd.precheck_secret_title)::$(m cicd.precheck_secret_body missing="$MISSING")"
            FAILED=true
          fi
          if [ ! -f "$DOCKERFILE" ]; then
            echo "::error title=$(m cicd.precheck_dockerfile_title)::$(m cicd.precheck_dockerfile_body path="${PROJECT_PATH}/${DOCKERFILE#./}")"
            FAILED=true
          fi
          if [ "$FAILED" = "true" ]; then
            exit 1
          fi
          m cicd.precheck_ok

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        working-directory: ${{ env.PROJECT_PATH }}
        run: chmod +x gradlew

      - name: Generate application-prod.yml
        run: |
          m() { python3 "$GITHUB_WORKSPACE/.github/scripts/messages.py" get "$@"; }
          mkdir -p ${{ env.APPLICATION_YML_DIR }}
          cat << 'EOF' > ./${{ env.APPLICATION_YML_DIR }}/application-prod.yml
          ${{ secrets.APPLICATION_PROD_YML }}
          EOF
          m wf_spring_deploy.prod_yml_created dir="${{ env.APPLICATION_YML_DIR }}"

      - name: Build with Gradle
        working-directory: ${{ env.PROJECT_PATH }}
        run: ./gradlew clean build -x test ${{ env.GRADLE_OPTS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.PROJECT_PATH }}
          file: ${{ env.PROJECT_PATH }}/${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_PATH != '.' && format('{0}-spring', env.PROJECT_NAME) || env.PROJECT_NAME }}:${{ github.ref_name }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move Docker cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # Deploy job (Blue-Green, zero downtime)
  deploy:
    name: Blue-Green zero-downtime deploy
    needs: build
    runs-on: ubuntu-latest

    steps:
      # The deploy script runs on the server, which has no messages.py:
      # render the message catalog here and pass it along as a base64 env var
      - name: Checkout message catalog
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/messages.py
            version.yml
          sparse-checkout-cone-mode: false

      - name: Load messages
        run: |
          MSGS="$(python3 "$GITHUB_WORKSPACE/.github/scripts/messages.py" dump wf_spring_deploy. \
            | python3 -c 'import json, shlex, sys; d = json.load(sys.stdin); print("\n".join("M_%s=%s" % (k.replace(".", "_"), shlex.quote(v)) for k, v in d.items()))' \
            | base64 | tr -d '\n')"
          echo "PAW_MSG_B64=$MSGS" >> "$GITHUB_ENV"

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          PAW_MSG_B64: ${{ env.PAW_MSG_B64 }}
          PROJECT_NAME: ${{ env.PROJECT_PATH != '.' && format('{0}-spring', env.PROJECT_NAME) || env.PROJECT_NAME }}
          SERVICE_DOMAIN: ${{ env.SERVICE_DOMAIN }}
          SPRING_PROFILE: ${{ env.SPRING_PROFILE }}
          CONTAINER_INTERNAL_PORT: ${{ env.CONTAINER_INTERNAL_PORT }}
          BLUE_PORT: ${{ env.BLUE_PORT }}
          GREEN_PORT: ${{ env.GREEN_PORT }}
          ENABLE_VOLUME_MOUNT: ${{ env.ENABLE_VOLUME_MOUNT }}
          VOLUME_HOST_PATH: ${{ env.VOLUME_HOST_PATH }}
          VOLUME_CONTAINER_PATH: ${{ env.VOLUME_CONTAINER_PATH }}
          NGINX_RP_CONF: ${{ env.NGINX_RP_CONF }}
          NGINX_BACKUP_DIR: ${{ env.NGINX_BACKUP_DIR }}
          NGINX_BACKUP_KEEP: ${{ env.NGINX_BACKUP_KEEP }}
          HEALTHCHECK_MAX_RETRIES: ${{ env.HEALTHCHECK_MAX_RETRIES }}
          HEALTHCHECK_RETRY_INTERVAL: ${{ env.HEALTHCHECK_RETRY_INTERVAL }}
          HEALTHCHECK_PATH: ${{ env.HEALTHCHECK_PATH }}
          DOMAIN_CHECK_RETRIES: ${{ env.DOMAIN_CHECK_RETRIES }}
          DOMAIN_CHECK_INTERVAL: ${{ env.DOMAIN_CHECK_INTERVAL }}
          IN_FLIGHT_WAIT: ${{ env.IN_FLIGHT_WAIT }}
          BRANCH_REF: ${{ github.ref_name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SSH_AUTH_METHOD: ${{ env.SSH_AUTH_METHOD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          command_timeout: ${{ env.SSH_COMMAND_TIMEOUT }}
          timeout: ${{ env.SSH_CONNECTION_TIMEOUT }}
          envs: PROJECT_NAME,SERVICE_DOMAIN,SPRING_PROFILE,CONTAINER_INTERNAL_PORT,BLUE_PORT,GREEN_PORT,ENABLE_VOLUME_MOUNT,VOLUME_HOST_PATH,VOLUME_CONTAINER_PATH,NGINX_RP_CONF,NGINX_BACKUP_DIR,NGINX_BACKUP_KEEP,HEALTHCHECK_MAX_RETRIES,HEALTHCHECK_RETRY_INTERVAL,HEALTHCHECK_PATH,DOMAIN_CHECK_RETRIES,DOMAIN_CHECK_INTERVAL,IN_FLIGHT_WAIT,BRANCH_REF,DOCKERHUB_USERNAME,SERVER_PASSWORD,SSH_AUTH_METHOD,PAW_MSG_B64
          script: |
            set -e
            export PATH=$PATH:/usr/local/bin
            export PW="${SERVER_PASSWORD}"

            # Messages arrive as base64 shell assignments (the server has no messages.py)
            eval "$(printf '%s' "$PAW_MSG_B64" | base64 -d)"
            m() {
              local _v="M_wf_spring_deploy_$1" _kv
              local _s="${!_v}"
              shift
              for _kv in "$@"; do _s=${_s//\{${_kv%%=*}\}/${_kv#*=}}; done
              printf '%s\n' "$_s"
            }

            # Abstract sudo by SSH auth method
            SSH_AUTH_METHOD="${SSH_AUTH_METHOD:-password}"
            if [ "${SSH_AUTH_METHOD}" = "key" ]; then
              SUDO() { sudo "$@"; }
            else
              SUDO() { echo "$PW" | sudo -S "$@"; }
            fi
            m ssh_auth_method method="${SSH_AUTH_METHOD}"

            IMAGE="${DOCKERHUB_USERNAME}/${PROJECT_NAME}:${BRANCH_REF}"
            BLUE_CONTAINER_NAME="${PROJECT_NAME}-blue"
            GREEN_CONTAINER_NAME="${PROJECT_NAME}-green"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            m nginx_deploy_start
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            m banner_project name="${PROJECT_NAME}"
            m banner_domain domain="${SERVICE_DOMAIN}"
            m banner_image image="${IMAGE}"
            echo "🎨 Blue=${BLUE_PORT} | Green=${GREEN_PORT}"
            echo "🔧 Nginx config: ${NGINX_RP_CONF}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # 1. Pull the latest image
            m image_pull image="${IMAGE}"
            SUDO docker pull "${IMAGE}"

            # 2. Back up the nginx config
            m nginx_backup_dir dir="${NGINX_BACKUP_DIR}"
            SUDO mkdir -p "${NGINX_BACKUP_DIR}"

            BACKUP_FILE="${NGINX_BACKUP_DIR}/server.ReverseProxy.conf.$(date +%Y%m%d_%H%M%S).bak"
            m nginx_backup_file file="${BACKUP_FILE}"
            SUDO cp "${NGINX_RP_CONF}" "${BACKUP_FILE}"

            # 3. Determine the active port (parse proxy_pass in the nginx config)
            m nginx_find_active
            ACTIVE_PORT=$(
              SUDO awk -v dom="${SERVICE_DOMAIN}" '
                BEGIN {
                  inserver=0; depth=0; entry_depth=0;
                  dom_esc = dom;
                  gsub(/[.[\]()+*?^$\\|]/, "\\\\&", dom_esc);
                }
                {
                  raw = $0;
                  line = raw;
                  sub(/#.*/, "", line);
                  depth += gsub(/\{/, "{", line);
                  depth -= gsub(/\}/, "}", line);

                  if (!inserver && line ~ /^[[:space:]]*server_name[[:space:]]+/) {
                    tmp = line;
                    sub(/^[[:space:]]*server_name[[:space:]]+/, "", tmp);
                    sub(/[[:space:]]*;.*/, "", tmp);
                    if (match(tmp, "(^|[[:space:]])" dom_esc "([[:space:]]|$)")) {
                      inserver=1; entry_depth=depth;
                    }
                  }

                  if (inserver && line ~ /proxy_pass[[:space:]]+https?:\/\/(localhost|127\.0\.0\.1):[0-9]{2,5}/) {
                    if (match(line, /https?:\/\/(localhost|127\.0\.0\.1):([0-9]{2,5})/, a)) { print a[2]; exit }
                  }

                  if (inserver && (depth < entry_depth || (depth==0 && entry_depth==0))) inserver=0;
                }
              ' "${NGINX_RP_CONF}" || true
            )

            if [ -z "${ACTIVE_PORT}" ]; then
              m nginx_active_missing blue="${BLUE_PORT}"
              ACTIVE_PORT="${BLUE_PORT}"
            fi
            m nginx_active_port port="${ACTIVE_PORT}"

            if [ "${ACTIVE_PORT}" = "${BLUE_PORT}" ]; then
              NEW_PORT="${GREEN_PORT}"
              NEW_CONTAINER_NAME="${GREEN_CONTAINER_NAME}"
              OLD_CONTAINER_NAME="${BLUE_CONTAINER_NAME}"
            else
              NEW_PORT="${BLUE_PORT}"
              NEW_CONTAINER_NAME="${BLUE_CONTAINER_NAME}"
              OLD_CONTAINER_NAME="${GREEN_CONTAINER_NAME}"
            fi

            m nginx_new_deploy port="${NEW_PORT}" name="${NEW_CONTAINER_NAME}"
            m nginx_old_container name="${OLD_CONTAINER_NAME}"

            # 4. Clean up a leftover container in the same (idle) slot
            if SUDO docker ps -a --format '{{.Names}}' | grep -Eq "^${NEW_CONTAINER_NAME}\$"; then
              m idle_slot_cleanup name="${NEW_CONTAINER_NAME}"
              SUDO docker rm -f "${NEW_CONTAINER_NAME}"
            fi

            # 5. Build the volume mount option
            VOLUME_MOUNT_OPTION="-v /etc/localtime:/etc/localtime:ro"
            if [ "${ENABLE_VOLUME_MOUNT}" = "true" ]; then
              if [ ! -d "${VOLUME_HOST_PATH}" ]; then
                m volume_mkdir path="${VOLUME_HOST_PATH}"
                SUDO mkdir -p "${VOLUME_HOST_PATH}"
              fi
              VOLUME_MOUNT_OPTION="${VOLUME_MOUNT_OPTION} -v ${VOLUME_HOST_PATH}:${VOLUME_CONTAINER_PATH}"
              m volume_enabled host="${VOLUME_HOST_PATH}" container="${VOLUME_CONTAINER_PATH}"
            else
              m volume_disabled
            fi

            # 6. Start the new container
            m nginx_new_container_start name="${NEW_CONTAINER_NAME}" port="${NEW_PORT}"
            SUDO docker run -d \
              -p ${NEW_PORT}:${CONTAINER_INTERNAL_PORT} \
              --name "${NEW_CONTAINER_NAME}" \
              -e TZ=Asia/Seoul \
              -e "SPRING_PROFILES_ACTIVE=${SPRING_PROFILE}" \
              ${VOLUME_MOUNT_OPTION} \
              "${IMAGE}"

            # 7. Container health check (call the local port directly)
            m nginx_hc_start retries="${HEALTHCHECK_MAX_RETRIES}" interval="${HEALTHCHECK_RETRY_INTERVAL}"
            HEALTHCHECK_SUCCESS=false
            for i in $(seq 1 ${HEALTHCHECK_MAX_RETRIES}); do
              if curl -fsS "http://127.0.0.1:${NEW_PORT}${HEALTHCHECK_PATH}" >/dev/null 2>&1 || \
                 curl -fsS "http://127.0.0.1:${NEW_PORT}/" >/dev/null 2>&1 ; then
                m nginx_hc_ok i="${i}"
                HEALTHCHECK_SUCCESS=true
                break
              fi
              m nginx_hc_progress i="${i}" max="${HEALTHCHECK_MAX_RETRIES}"
              sleep ${HEALTHCHECK_RETRY_INTERVAL}
            done

            if [ "${HEALTHCHECK_SUCCESS}" != "true" ]; then
              m nginx_hc_fail
              SUDO docker logs --tail 200 "${NEW_CONTAINER_NAME}" || true
              m nginx_new_cleanup name="${NEW_CONTAINER_NAME}"
              SUDO docker rm -f "${NEW_CONTAINER_NAME}" || true
              exit 1
            fi

            # 8. Toggle the nginx config port (replace the proxy_pass port)
            m nginx_toggle old="${ACTIVE_PORT}" new="${NEW_PORT}"
            TMP_FILE="$(mktemp)"
            SUDO awk -v dom="${SERVICE_DOMAIN}" -v new_port="${NEW_PORT}" '
              BEGIN {
                inserver=0; depth=0; entry_depth=0;
                dom_esc = dom;
                gsub(/[.[\]()+*?^$\\|]/, "\\\\&", dom_esc);
              }
              {
                if ($0 ~ "server_name[[:space:]]+" dom_esc "[[:space:]]*;") {
                  inserver=1;
                  entry_depth=depth;
                }

                line = $0;
                sub(/#.*/, "", line);
                depth += gsub(/\{/, "{", line);
                depth -= gsub(/\}/, "}", line);

                if (inserver && \
                    $0 !~ /^[[:space:]]*#/ && \
                    $0 ~ /proxy_pass[[:space:]]+https?:\/\/(localhost|127\.0\.0\.1):[0-9]{2,5}/) {
                  sub(/:[0-9]{2,5}/, ":" new_port);
                }

                print;

                if (inserver && (depth < entry_depth || (depth == 0 && entry_depth == 0))) {
                  inserver=0;
                }
              }
            ' "${NGINX_RP_CONF}" > "${TMP_FILE}"

            # 9. Validate the nginx config and reload (restore the backup on failure)
            m nginx_apply
            SUDO cp "${TMP_FILE}" "${NGINX_RP_CONF}"
            if ! (SUDO nginx -t); then
              m nginx_test_fail
              SUDO cp "${BACKUP_FILE}" "${NGINX_RP_CONF}"
              SUDO rm -f "${BACKUP_FILE}"
              rm -f "${TMP_FILE}"
              m nginx_new_cleanup name="${NEW_CONTAINER_NAME}"
              SUDO docker rm -f "${NEW_CONTAINER_NAME}" || true
              exit 1
            fi
            m nginx_test_ok
            rm -f "${TMP_FILE}"

            echo "🔄 nginx reload"
            if ! (SUDO systemctl reload nginx); then
              m nginx_reload_fail
              if ! (SUDO systemctl restart nginx); then
                m nginx_restart_fail
                SUDO cp "${BACKUP_FILE}" "${NGINX_RP_CONF}"
                SUDO systemctl restart nginx
                SUDO rm -f "${BACKUP_FILE}"
                m nginx_new_cleanup name="${NEW_CONTAINER_NAME}"
                SUDO docker rm -f "${NEW_CONTAINER_NAME}" || true
                exit 1
              fi
            fi

            # 10. Verify domain access
            m nginx_domain_check domain="${SERVICE_DOMAIN}"
            DOMAIN_OK=false
            for i in $(seq 1 ${DOMAIN_CHECK_RETRIES}); do
              if curl -fsS "https://${SERVICE_DOMAIN}${HEALTHCHECK_PATH}" >/dev/null 2>&1 || \
                 curl -fsS "https://${SERVICE_DOMAIN}/" >/dev/null 2>&1 ; then
                m nginx_domain_ok i="${i}"
                DOMAIN_OK=true
                break
              fi
              m nginx_domain_progress i="${i}" max="${DOMAIN_CHECK_RETRIES}"
              sleep ${DOMAIN_CHECK_INTERVAL}
            done

            if [ "${DOMAIN_OK}" != "true" ]; then
              m nginx_domain_fail
            fi

            # 11. Remove the previous container
            m inflight_wait sec="${IN_FLIGHT_WAIT}"
            sleep ${IN_FLIGHT_WAIT}

            if SUDO docker ps -a --format '{{.Names}}' | grep -Eq "^${OLD_CONTAINER_NAME}\$"; then
              m old_removed name="${OLD_CONTAINER_NAME}"
              SUDO docker rm -f "${OLD_CONTAINER_NAME}" || true
            else
              m old_absent name="${OLD_CONTAINER_NAME}"
            fi

            # 12. Clean up dangling images and keep only recent backups
            m prune_dangling
            SUDO docker image prune -af

            m nginx_backup_keep keep="${NGINX_BACKUP_KEEP}"
            KEEP_PLUS_ONE=$((NGINX_BACKUP_KEEP + 1))
            SUDO /bin/bash -c "ls -1t '${NGINX_BACKUP_DIR}'/server.ReverseProxy.conf.*.bak 2>/dev/null | tail -n +${KEEP_PLUS_ONE} | xargs -r rm -f"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            m nginx_done name="${NEW_CONTAINER_NAME}" port="${NEW_PORT}"
            m banner_domain domain="https://${SERVICE_DOMAIN}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

# Usage
#
# 1) Register the GitHub Secrets:
#    APPLICATION_PROD_YML, DOCKERHUB_USERNAME, DOCKERHUB_TOKEN,
#    SERVER_HOST, SERVER_USER, SERVER_PASSWORD
#
# 2) Edit the project-specific settings in this workflow's env block:
#    - PROJECT_NAME, SERVICE_DOMAIN
#    - APPLICATION_YML_DIR, CONTAINER_INTERNAL_PORT
#    - BLUE_PORT, GREEN_PORT (two different host ports)
#    - NGINX_RP_CONF, NGINX_BACKUP_DIR
#    - ENABLE_VOLUME_MOUNT, VOLUME_HOST_PATH, VOLUME_CONTAINER_PATH
#
# 3) Server preparation:
#    - nginx installed and a sites-enabled config present
#    - the server block of that config contains these lines:
#        server_name ${SERVICE_DOMAIN};
#        proxy_pass http://127.0.0.1:${BLUE_PORT};   # or ${GREEN_PORT}
#    - the SSH user can run nginx -t / reload and docker commands via sudo
#
# 4) Switch to this workflow:
#    - uncomment push.branches in this file
#    - comment out the push trigger in PROJECT-SPRING-SIMPLE-CICD.yaml
