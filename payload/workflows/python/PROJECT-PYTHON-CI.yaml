# project-auto-wizard:managed-workflow
# Python build verification workflow (CI only)
# - On push/PR to the {{DEVELOP_BRANCH}} branch: install dependencies -> pytest -> Docker build (if a Dockerfile exists)
# - Dependencies: requirements.txt if present, otherwise `pip install .` from pyproject.toml/setup.py
# - Tests: pytest runs only when a tests/ or test/ folder or test_*.py / *_test.py files exist (skipped otherwise)
# - A missing Dockerfile does not fail the run (only the Docker build verification is skipped)
# - Does not deploy (deployment happens only on the {{MAIN_BRANCH}} branch)
#
# GitHub Secrets
# - ENV_FILE (optional): contents of the .env file — verified with an empty .env when missing

name: PROJECT-PYTHON-CI

on:
  push:
    branches:
      - "{{DEVELOP_BRANCH}}"  # build verification on push to the {{DEVELOP_BRANCH}} branch
  pull_request:
    branches:
      - "{{DEVELOP_BRANCH}}"  # build verification on PRs to the {{DEVELOP_BRANCH}} branch
  workflow_dispatch:  # allow manual runs

env:
  # Unique project identifier (used for container, image and domain names)
  PROJECT_NAME: "__PROJECT_NAME__"  # @wizard ask:@repo
  # Subdirectory of this project in a monorepo ('.' means always verify)
  PROJECT_PATH: "."  # @wizard auto:project-path
  # Python version used for tests and dependency install
  PYTHON_VERSION: "3.12"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      project: ${{ steps.filter.outputs.project }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check whether the project path changed
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          # A push only looks at this push's range (against the previous commit, 'before'). Left empty it would be the cumulative diff against the default branch.
          # The first push of a new branch (before is 0) and PRs get an empty value -> default behavior (against the default branch / PR base)
          base: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
          filters: |
            project:
              - '${{ env.PROJECT_PATH == '.' && '**' || format('{0}/**', env.PROJECT_PATH) }}'

  build-check:
    name: Python build verification
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.project == 'true' }}
    # In a monorepo (--paths), build inside that subfolder
    defaults:
      run:
        working-directory: ${{ env.PROJECT_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create .env file
        run: |
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          cat > .env << 'EOF'
          ${{ secrets.ENV_FILE }}
          EOF
          m cicd.dotenv_created

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ] || [ -f setup.py ]; then
            pip install .
          else
            m cibuild.py_no_deps
          fi
          # Also install dev dependencies when present (pytest, etc.)
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      # Projects without tests are skipped rather than failed
      - name: Run tests (pytest)
        run: |
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          if [ -d tests ] || [ -d test ] || [ -n "$(find . \( -path ./.venv -o -path ./venv -o -path ./node_modules -o -path ./.git \) -prune -o \( -name 'test_*.py' -o -name '*_test.py' \) -type f -print -quit)" ]; then
            python -m pytest --version > /dev/null 2>&1 || pip install pytest
            set +e
            python -m pytest
            code=$?
            set -e
            # 5 = no tests collected -> not treated as a failure
            if [ "$code" -eq 5 ]; then
              m cibuild.py_no_tests_collected
              exit 0
            fi
            exit "$code"
          else
            m cibuild.py_no_test_files
          fi

      - name: Check for Dockerfile
        id: dockerfile
        run: |
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          if [ -f Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            m cibuild.py_no_dockerfile path="${{ env.PROJECT_PATH }}"
          fi

      - name: Set up Docker Buildx
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Verify Docker image build
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.PROJECT_PATH }}
          file: ${{ env.PROJECT_PATH }}/Dockerfile
          push: false  # do not push (build verification only)
          tags: ${{ env.PROJECT_NAME }}:build-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build verification complete
        run: |
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          m cibuild.python_done
          echo ""
          m cibuild.info_title
          m cibuild.info_project project="${{ env.PROJECT_NAME }}"
          m cibuild.info_branch branch="${{ github.ref_name }}"
          m cibuild.info_commit sha="${{ github.sha }}"
          m cibuild.info_time time="$(date '+%Y-%m-%d %H:%M:%S')"

  # CI Gate: the single job to register as a required check
  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [changes, build-check]
    runs-on: ubuntu-latest
    steps:
      # Only the message catalog is needed here, so check out just that
      - name: Checkout message catalog
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/messages.py
            version.yml
          sparse-checkout-cone-mode: false

      - name: Aggregate results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          m() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/messages.py get "$@"); }
          m cibuild.gate_results results="$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            m cibuild.gate_failed
            exit 1
          fi
