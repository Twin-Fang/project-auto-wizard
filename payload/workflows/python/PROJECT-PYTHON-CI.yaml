# project-auto-wizard:managed-workflow
# Python 빌드 검증 워크플로우 (CI Only)
# - {{DEVELOP_BRANCH}} 브랜치 push/PR 시 의존성 설치 → pytest → (Dockerfile이 있으면) Docker 빌드로 검증
# - 의존성: requirements.txt가 있으면 그것을, 없으면 pyproject.toml/setup.py로 `pip install .`
# - 테스트: tests/·test/ 폴더나 test_*.py·*_test.py가 있을 때만 pytest 실행 (없으면 건너뜀)
# - Dockerfile이 없어도 실패하지 않는다 (Docker 빌드 검증만 건너뜀)
# - 배포는 수행하지 않음 ({{MAIN_BRANCH}} 브랜치에서만 배포)
#
# GitHub Secrets
# - ENV_FILE (선택): .env 파일 내용 — 없으면 빈 .env로 검증합니다

name: PROJECT-PYTHON-CI

on:
  push:
    branches:
      - "{{DEVELOP_BRANCH}}"  # {{DEVELOP_BRANCH}} 브랜치 push 시 빌드 검증
  pull_request:
    branches:
      - "{{DEVELOP_BRANCH}}"  # {{DEVELOP_BRANCH}} 브랜치로의 PR 시 빌드 검증
  workflow_dispatch:  # 수동 실행 허용

env:
  # 프로젝트 고유 식별자 (컨테이너명, 이미지명, 도메인에 사용)
  PROJECT_NAME: "__PROJECT_NAME__"  # @wizard ask:@repo
  # 모노레포에서 이 프로젝트가 있는 하위 경로 ('.'이면 항상 검증)
  PROJECT_PATH: "."  # @wizard auto:project-path
  # 테스트·의존성 설치에 쓸 Python 버전
  PYTHON_VERSION: "3.12"

jobs:
  changes:
    name: 변경 감지
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      project: ${{ steps.filter.outputs.project }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: 프로젝트 경로 변경 여부 판별
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          # push는 이번 push 범위(직전 커밋 before 대비)만 본다. 비워 두면 기본 브랜치 대비 누적 diff가 된다.
          # 새 브랜치 첫 push(before가 0)와 PR은 빈 값 → 기본 동작(기본 브랜치·PR base 대비)
          base: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
          filters: |
            project:
              - '${{ env.PROJECT_PATH == '.' && '**' || format('{0}/**', env.PROJECT_PATH) }}'

  build-check:
    name: Python 빌드 검증
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.project == 'true' }}
    # 모노레포(--paths)면 그 하위 폴더에서 빌드한다
    defaults:
      run:
        working-directory: ${{ env.PROJECT_PATH }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v7

      - name: .env 파일 생성
        run: |
          cat > .env << 'EOF'
          ${{ secrets.ENV_FILE }}
          EOF
          echo "✅ .env 파일이 생성되었습니다"

      - name: Python 설정
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ] || [ -f setup.py ]; then
            pip install .
          else
            echo "::notice::requirements.txt·pyproject.toml·setup.py가 없어 의존성 설치를 건너뜁니다"
          fi
          # 개발용 의존성은 있으면 함께 설치 (pytest 등)
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      # 테스트가 없는 프로젝트는 실패가 아니라 건너뜀으로 처리한다
      - name: 테스트 실행 (pytest)
        run: |
          if [ -d tests ] || [ -d test ] || [ -n "$(find . \( -path ./.venv -o -path ./venv -o -path ./node_modules -o -path ./.git \) -prune -o \( -name 'test_*.py' -o -name '*_test.py' \) -type f -print -quit)" ]; then
            python -m pytest --version > /dev/null 2>&1 || pip install pytest
            set +e
            python -m pytest
            code=$?
            set -e
            # 5 = 수집된 테스트 없음 → 실패로 보지 않는다
            if [ "$code" -eq 5 ]; then
              echo "::notice::수집된 테스트가 없어 pytest를 건너뜁니다"
              exit 0
            fi
            exit "$code"
          else
            echo "::notice::테스트 파일(tests/, test_*.py 등)이 없어 pytest를 건너뜁니다"
          fi

      - name: Dockerfile 확인
        id: dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ env.PROJECT_PATH }}/Dockerfile이 없어 Docker 빌드 검증을 건너뜁니다"
          fi

      - name: Docker 빌드환경 설정
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Docker 이미지 빌드 검증
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.PROJECT_PATH }}
          file: ${{ env.PROJECT_PATH }}/Dockerfile
          push: false  # 푸시하지 않음 (빌드 검증만)
          tags: ${{ env.PROJECT_NAME }}:build-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 빌드 검증 완료
        run: |
          echo "✅ Python 빌드 검증이 성공적으로 완료되었습니다!"
          echo ""
          echo "📋 빌드 정보:"
          echo "  🎯 프로젝트: ${{ env.PROJECT_NAME }}"
          echo "  🌿 브랜치: ${{ github.ref_name }}"
          echo "  📝 커밋: ${{ github.sha }}"
          echo "  ⏰ 검증 시간: $(date '+%Y-%m-%d %H:%M:%S')"

  # CI Gate: required check로 등록할 단일 job
  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [changes, build-check]
    runs-on: ubuntu-latest
    steps:
      - name: 결과 집계
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "needs 결과: $RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "실패하거나 취소된 job이 있습니다."
            exit 1
          fi
